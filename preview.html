  object-fit: cover;
}
.mp-music-cover.is-list { width: 58px; height: 58px; border-radius: 14px; }
.mp-music-cover.is-detail { width: 92px; height: 92px; border-radius: 20px; }
.mp-music-cover.is-small { width: 42px; height: 42px; border-radius: 12px; }
.mp-music-cover.is-empty {
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, .92);
}
.mp-music-cover.is-empty .mp-i { width: 22px; height: 22px; }

.mp-music-card {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: 20px;
  font: inherit;
  text-align: left;
  cursor: pointer;
  color: var(--text);
  background: linear-gradient(160deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .44));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .48), 0 8px 22px rgba(108, 90, 160, .08);
  transition: transform .16s ease, background .16s ease;
}
.mp-music-card:active { transform: scale(.975); }
.mp-music-card.is-on {
  background: linear-gradient(160deg, rgba(243, 236, 255, .9), rgba(231, 222, 255, .6));
  box-shadow: inset 0 0 0 1px rgba(164, 143, 234, .28), 0 10px 24px rgba(120, 97, 196, .14);
}
.mp-music-card-main { flex: 1; min-width: 0; }
.mp-music-card-name {
  font-size: calc(14px * var(--font-scale));
  font-weight: 600;
  letter-spacing: -.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mp-music-card-sub {
  margin-top: 3px;
  font-size: calc(11px * var(--font-scale));
  color: var(--text-3);
}
.mp-music-card-play {
  width: 32px; height: 32px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--accent);
  background: rgba(255, 255, 255, .58);
  box-shadow: inset 0 0 0 1px rgba(142, 123, 242, .16);
}
.mp-music-card-play .mp-i { width: 15px; height: 15px; }

.mp-music-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 34px 24px 28px;
  border-radius: 22px;
  text-align: center;
  background: linear-gradient(160deg, rgba(255, 255, 255, .66), rgba(255, 255, 255, .36));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .44);
}
.mp-music-empty-art {
  width: 62px; height: 62px;
  display: grid;
  place-items: center;
  border-radius: 20px;
  color: var(--accent);
  background: rgba(142, 123, 242, .12);
  box-shadow: inset 0 0 0 1px rgba(142, 123, 242, .12);
}
.mp-music-empty-art .mp-i { width: 27px; height: 27px; }
.mp-music-empty b { font-size: calc(14px * var(--font-scale)); font-weight: 600; }
.mp-music-empty span {
  max-width: 250px;
  font-size: calc(12px * var(--font-scale));
  line-height: calc(1.7 * var(--line-scale));
  color: var(--text-3);
}
.mp-music-empty .mp-btn { margin-top: 4px; }

.mp-music-note {
  margin-top: 2px;
  padding: 0 4px 6px;
  font-size: calc(11px * var(--font-scale));
  line-height: calc(1.7 * var(--line-scale));
  color: var(--text-3);
}

.mp-music-player {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 10px 9px;
  border-radius: 22px;
  background: linear-gradient(150deg, rgba(252, 250, 255, .88), rgba(238, 232, 252, .62));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .6), 0 12px 28px rgba(101, 84, 160, .13);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
}
.mp-music-player-main { flex: 1; min-width: 0; }
.mp-music-now b {
  display: block;
  font-size: calc(13px * var(--font-scale));
  font-weight: 600;
  line-height: calc(1.35 * var(--line-scale));
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mp-music-now span {
  display: block;
  margin-top: 1px;
  font-size: calc(10.5px * var(--font-scale));
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mp-music-progress {
  height: 3px;
  margin-top: 7px;
  border-radius: 2px;
  overflow: hidden;
  background: rgba(112, 94, 170, .13);
}
.mp-music-progress i {
  display: block;
  width: 0;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #b3a2f6, #7f6ce9);
  transition: width .18s linear;
}
.mp-music-time {
  margin-top: 3px;
  font-size: calc(9.5px * var(--font-scale));
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.mp-music-play {
  width: 40px; height: 40px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(150deg, #9583f2, #7f6ce9);
  box-shadow: 0 8px 18px rgba(140, 116, 224, .3);
}
.mp-music-play .mp-i { width: 17px; height: 17px; }
.mp-music-play:active { transform: scale(.94); }
.mp-music-next {
  width: 30px; height: 30px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  color: var(--text-2);
  background: rgba(255, 255, 255, .46);
  box-shadow: inset 0 0 0 1px rgba(130, 110, 190, .12);
}
.mp-music-next .mp-i { width: 16px; height: 16px; }
.mp-music-next:active { transform: scale(.94); }

.mp-music-detail-head {
  display: flex;
  gap: 13px;
  align-items: flex-start;
  padding-top: 3px;
}
.mp-music-detail-copy { flex: 1; min-width: 0; padding-top: 3px; }
.mp-music-source {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 7px;
  border-radius: 7px;
  font-size: calc(9.5px * var(--font-scale));
  letter-spacing: .02em;
  color: var(--accent);
  background: rgba(142, 123, 242, .11);
}
.mp-music-detail-name {
  margin-top: 6px;
  font-size: calc(18px * var(--font-scale));
  font-weight: 600;
  line-height: calc(1.28 * var(--line-scale));
  letter-spacing: -.025em;
}
.mp-music-detail-sub {
  margin-top: 3px;
  font-size: calc(11px * var(--font-scale));
  color: var(--text-3);
}
.mp-music-all {
  height: 31px;
  padding: 0 12px;
  border-radius: 11px;
  font-size: calc(11.5px * var(--font-scale));
}
.mp-music-all .mp-i { width: 13px; height: 13px; }

.mp-music-track-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 2px;
}
.mp-music-track {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 8px;
  border: 0;
  border-radius: 13px;
  font: inherit;
  text-align: left;
  color: var(--text);
  cursor: pointer;
  background: transparent;
  transition: background .14s ease;
}
.mp-music-track:active { background: rgba(142, 123, 242, .08); }
.mp-music-track.is-on { background: rgba(142, 123, 242, .1); }
.mp-music-index {
  width: 24px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  font-size: calc(10.5px * var(--font-scale));
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.mp-music-index .mp-i { width: 12px; height: 12px; color: var(--accent); }
.mp-music-track-main { flex: 1; min-width: 0; }
.mp-music-track-main b {
  display: block;
  font-size: calc(12.5px * var(--font-scale));
  font-weight: 500;
  line-height: calc(1.35 * var(--line-scale));
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mp-music-track-main span {
  display: block;
  margin-top: 2px;
  font-size: calc(10.5px * var(--font-scale));
  line-height: calc(1.4 * var(--line-scale));
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mp-music-track-side {
  flex: 0 0 auto;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: calc(9px * var(--font-scale));
  color: var(--text-3);
  background: rgba(120, 104, 168, .08);
}

.mp-root[data-mp-theme="night"] .mp-music-card {
  background: linear-gradient(160deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .04));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
}
.mp-root[data-mp-theme="night"] .mp-music-card.is-on {
  background: linear-gradient(160deg, rgba(157, 135, 232, .24), rgba(130, 112, 206, .12));
  box-shadow: inset 0 0 0 1px rgba(187, 170, 246, .2);
}
.mp-root[data-mp-theme="night"] .mp-music-empty {
  background: linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
}
.mp-root[data-mp-theme="night"] .mp-music-player {
  background: linear-gradient(150deg, rgba(54, 47, 78, .9), rgba(37, 32, 56, .7));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1), 0 12px 28px rgba(0, 0, 0, .28);
}
.mp-root[data-mp-theme="night"] .mp-music-play { box-shadow: 0 8px 18px rgba(96, 76, 180, .4); }
.mp-root[data-mp-theme="night"] .mp-music-next {
  background: rgba(255, 255, 255, .07);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
}
.mp-root[data-mp-theme="night"] .mp-music-card-play {
  background: rgba(255, 255, 255, .08);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
}
.mp-root[data-mp-theme="night"] .mp-music-progress { background: rgba(255, 255, 255, .12); }
.mp-root[data-mp-theme="night"] .mp-music-track-side { background: rgba(255, 255, 255, .07); }
.mp-root[data-mp-theme="night"] .mp-music-cover.is-empty { color: rgba(255, 255, 255, .86); }

/* ===================== 装扮：字体 / 灵动岛 / 图标 ===================== */
.mp-screen {
  font-family: var(--font-ui);
  font-weight: var(--font-weight);
}

.mp-root { color-scheme: light; }
.mp-root[data-mp-theme="night"] { color-scheme: dark; }

.mp-root[data-mp-island="hide"] .mp-island { display: none; }

/* 所有输入框统一底色：日间浅底深字，夜间深底浅字；不再让透明紫底叠成黑块 */
.mp-root input:not([type="range"]):not([type="file"]),
.mp-root textarea,
.mp-root select {
  color: var(--text) !important;
  -webkit-text-fill-color: var(--text);
  background-color: var(--field-solid) !important;
  border-color: var(--field-border) !important;
  caret-color: var(--accent);
}
.mp-root input::placeholder,
.mp-root textarea::placeholder { color: var(--text-4) !important; opacity: 1; }
.mp-root input:-webkit-autofill,
.mp-root textarea:-webkit-autofill {
  -webkit-text-fill-color: var(--text) !important;
  box-shadow: 0 0 0 1000px var(--field-solid) inset !important;
}
.mp-root input[type="range"] { accent-color: var(--accent); background: transparent; border: 0; }
.mp-root input[type="file"] { background: transparent; border: 0; }

/* iOS 风格下拉框：胶囊圆角、无原生箭头、右侧统一箭头 */
.mp-select-wrap {
  position: relative;
  display: block;
  width: 100%;
  min-width: 0;
}
.mp-root .mp-select-wrap select {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  appearance: none;
  -webkit-appearance: none;
  padding: 11px 36px 11px 13px;
  border-radius: 14px;
  border: 1px solid var(--field-border);
  background: var(--field-solid);
  color: var(--text);
  font: inherit;
  font-size: calc(13.5px * var(--font-scale));
  line-height: calc(1.25 * var(--line-scale));
  outline: none;
  cursor: pointer;
  text-overflow: ellipsis;
}
.mp-root .mp-select-wrap select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(142, 123, 242, .13);
}
.mp-select-wrap .mp-i {
  position: absolute;
  right: 12px;
  top: 50%;
  width: 15px;
  height: 15px;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
}
.mp-root[data-mp-theme="night"] .mp-select-wrap select {
  background: var(--field-solid);
  border-color: rgba(255, 255, 255, .16);
}

.mp-sheet-textarea {
  display: block;
  width: 100%;
  height: 150px;
  box-sizing: border-box;
  border-radius: 16px;
  padding: 12px 13px;
  font: inherit;
  line-height: calc(1.72 * var(--line-scale));
  color: var(--text);
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  outline: none;
  resize: none;
  font-family: var(--font-serif);
}

/* 自定义图标：直接铺图，去掉覆盖在上面的玻璃渐变 */
.mp-app .mp-tile.mp-tile-image {
  background-size: cover;
  background-position: center;
  color: transparent;
}
.mp-app .mp-tile.mp-tile-image::after { display: none; }
.mp-app .mp-tile.mp-tile-image .mp-badge {
  color: #fff;
  -webkit-text-fill-color: #fff;
}

.mp-dress-hero {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 20px;
  background: linear-gradient(155deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .38));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .55), var(--shadow-s);
}
.mp-dress-aa {
  width: 66px;
  height: 66px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 18px;
  font-family: var(--font-serif);
  font-size: calc(28px * var(--font-scale));
  font-weight: 600;
  color: var(--accent-deep);
  background: rgba(142, 123, 242, .12);
  box-shadow: inset 0 0 0 1px rgba(142, 123, 242, .12);
}
.mp-dress-hero-text { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.mp-dress-hero-text b { font-size: calc(13.5px * var(--font-scale)); }
.mp-dress-hero-text span { font-size: calc(11px * var(--font-scale)); line-height: calc(1.55 * var(--line-scale)); color: var(--text-3); }

.mp-theme-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.mp-theme-card {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  min-width: 0;
  padding: 8px 8px 9px;
  border: 0;
  border-radius: 18px;
  background: rgba(255, 255, 255, .62);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .72), 0 8px 18px rgba(120, 108, 180, .08);
  transition: transform .18s cubic-bezier(.22, .68, .38, 1);
}

.mp-theme-card:active { transform: scale(.97); }
.mp-theme-card.is-on { box-shadow: inset 0 0 0 1.5px var(--accent), 0 8px 18px rgba(120, 108, 180, .12); }

.mp-theme-preview {
  position: relative;
  display: block;
  width: 100%;
  height: 49px;
  margin-bottom: 4px;
  border-radius: 13px;
  background-size: cover;
  background-position: center;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5);

.mp-theme-name {
  overflow: hidden;
  color: var(--text);
  font-size: calc(11.5px * var(--font-scale));
  font-weight: 600;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.mp-theme-sub {
  overflow: hidden;
  color: var(--text-3);
  font-size: calc(9.5px * var(--font-scale));
  white-space: nowrap;
  text-overflow: ellipsis;
}

.mp-root[data-mp-theme="night"] .mp-theme-card {
  background: rgba(255, 255, 255, .08);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .10), 0 8px 18px rgba(0, 0, 0, .24);
}

.mp-root[data-mp-theme="night"] .mp-theme-card.is-on {

.mp-root[data-mp-theme="night"] .mp-dress-hero {
  background: linear-gradient(155deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .04));

.mp-dress-choice-row {

}
.mp-dress-choice {

  border-radius: 14px;

.mp-root[data-mp-theme="night"] .mp-dress-choice { background: rgba(255, 255, 255, .06); }
.mp-root[data-mp-theme="night"] .mp-dress-choice.is-on { background: rgba(167, 149, 255, .2); }

.mp-dress-toggle,
.mp-dress-link {

  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border: 0;
  border-radius: 16px;
  text-align: left;
  font: inherit;
  color: var(--text);

  background: var(--card);
  box-shadow: inset 0 0 0 1px var(--line), var(--shadow-s);
}
.mp-dress-toggle .mp-set-name { flex: 1; }
.mp-dress-toggle .mp-switch { flex: 0 0 auto; }
.mp-dress-toggle .mp-set-ico {

  height: 34px;

  place-items: center;
  border-radius: 11px;

.mp-dress-toggle .mp-set-ico .mp-i { width: 17px; height: 17px; }
.mp-dress-link {
  justify-content: center;
  gap: 6px;
  margin-top: 6px;
  padding: 10px;
  font-size: calc(11.5px * var(--font-scale));
  color: var(--text-3);
  background: transparent;
  box-shadow: none;
}
.mp-dress-link .mp-i { width: 15px; height: 15px; }
.mp-root[data-mp-theme="night"] .mp-dress-toggle { background: rgba(255, 255, 255, .06); }

.mp-dress-wall-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.mp-dress-wall {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text-3);
  font: inherit;
  font-size: calc(10.5px * var(--font-scale));
  cursor: pointer;
}
.mp-dress-wall-swatch {
  display: block;
  height: 67px;
  border-radius: 13px;
  background-size: cover;
  background-position: center;
  box-shadow: var(--shadow-s);
  border: 2px solid transparent;
}
.mp-dress-wall-swatch.is-on { border-color: var(--accent); }
.mp-root[data-mp-theme="night"] .mp-dress-wall-swatch { box-shadow: 0 4px 14px rgba(0, 0, 0, .3); }

.mp-dress-app-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 15px 7px;
  padding: 13px 8px;
  border-radius: 20px;
  background: var(--card);
  box-shadow: inset 0 0 0 1px var(--line);
}
.mp-dress-app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  border: 0;
  padding: 0;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: calc(10px * var(--font-scale));
  cursor: pointer;
}
.mp-dress-tile {
  width: 49px;
  height: 49px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: #4f4179;
  background: linear-gradient(155deg, rgba(255, 255, 255, .72), rgba(255, 255, 255, .32));
  box-shadow: 0 6px 14px rgba(118, 106, 168, .15), inset 0 0 0 1px rgba(255, 255, 255, .6);
  overflow: hidden;
}
.mp-dress-tile .mp-i { width: 22px; height: 22px; }
.mp-dress-tile.has-image { background-size: cover; background-position: center; }
.mp-root[data-mp-theme="night"] .mp-dress-tile {
  color: #ece9f7;
  background: linear-gradient(155deg, rgba(255, 255, 255, .15), rgba(255, 255, 255, .05));
  box-shadow: 0 6px 14px rgba(0, 0, 0, .3), inset 0 0 0 1px rgba(255, 255, 255, .12);
}
.mp-dress-note {
  padding: 8px 2px 0;
  font-size: calc(10.5px * var(--font-scale));
  line-height: calc(1.7 * var(--line-scale));
  color: var(--text-3);
}

.mp-icon-preview {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px;
  border-radius: 20px;
  background: linear-gradient(155deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .38));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .55), var(--shadow-s);
}
.mp-icon-preview .mp-dress-tile.is-big { width: 68px; height: 68px; border-radius: 19px; }
.mp-icon-preview .mp-dress-tile.is-big .mp-i { width: 30px; height: 30px; }
.mp-icon-preview div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.mp-icon-preview b { font-size: calc(15px * var(--font-scale)); }
.mp-icon-preview span { font-size: calc(11px * var(--font-scale)); color: var(--text-3); }
.mp-root[data-mp-theme="night"] .mp-icon-preview {
  background: linear-gradient(155deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .04));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), var(--shadow-s);
}

.mp-icon-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  padding: 11px;
  border-radius: 20px;
  background: var(--card);
  box-shadow: inset 0 0 0 1px var(--line);
}
.mp-icon-choice {
  min-height: 58px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 0;
  border-radius: 13px;
  color: var(--text-2);
  background: rgba(43, 41, 55, .045);
  font: inherit;
  font-size: calc(9px * var(--font-scale));
  cursor: pointer;
  box-shadow: inset 0 0 0 1px transparent;
}
.mp-icon-choice .mp-i { width: 20px; height: 20px; }
.mp-icon-choice.is-on {
  color: var(--accent-deep);
  background: rgba(142, 123, 242, .14);
  box-shadow: inset 0 0 0 1px rgba(142, 123, 242, .32);
}
.mp-root[data-mp-theme="night"] .mp-icon-choice { background: rgba(255, 255, 255, .06); }
.mp-root[data-mp-theme="night"] .mp-icon-choice.is-on { background: rgba(167, 149, 255, .2); }

.mp-icon-actions { display: flex; gap: 8px; }
.mp-icon-actions .mp-btn { flex: 1; }

/* 白色磨砂：聊天气泡统一成无光白玻璃，收发都用自己的白气泡 */
.mp-root[data-mp-skin="frost"] .mp-bubble,
.mp-root[data-mp-skin="frost"] .mp-msg.me .mp-bubble {
  padding: 7px 15px;
  border: 1px solid rgba(255, 255, 255, .34);
  border-radius: 15px;
  background: linear-gradient(145deg, rgba(230, 230, 230, .72) 10%, rgba(240, 240, 240, .62) 40%, rgba(250, 250, 250, .52) 80%);
  backdrop-filter: blur(10px) saturate(150%);
  -webkit-backdrop-filter: blur(10px) saturate(150%);
  color: #000;
  box-shadow: 0 8px 25px rgba(220, 220, 220, .38);
}

.mp-root[data-mp-skin="frost"] .mp-msg.me .mp-bubble {
  color: #000;
}

/* =========================================================================
   皮肤全站基座
   frost：白色磨砂、无光、单色纸张
   pixel：冷白纸 + 黑色硬边 + 像素式硬投影
   这一组放在文件最后，整屏接管页面、卡片、列表、弹层和控件。
   ========================================================================= */

/* ---------------------------------------------------------- 1. 皮肤 token */
.mp-root[data-mp-skin="frost"] {
  --lav: #8e8e93;
  --lav-deep: #3a3a3c;
  --pink: #c7c7cc;
  --mint: #d1d1d6;
  --honey: #e5e5ea;
  --sky: #aeaeb2;

  --text: #1c1c1e;
  --text-2: rgba(28, 28, 30, .66);
  --text-3: rgba(28, 28, 30, .46);
  --text-4: rgba(28, 28, 30, .28);
  --line: rgba(60, 60, 67, .14);
  --line-soft: rgba(60, 60, 67, .07);

  --page: #efeff1;
  --page-2: #e8e8ea;
  --glass: rgba(250, 250, 251, .78);
  --glass-strong: rgba(255, 255, 255, .92);
  --card: rgba(251, 251, 252, .84);

  --accent: #2c2c2e;
  --accent-deep: #000;
  --ok: #248a3d;
  --warn: #8a6a33;

  --shadow-s: 0 2px 10px rgba(0, 0, 0, .055);
  --shadow-m: 0 10px 28px rgba(0, 0, 0, .08);
  --shadow-l: 0 24px 56px rgba(0, 0, 0, .14);

  --r-s: 10px;
  --r-m: 15px;
  --r-l: 18px;
  --r-xl: 22px;
  --r-card: 16px;

  --field-bg: rgba(255, 255, 255, .70);
  --field-solid: rgba(255, 255, 255, .92);
  --field-border: rgba(60, 60, 67, .18);
}

/* ---------------------------------------------------- 2. 机身 / 壁纸 / 页面 */
.mp-root[data-mp-skin="frost"] .mp-device {
  background: linear-gradient(160deg, #f8f8f9, #e6e6e9 58%, #fdfdfd);
  box-shadow:
    0 40px 90px rgba(0, 0, 0, .18),
    0 0 0 1px rgba(255, 255, 255, .9),
    inset 0 0 0 1px rgba(255, 255, 255, .72);
}

.mp-root[data-mp-skin="frost"] .mp-wallpaper {
  filter: grayscale(.88) brightness(1.09) contrast(.9);
  opacity: .94;
}

.mp-root[data-mp-skin="frost"] .mp-scrim {
  background: linear-gradient(180deg, rgba(255, 255, 255, .56), rgba(255, 255, 255, .20) 42%, rgba(244, 244, 246, .56));
}

.mp-root[data-mp-skin="frost"] .mp-screen {
  background: #eeeeef;
}

.mp-root[data-mp-skin="frost"] .mp-page,
.mp-root[data-mp-skin="frost"] .mp-thread {
  background: linear-gradient(180deg, rgba(250, 250, 251, .84), rgba(241, 241, 243, .91));
  backdrop-filter: blur(30px) saturate(.62);
  -webkit-backdrop-filter: blur(30px) saturate(.62);
}

.mp-root[data-mp-skin="frost"] .mp-page-body {
  background: transparent;
}

.mp-root[data-mp-skin="frost"] .mp-composer {
  background: rgba(246, 246, 247, .78);
  border-top-color: rgba(60, 60, 67, .12);
  backdrop-filter: blur(24px) saturate(.6);
  -webkit-backdrop-filter: blur(24px) saturate(.6);
}

/* 状态栏与顶部操作 */
.mp-root[data-mp-skin="frost"] .mp-status-back,
.mp-root[data-mp-skin="frost"] .mp-icon-btn {
  background: rgba(250, 250, 251, .78);
  color: #1c1c1e;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .82), 0 2px 10px rgba(0, 0, 0, .06);
}

}

.mp-root[data-mp-skin="frost"] .mp-home-bar {
  background: rgba(28, 28, 30, .30);
}

/* ------------------------------------------------ 3. 桌面 / 面板 / 列表底 */
.mp-root[data-mp-skin="frost"] :is(
  .mp-widget, .mp-profile, .mp-mini-widget, .mp-di-card,
  .mp-row, .mp-group-box, .mp-card, .mp-diary-hero, .mp-diary-card,
  .mp-chat-set-head, .mp-extra-source, .mp-quote-chip, .mp-sheet,
  .mp-theme-card, .mp-dress-hero, .mp-dress-toggle, .mp-dress-app-grid,

.mp-root[data-mp-skin="frost"] .mp-chip-btn.is-on .mp-set-ico,

.mp-root[data-mp-skin="frost"] .mp-dock {

}

.mp-root[data-mp-skin="frost"] :is(.mp-app .mp-tile:not(.mp-tile-image) .mp-i, .mp-glass-ico .mp-i) {

/* 桌面资料卡：磨砂做无光灰，像素保留主题横幅 */

}

.mp-root[data-mp-skin="frost"] .mp-profile-banner::after {

.mp-root[data-mp-skin="frost"] :is(.mp-profile-stamp, .mp-profile-loc) {

    charBudget: clampNumber(source.charBudget, 2000, 20000, DEFAULT_REPLY_CONTEXT.charBudget),
  };
}

/** 条目适用的角色卡：空数组 = 全部角色；最多 12 个，去重。 */
function normalizeCharacters(raw) {
  if (!Array.isArray(raw)) return [];
  const list = [];
  raw.forEach(value => {
    const name = String(value || '').trim().slice(0, 40);
    if (name && !list.includes(name)) list.push(name);
  });
  return list.slice(0, 12);
}

function normalizeReplyItems(raw, rawContext) {
  const context = normalizeReplyContext(rawContext);
  const source = Array.isArray(raw) ? raw : defaultReplyItems();
  const seenAuto = new Set();
  const items = source.slice(0, 32).map((item, index) => {
    const order = Number(item?.order);
    const auto = REPLY_CONTEXT_KEYS.includes(item?.auto) ? item.auto : '';
    if (auto) {
      if (seenAuto.has(auto)) return null;
      seenAuto.add(auto);
      const spec = REPLY_CONTEXT_SPECS[auto];
      return {
        ...contextItem(auto),
        id: spec.id,
        enabled: item?.enabled !== undefined ? item.enabled !== false : context[auto] !== false,
        characters: normalizeCharacters(item?.characters),
        order: Number.isFinite(order) ? order : spec.hintOrder,
      };
    }
    const role = ['system', 'user', 'assistant'].includes(item?.role) ? item.role : 'system';
    const kind = item?.kind === 'app' ? 'app' : 'chat';
    return {
      id: String(item?.id || newId('item')),
      label: String(item?.label || '').trim().slice(0, 30) || `条目 ${index + 1}`,
      role,
      kind,
      auto: '',
      app: kind === 'app' ? String(item?.app || '').trim().slice(0, 20) : '',
      characters: normalizeCharacters(item?.characters),
      content: String(item?.content || '').trim().slice(0, 4000),
      enabled: item?.enabled !== false,
      editable: item?.editable !== false,
      deletable: item?.deletable !== false,
      order: Number.isFinite(order) ? order : index,
    };
  }).filter(Boolean);
  /* 老预设里没有上下文条目时补进列表；用 hintOrder 插到聊天条目之间，保持旧 QQ 的同一列表形态。 */
  REPLY_CONTEXT_KEYS.forEach(key => {
    if (seenAuto.has(key)) return;
    items.push(contextItem(key, { enabled: context[key] !== false }));
  });
  /* 旧版本创建的预设没有「回复格式要求 / 尾部」，补上这两条固定条目；
   * 其他聊天条目可能被用户删过，不强行加回来。 */
  ['reply_item_format', 'reply_item_footer'].forEach(id => {
    if (items.some(item => item.id === id)) return;
    const fixed = defaultReplyItems().find(item => item.id === id);
    if (fixed) items.push({ ...fixed });
  });
  return items.sort((a, b) => a.order - b.order).map((item, index) => ({ ...item, order: index }));
}

/* ------------------------------------------------------------------ ids */

let seq = 0;
function newId(prefix = 'id') {
  seq += 1;
  const rand = Math.random().toString(36).slice(2, 7);
  return `${prefix}_${Date.now().toString(36)}${seq.toString(36)}${rand}`;
}

/* -------------------------------------------------------------- 联系人 */

function addContact(state, contact) {
  const id = contact.id || newId('c');
  state.contacts[id] = {
    id,
    name: contact.name || '未命名',
    avatar: contact.avatar || '',
    kind: contact.kind || 'char',       // char | group | custom
    tavernAvatar: contact.tavernAvatar || '',
    note: contact.note || '',
    signature: contact.signature || '',
    status: contact.status || 'online',  // online | busy | away
    members: contact.members || [],
    createdAt: Date.now(),
  };
  return state.contacts[id];
}

function contactsOf(state) {
  return Object.values(state.contacts);
}

function contactById(state, id) {
  return state.contacts[id] || null;
}

/* ----------------------------------------------------------------- 会话 */

function addChat(state, contactId, options = {}) {
  const id = options.id || newId('ch');
  const messages = (options.messages || []).map((message, index) => ({ id: `${id}_m${index}`, ...message }));
  state.chats[id] = {
    id,
    contactId,
    kind: options.kind || (state.contacts[contactId]?.kind === 'group' ? 'group' : 'single'),
    messages,
    unread: 0,
    draft: '',
    pinned: false,
    muted: false,
    llmPresetId: '',
    memoryPresetId: '',
    updatedAt: Date.now(),
  };
  return state.chats[id];
}

/** 一个联系人只保留一个一对一会话；群聊各自一条。 */
function chatFor(state, contactId) {
  const existing = Object.values(state.chats).find(chat => chat.contactId === contactId && chat.kind !== 'group');
  return existing || addChat(state, contactId);
}

function chatsOf(state) {
  return Object.values(state.chats).sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
}

function chatById(state, id) {
  return state.chats[id] || null;
}

/** 手机里保存的聊天接口预设。 */
function apiPresetsOf(state) {
  const store = state?.settings?.api;
  return Array.isArray(store?.presets) ? store.presets : [];
}

/** 这个会话实际用哪套 LLM：自己选了就用自己那套，没选就跟随手机。 */
function llmPresetFor(state, chat) {
  const list = apiPresetsOf(state);
  const own = list.find(preset => preset.id === chat?.llmPresetId);
  if (own) return own;
  return list.find(preset => preset.id === state?.settings?.api?.activeChat) || list[0] || null;
}

/** 手机里保存的酒馆记忆方案。 */
function memoryPresetsOf(state) {
  const store = state?.settings?.memory;
  return Array.isArray(store?.presets) ? store.presets : [];
}

/** 这个会话实际用哪套记忆：自己选了就用自己那套，没选就跟随手机。 */
function memoryPresetFor(state, chat) {
  const list = memoryPresetsOf(state);
  const own = list.find(preset => preset.id === chat?.memoryPresetId);
  if (own) return own;
  return list.find(preset => preset.id === state?.settings?.memory?.activeId) || list[0] || null;
}

/** 手机全局默认：读总结（有总结就用，没有退原文）还是只读原文。 */
function memoryGlobalReadMode(state) {
  return state?.settings?.memory?.readMode === 'recent' ? 'recent' : 'summary';
}

/**
 * 这位角色读总结还是原文。三层兜底：角色单独设过 > 方案里固定的来源 > 手机默认。
 * 返回 'auto'（有总结读总结，没有退原文）/ 'summary'（只用总结）/ 'recent'（只读原文）。
 */
function memoryReadModeFor(state, contactId, preset) {
  const store = state?.settings?.memory || {};
  const own = contactId ? store.byContact?.[contactId] : '';
  if (own === 'auto' || own === 'recent') return own;
  if (preset?.mode === 'summary' || preset?.mode === 'recent') return preset.mode;
  return memoryGlobalReadMode(state) === 'recent' ? 'recent' : 'auto';
}

/** 手机里保存的回复预设：每套由主回复指令、提示词条目和上下文配置组成。 */
function replyPresetsOf(state) {
  const store = state?.settings?.reply;
  return Array.isArray(store?.presets) ? store.presets : [];
}

/** 这个会话实际用哪套回复预设：自己选了就用自己那套，没选就跟随手机。 */
function replyPresetFor(state, chat) {
  const list = replyPresetsOf(state);
  const own = list.find(preset => preset.id === chat?.replyPresetId);
  if (own) return own;
  return list.find(preset => preset.id === state?.settings?.reply?.activeId) || list[0] || null;
}

/** 注入模型的回复要求；预设没写内容时返回空，不额外加约束。 */
function replyPromptFor(state, chat) {
  const preset = replyPresetFor(state, chat);
  return String(preset?.text || '').trim();
}

/** 这套回复预设要注入哪些上下文：以列表里的固定上下文条目为准，historyLimit 仍存在 context。 */
function replyContextFor(state, chat) {
  const preset = replyPresetFor(state, chat);
  const context = normalizeReplyContext(preset?.context);
  normalizeReplyItems(preset?.items, context).forEach(item => {
    if (item.kind === 'context' && item.auto) context[item.auto] = item.enabled !== false;
  });
  return context;
}

/** 这套预设的全部提示词条目（包含关闭的，给设置页用）。 */
function replyItemsFor(state, chat) {
  const preset = replyPresetFor(state, chat);
  return normalizeReplyItems(preset?.items, normalizeReplyContext(preset?.context));
}

/** 把条目里的旧版变量换成当前数据；不认识的占位符保留，方便用户自己排查。 */
function fillPromptTokens(text, state, chat) {
  const contact = chat ? state?.contacts?.[chat.contactId] : null;
  const user = state?.settings?.user?.name || '我';
  const now = new Date().toLocaleString('zh-CN', {
    month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false,
  });
  return String(text || '')
    .replace(/\{\{user\}\}/g, user)
    .replace(/\{\{char\}\}/g, contact?.name || '对方')
    .replace(/\{\{当前时间\}\}/g, now);
}

/** 找到这个联系人对应的角色卡：优先头像文件名，名字兜底。 */
function characterCardFor(state, contact) {
  const cards = Array.isArray(state?.characters) ? state.characters : [];
  if (!cards.length || !contact) return null;
  return cards.find(card => contact.tavernAvatar && card.avatar === contact.tavernAvatar)
    || cards.find(card => card.name === contact.name)
    || null;
}

/** 一个联系人能被哪些写法匹配到：头像文件名、卡名、联系人名。 */
function characterRefsFor(state, contact) {
  const card = characterCardFor(state, contact);
  return new Set([
    contact?.tavernAvatar,
    contact?.name,
    card?.avatar,
    card?.name,
  ].map(value => String(value || '').trim()).filter(Boolean));
}

/**
 * 条目是否适用于这个会话/联系人。
 * characters 为空 = 全部角色；群聊按约定只吃公共条目，具体角色条目只在一对一生效。
 */
function itemAppliesToChat(state, item, chat, contact) {
  const targets = normalizeCharacters(item?.characters);
  if (!targets.length) return true;
  if (!chat || chat.kind === 'group') return false;
  const refs = characterRefsFor(state, contact);
  return targets.some(name => refs.has(name));
}

/** 手机里保存的 LLM 整体方案：只保存一套聊天 API + 一套回复预设，不碰酒馆记忆。 */
function chatSchemesOf(state) {
  const store = state?.settings?.api;
  return Array.isArray(store?.chatSchemes) ? store.chatSchemes : [];
}

function activeChatScheme(state) {
  const store = state?.settings?.api;
  const list = chatSchemesOf(state);
  return list.find(item => item.id === store?.chatSchemeId) || list[0] || null;
}

/** 切一套整体方案：只换聊天 API 和回复预设，记忆留在原处，不跟着方案走。 */
function applyChatScheme(state, scheme) {
  if (!scheme) return false;
  const store = state.settings.api;
  if (apiPresetsOf(state).some(item => item.id === scheme.apiId)) store.activeChat = scheme.apiId;
  if (replyPresetsOf(state).some(item => item.id === scheme.replyId)) state.settings.reply.activeId = scheme.replyId;
  store.chatSchemeId = scheme.id;
  return true;
}

function lastMessage(chat) {
  const list = chat?.messages || [];
  for (let index = list.length - 1; index >= 0; index -= 1) {
    const message = list[index];
    if (!message || message.kind === 'recalled') continue;
    if (message.text || message.image || message.emoji || message.forward) return message;
  }
  return null;
}

/** 会话列表/收藏页共用的一句话摘要：图片、表情、转发都别显示成空白 */
function messagePreview(message) {
  if (!message) return '';
  if (message.kind === 'recalled') return '[已撤回]';
  if (message.kind === 'image' || message.image) return '[图片]';
  if (message.kind === 'emoji' || message.emoji) return message.emoji || '[表情]';
  if (message.forward) return `[转发] ${message.forward.text || ''}`.trim();
  return message.text || '';
}

function pushMessage(state, chatId, message) {
  const chat = state.chats[chatId];
  if (!chat) return null;
  const entry = {
    id: message.id || newId('m'),
    from: message.from || 'them',      // me | them | system
    text: message.text || '',
    at: message.at || Date.now(),
    kind: message.kind || 'text',      // text | system | extra | proactive | image | emoji | poke | recalled | forwarded
    quote: message.quote || null,
    proactive: Boolean(message.proactive),
    pending: Boolean(message.pending),
    speaker: message.speaker || '',
    image: message.image || '',
    emoji: message.emoji || '',
    forward: message.forward || null,
  };
  chat.messages.push(entry);
  chat.updatedAt = entry.at;
  if (entry.from === 'them') chat.unread = (chat.unread || 0) + 1;
  return entry;
}

function unreadTotal(state) {
  if (state.settings?.chat?.remind === false) return 0;
  return Object.values(state.chats).reduce((sum, chat) => sum + (chat.muted ? 0 : (chat.unread || 0)), 0);
}

/* 空发送能不能真的发出去：全局总开关 + 手机默认 + 这个会话的单独设置 */
function wakeAllowed(state, chat) {
  if (state.settings?.proactive?.enabled === false) return false;
  if (chat && chat.wake === false) return false;
  return state.settings?.chat?.wake !== false;
}


/* ----------------------------------------------------------------- 日记 */

function dayKey(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function diaryEntry(state, key) {
  return state.diary.entries[key] || null;
}

function writeDiary(state, key, text, extra = {}) {
  state.diary.entries[key] = {
    key,
    text: String(text || '').trim(),
    tags: extra.tags || [],
    auto: Boolean(extra.auto),
    contactId: extra.contactId || '',
    createdAt: Date.now(),
  };
  return state.diary.entries[key];
}

/** 最近一条日记：桌面小组件和日记 App 都用它。 */
function latestDiary(state) {
  const keys = Object.keys(state.diary.entries).sort().reverse();
  for (const key of keys) {
    const entry = state.diary.entries[key];
    if (entry && entry.text) return entry;
  }
  return null;
}

/* ---------------------------------------------------------- 小剧场等 */

function extrasOf(state, contactId) {
  state.extras[contactId] = state.extras[contactId] || [];
  return state.extras[contactId];
}

/** 这一轮要不要请模型附一段小剧场：按联系人单独开。 */
function extrasEnabledFor(state, contactId) {
  return (state.extrasOn || []).includes(String(contactId));
}

/** 小剧场的返回协议：正常聊天在前，<phone-extras>JSON</phone-extras> 在后。 */
function theaterPrompt(contactName) {
  const name = String(contactName || '对方').trim() || '对方';
  const shape = JSON.stringify({
    role: name,
    sections: [
      { title: '心理活动', content: '……' },
      { title: '小彩蛋', content: '……' },
    ],
  });
  return [
    `这一轮正常聊天之外，再给「${name}」写一小段小剧场。`,
    '先完整输出 TA 要发的聊天消息，然后在消息之后另起一行，追加且只追加一个块：',
    `<phone-extras>${shape}</phone-extras>`,
    '这个块不会显示在聊天里，只存进小剧场 App；不要写进聊天正文，不要用代码围栏，也不要为它另发一次请求。',
    '每节 1–3 句，贴合人设和当下情境；可以写没说出口的小情绪或动作，不替用户决定言行。',
  ].join('\n');
}

/**
 * 从模型回复里摘掉小剧场块，聊天只留正文；块要能解析成 sections 才存。
 * 标签写坏或没闭合时也从标签处截掉，保证聊天里永远看不到小剧场。
 */
function splitTheaterBlocks(text, contactName = '') {
  const raw = String(text || '');
  const blocks = [];
  let cleaned = raw.replace(/<phone-extras\b[^>]*>([\s\S]*?)<\/phone-extras>/gi, (_, body) => {
    blocks.push(body);
    return '';
  });
  cleaned = cleaned.replace(/<phone-extras\b[\s\S]*$/i, '');
  cleaned = cleaned.replace(/```[a-zA-Z]*\s*```/g, '');
  cleaned = cleaned.replace(/\n{3,}/g, '\n\n').trim();

  const wanted = String(contactName || '').trim();
  const sections = [];
  for (const body of blocks) {
    let data;
    try { data = JSON.parse(String(body).trim()); } catch { continue; }
    const list = Array.isArray(data) ? data : (Array.isArray(data?.sections) ? data.sections : []);
    const role = Array.isArray(data) ? '' : String(data?.role || '').trim();
    if (wanted && role && role !== wanted) continue;
    for (const section of list.slice(0, 6)) {
      if (!section || typeof section !== 'object') continue;
      const title = String(section.title || '').trim().slice(0, 80);
      const content = String(section.content || '').trim().slice(0, 4000);
      if (title && content) sections.push({ title, content });
    }
  }
  return { text: cleaned, sections };
}

/** 把一段小剧场并进该联系人的 App 列表；不新增聊天气泡。 */
function addExtrasEntry(state, contactId, sections, meta = {}) {
  if (!Array.isArray(sections) || !sections.length) return null;
  const title = sections.map(section => section.title).filter(Boolean).slice(0, 2).join(' · ') || '小剧场';
  const entry = {
    id: newId('x'),
    title,
    date: dayKey(),
    lines: sections.map(section => `${section.title}：${section.content}`),
    messageId: meta.messageId || '',
    chatId: meta.chatId || '',
    at: Date.now(),
  };
  state.extras[contactId] = state.extras[contactId] || [];
  state.extras[contactId].unshift(entry);
  return entry;
}

/* ------------------------------------------------------------- 从酒馆同步 */

/**
 * 把酒馆角色同步成联系人。host 只提供纯数据（id/名字/头像引用），
 * 这里不碰宿主 API，方便单测与预览环境复用。
 */
function syncTavernContacts(state, tavernCharacters = []) {
  let created = 0;
  for (const character of tavernCharacters) {
    if (!character || !character.name) continue;
    const key = character.tavernAvatar || character.name;
    const existing = Object.values(state.contacts).find(item => item.tavernAvatar === key);
    if (existing) {
      existing.name = character.name;
      existing.avatar = character.avatarUrl || existing.avatar;
      continue;
    }
    addContact(state, {
      name: character.name,
      avatar: character.avatarUrl || '',
      tavernAvatar: key,
      kind: 'char',
    });
    created += 1;
  }
  return created;
}

        personality: character.personality || '',
        scenario: character.scenario || '',
        firstMes: character.first_mes || '',
        example: character.mes_example || '',
        creatorNotes: character.creator_notes || '',
        creator: character.creator || '',
        version: character.character_version || '',
        tags: Array.isArray(character.tags) ? character.tags.map(String) : [],
      }));
  } catch {
    return [];
  }
}

/** 把酒馆世界书对象摊平成纯数据，条目按 order 排。 */
function normalizeBookEntries(data) {
  const entries = Object.entries(data?.entries || {}).map(([uid, entry]) => ({
    uid: String(entry?.uid ?? uid),
    title: String(entry?.comment || (Array.isArray(entry?.key) ? entry.key[0] : entry?.key) || `条目 ${uid}`),
    keys: Array.isArray(entry?.key) ? entry.key.map(String) : (entry?.key ? [String(entry.key)] : []),
    content: String(entry?.content || ''),
    disabled: Boolean(entry?.disable),
    constant: Boolean(entry?.constant),
    order: Number(entry?.order ?? 0),
  }));
  entries.sort((a, b) => a.order - b.order);
  return entries;
}

/**
 * 读一个角色关联的所有世界书（主书 + 附加书），把条目摊平成纯数据。
 * 角色书不是导出时那张卡里的副本，而是酒馆世界书里正在生效的那本。
 */
async function readCharacterBooks(name) {
  const script = await loadHostScript();
  if (!script) return { available: false, books: [], reason: '没接上酒馆' };
  try {
    const ctx = globalThis.SillyTavern?.getContext?.() || script.getContext?.() || {};
    const characters = Array.isArray(ctx.characters) ? ctx.characters : (script.characters || []);
    const character = characters.find(item => item?.name === String(name || '')) || null;
    if (!character) return { available: true, books: [], reason: '没找到这个角色' };

    const settings = ctx.getWorldInfoSettings?.() || script.getWorldInfoSettings?.() || {};
    let worldInfo = settings.world_info || script.world_info || {};
    /* 上下文没暴露 getWorldInfoSettings 时，charLore 只存在酒馆设置里 */
    if (!Array.isArray(worldInfo.charLore) && typeof fetch === 'function') {
      try {
        const headers = ctx.getRequestHeaders?.() || {};
        const response = await fetch('/api/settings/get', { method: 'POST', headers, body: '{}' });
        if (response.ok) {
          const saved = await response.json();
          worldInfo = saved.world_info_settings?.world_info || saved.world_info || worldInfo;
        }
      } catch { /* 读不到附加书就只读主书 */ }
    }
    const file = String(character.avatar || '').replace(/\.[^/.]+$/, '');
    const primary = String(character.data?.extensions?.world || '').trim();
    const extra = (worldInfo.charLore || []).find(item => item?.name === file)?.extraBooks || [];

    const names = [...new Set([primary, ...extra.map(String)].filter(Boolean))];
    const load = ctx.loadWorldInfo || script.loadWorldInfo;
    if (typeof load !== 'function') return { available: true, books: [], reason: '酒馆没开放世界书读取' };

    const books = [];
    for (const bookName of names) {
      try {
        const data = await load(bookName);
        if (!data) { books.push({ name: bookName, entries: [], error: '这本没读到' }); continue; }
        books.push({ name: bookName, entries: normalizeBookEntries(data), error: '' });
      } catch (error) {
        books.push({ name: bookName, entries: [], error: error.message || '这本没读到' });
      }
    }
    return { available: true, books, reason: '' };
  } catch (error) {
    return { available: true, books: [], reason: error.message || String(error) };
  }
}

/**
 * 读一本指定的世界书（人设绑定用）。
 * 和 readCharacterBooks 共用摊平逻辑，读不到时给 available:false，让上层退回演示数据。
 */
async function readWorldBook(bookName) {
  const name = String(bookName || '').trim();
  if (!name) return { available: false, name: '', entries: [], reason: '没填世界书名' };
  const script = await loadHostScript();

    if (typeof load !== 'function') return { available: false, name, entries: [], reason: '酒馆没开放世界书读取' };
    const data = await load(name);
    if (!data) return { available: true, name, entries: [], reason: '这本世界书没读到' };

}

/** 开 / 关一条世界书条目，直接写回酒馆世界书。 */
async function setWorldEntryEnabled(bookName, uid, disabled) {
  const script = await loadHostScript();
  if (!script) return { ok: false, reason: '没接上酒馆' };
  try {
    const ctx = globalThis.SillyTavern?.getContext?.() || script.getContext?.() || {};
    const load = ctx.loadWorldInfo || script.loadWorldInfo;
    const save = ctx.saveWorldInfo || script.saveWorldInfo;
    if (typeof load !== 'function' || typeof save !== 'function') {
      return { ok: false, reason: '酒馆没开放世界书写入' };
    }
    const data = await load(bookName);
    if (!data?.entries) return { ok: false, reason: '这本世界书没读到' };
    const key = Object.keys(data.entries).find(item => String(data.entries[item]?.uid ?? item) === String(uid));
    if (!key) return { ok: false, reason: '这条目已经不在了' };
    data.entries[key].disable = Boolean(disabled);
    await save(bookName, data, true);
    return { ok: true, disabled: Boolean(disabled) };
  } catch (error) {
    return { ok: false, reason: error.message || String(error) };
  }
}

async function hostRequestHeaders(script) {
  const ctx = globalThis.SillyTavern?.getContext?.() || script?.getContext?.() || {};
  const getHeaders = ctx.getRequestHeaders || script?.getRequestHeaders;
  const headers = typeof getHeaders === 'function' ? { ...getHeaders() } : {};
  if (!headers['X-CSRF-Token']) {
    const token = ctx.csrf_token || globalThis.csrf_token || '';
    if (token) headers['X-CSRF-Token'] = token;
  }
  headers['Content-Type'] = 'application/json';
  return headers;
}

function latestScore(item) {
  const raw = item?.last_mes ?? item?.lastMes ?? item?.mtime ?? item?.last_modified ?? item?.file_name ?? '';
  if (typeof raw === 'number') return raw > 1e12 ? raw : raw * 1000;
  const text = String(raw);
  const time = Date.parse(text);
  if (Number.isFinite(time)) return time;
  const match = text.match(/(\d{4})-(\d{2})-(\d{2})[^\d](\d{2})[^\d](\d{2})(?:[^\d](\d{2}))?/);
  if (match) {
    return Date.UTC(
      Number(match[1]), Number(match[2]) - 1, Number(match[3]),
      Number(match[4]), Number(match[5]), Number(match[6] || 0),
    );
  }
  return 0;
}

/**
 * 这个角色在酒馆里关联的最新聊天。
 * 先问酒馆的聊天文件列表，挑最近一条；列表读不到就退回角色卡上的当前聊天文件。
 */
async function readLatestTavernChat({ name = '', avatar = '', floors = 10, includeMemory = false } = {}) {
  const script = await loadHostScript();
  const empty = { available: false, file: '', characterName: name, lines: [], total: 0, metadata: null, messages: [] };
  if (!script || !Array.isArray(script.characters)) return empty;
  const character = script.characters.find(item => item && avatar && item.avatar === avatar)
    || script.characters.find(item => item && item.name === name);
  if (!character) return empty;

  const headers = await hostRequestHeaders(script);
  let file = String(character.chat || '').trim();
  let latestMeta = null;

  try {
    const response = await fetch('/api/characters/chats', {
      method: 'POST',
      headers,
      body: JSON.stringify({ avatar_url: character.avatar || character.name }),
      credentials: 'same-origin',
      cache: 'no-store',
    });
    if (response.ok) {
      const data = await response.json().catch(() => null);
      const list = Array.isArray(data) ? data : Object.values(data && typeof data === 'object' ? data : {});
      const sorted = list
        .filter(item => item && typeof item === 'object' && (item.file_name || item.fileName))
        .map(item => ({ ...item, file_name: item.file_name || item.fileName }))
        .sort((a, b) => latestScore(b) - latestScore(a));
      if (sorted.length) {
        file = sorted[0].file_name;
        latestMeta = sorted[0];
      }
    }
  } catch { /* 列表接口不可用就继续用角色卡上的 chat */ }

  let raw = [];
  let metadata = null;
  if (file) {
    try {
      const response = await fetch('/api/chats/get', {
        method: 'POST',
        headers,
        body: JSON.stringify({
          ch_name: character.name,
          file_name: String(file).replace(/\.jsonl$/i, ''),
          avatar_url: character.avatar || character.name,
        }),
        credentials: 'same-origin',
        cache: 'no-store',
      });
      if (response.ok) {
        const data = await response.json().catch(() => null);
        if (Array.isArray(data)) raw = data;
        else if (Array.isArray(data?.messages)) raw = data.messages;
        else if (Array.isArray(data?.chat)) raw = data.chat;
        metadata = data?.metadata || data?.chat_metadata || null;
      }
    } catch { raw = []; }
  }

  if (!raw.length && script.characters?.[script.this_chid]?.avatar === character.avatar && Array.isArray(script.chat)) {
    raw = script.chat;
    file = String(character.chat || '当前聊天');
    metadata = script.chatMetadata || null;
  }

  /* 聊天文件第一行是 metadata header（含 chat_metadata）；接口会原样返回它。 */
  const header = raw.find(line => line && typeof line === 'object' && line.chat_metadata && typeof line.chat_metadata === 'object');
  if (header?.chat_metadata) metadata = header.chat_metadata;

  const lines = raw
    .filter(line => line && !line.is_system && typeof line.mes === 'string' && line.mes.trim())
    .map(line => ({
      isUser: Boolean(line.is_user),
      name: line.name || (line.is_user ? (script.name1 || '你') : character.name),
      text: line.mes.trim(),
    }))
    .slice(-Math.max(1, Math.min(50, Number(floors) || 10)));

  return {
    available: Boolean(lines.length),
    file: file || '',
    characterName: character.name,
    lines,
    total: raw.length,
    meta: latestMeta,
    metadata: includeMemory ? metadata : null,
    messages: includeMemory ? raw : [],
  };
}
