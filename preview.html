        </div>`;
    }).join('');

    const promptRows = draw.presets.map(p => {
      const active = p.id === preset.id;
      const open = p.id === expandedPromptId;
      const deleting = drawDel?.kind === 'preset' && drawDel.id === p.id;
      const editing = drawEdit?.kind === 'preset' && drawEdit.id === p.id;
      const sub = `${(p.pos || '').slice(0, 22) || '无正向词'} · 反向 ${(p.neg || '').slice(0, 16) || '默认'}`;
      return `
        <div class="mp-api-stack">
          <button class="mp-row mp-api-row${open ? ' is-open' : ''}" data-act="draw-preset-toggle" data-id="${p.id}" type="button" aria-expanded="${open}">
            ${icon('brush')}
            <span class="mp-row-main">
              <span class="mp-row-name">${esc(p.name || '未命名')}${active ? '<span class="mp-api-chip">当前</span>' : ''}</span>
              <span class="mp-row-sub">${esc(sub)}</span>
            </span>
            <span class="mp-api-row-side"><span class="mp-api-caret">${icon('chevron')}</span></span>
          </button>
          ${open ? promptDetailMarkup(p) : ''}
          ${editing ? nameEditBlock('preset', drawEdit.value) : ''}
          ${deleting ? deleteConfirmBlock('preset', `只会删「${p.name || '当前提示词'}」这套提示词，引用它的方案会换回第一套提示词。`) : ''}
        </div>`;
    }).join('');

    return `
      <div class="mp-nav">
        <button class="mp-back" data-act="back" type="button">${icon('back')}</button>
        <span style="flex:1"></span>
      </div>
      <div class="mp-page-body">
        <div class="mp-subtitle" style="margin-top:0">绘图：${ep.engine === 'novelai' ? 'NovelAI 官方' : ep.engine === 'doubao' ? '豆包 Seedream · 火山方舟' : '自定义接口'} · 中文描述会先翻成 danbooru tag</div>

        <div class="mp-draw-state${ready ? ' is-on' : ''}">
          ${icon(ready ? 'spark' : 'help')}
          <span>${ready
            ? `已接「${esc(ep.name)}」${ep.model ? ` · ${esc(ep.model)}` : ''}`
            : (ep.engine === 'custom' ? '还没填自定义接口地址，现在是演示出图' : `${esc(ep.name)} 的 Key 还没填，现在是演示出图`)}</span>
          <button class="mp-draw-state-btn" data-act="${ep.engine === 'custom' ? 'draw-url' : 'draw-key'}" type="button">${ep.engine === 'custom' ? '改地址' : '填 Key'}</button>
        </div>

        <section class="mp-ios-card mp-api-scheme" aria-label="当前绘图方案">
          <div class="mp-api-sec-head is-inside">
            <div class="mp-api-sec-copy">
              <div class="mp-api-scheme-kicker">当前绘图方案</div>
            </div>
            <span class="mp-api-pill ${schemeDirty ? 'is-dirty' : 'is-saved'}">${schemeDirty ? '未保存' : '已保存'}</span>
          </div>

          ${iosSelect('draw-scheme', schemeOptions, scheme?.id || '', ' aria-label="选择整体方案"')}

          <div class="mp-api-scheme-fields">
            <label class="mp-api-scheme-field">
              <span>绘图 API</span>
              ${iosSelect('draw-api', apiOptions, image.activeId, ' aria-label="这套方案使用的绘图接口"')}
            </label>
            <label class="mp-api-scheme-field">
              <span>提示词预设</span>
              ${iosSelect('draw-preset', promptOptions, preset.id, ' aria-label="这套方案使用的提示词预设"')}
            </label>
          </div>

          ${schemeDirty ? '<div class="mp-api-hint is-dirty">当前改动还没保存。</div>' : ''}

          <div class="mp-api-save-row">
            <button class="mp-api-btn is-primary mp-api-save" data-act="draw-scheme-save" type="button">保存</button>
            ${schemeDirty ? '<button class="mp-api-more-btn" data-act="draw-scheme-revert" type="button">恢复为方案值</button>' : ''}
          </div>

          <div class="mp-api-more is-spaced">
            <button class="mp-api-more-btn" data-act="draw-scheme-new" type="button">新建方案</button>
            <button class="mp-api-more-btn" data-act="draw-scheme-rename" type="button">改名</button>
            <button class="mp-api-more-btn" data-act="draw-scheme-copy" type="button">复制</button>
            <button class="mp-api-more-btn is-danger" data-act="draw-scheme-del" type="button">删除</button>
          </div>

          ${drawEdit?.kind === 'scheme' ? nameEditBlock('scheme', drawEdit.value) : ''}
          ${drawDel?.kind === 'scheme' ? deleteConfirmBlock('scheme', `只会删「${scheme?.name || '当前方案'}」这套组合，接口预设和提示词预设都还在。`) : ''}
        </section>

        <div class="mp-api-sec-head">
          <div class="mp-api-sec-copy">
            <div class="mp-api-sec-title">绘图接口</div>
            <div class="mp-api-sec-sub">管理可供绘图方案使用的接口连接。</div>
          </div>
          <button class="mp-icon-btn" data-act="draw-api-new" type="button" aria-label="新建接口预设">${icon('plus')}</button>
          <span class="mp-api-count">${apiPresets.length} 套</span>
        </div>
        <div class="mp-api-list">${apiRows}</div>

        <div class="mp-api-sec-head">
          <div class="mp-api-sec-copy">
            <div class="mp-api-sec-title">提示词预设</div>
            <div class="mp-api-sec-sub">正向 / 反向提示词，供绘图方案选用。</div>
          </div>
          <button class="mp-icon-btn" data-act="draw-preset-new" type="button" aria-label="新建提示词预设">${icon('plus')}</button>
          <span class="mp-api-count">${draw.presets.length} 套</span>
        </div>
        <div class="mp-api-list">${promptRows}</div>

        <div class="mp-api-note">方案只记「接口 + 提示词预设」的组合；地址、Key、模型在各自展开面板里改。</div>

        <div class="mp-group-label" style="margin-top:14px">画面</div>
        <button class="mp-draw-desc" data-act="draw-prompt" type="button">
          ${draw.lastPrompt
            ? `<span class="mp-draw-desc-text">${esc(draw.lastPrompt)}</span>`
            : `<span class="mp-draw-desc-empty">写一句中文画面，比如「沈砚坐在便利店门口的台阶上，夜里，侧脸，路灯下抽烟」</span>`}
          ${icon('brush')}
        </button>

        <button class="mp-draw-run${busy ? ' is-busy' : ''}" data-act="draw-run" type="button">
          ${icon('spark')}<span>${busy ? '生成中…' : '生成一张'}</span>
        </button>

        <div class="mp-group-label" style="margin-top:12px">参数</div>
        <div class="mp-draw-grid">
          ${rows.map(row => `
            <button class="mp-draw-param" data-act="${row.act}" type="button">
              <span>${esc(row.label)}</span>
              <span class="mp-draw-val">${esc(String(row.value))}</span>
            </button>`).join('')}
        </div>

        ${draw.history.length ? `
          <div class="mp-group-label" style="margin-top:16px">最近生成</div>
          <div class="mp-draw-list">${history}</div>` : ''}
      </div>`;
  },

  handle(ctx, act, data) {
    const draw = ensure(ctx.state);
    const cfg = draw.config;
    const image = ctx.state.settings.image;
    const apiPresets = image.presets || [];
    const activeApiPreset = activeApi(ctx.state);
    const activePrompt = draw.presets[draw.presetIdx] || draw.presets[0];
    const scheme = draw.schemes.find(item => item.id === draw.schemeId);

    const apiById = id => apiPresets.find(p => p.id === String(id || '')) || activeApiPreset || null;
    const promptById = id => draw.presets.find(p => p.id === String(id || '')) || activePrompt || null;

    if (act === 'draw-scheme') {
      const picked = draw.schemes.find(item => item.id === String(data.value || ''));
      if (!picked) return true;
      applyScheme(ctx.state, picked);
      ctx.save();
      ctx.rerender();
      ctx.toast(`切到方案「${picked.name || '未命名'}」`);
      return true;
    }

    if (act === 'draw-scheme-new') {
      const copy = {
        id: newId('ds'),
        name: `${activePrompt.name || '提示词'} · ${activeApiPreset?.name || '接口'}`,
        apiId: image.activeId,
        promptId: activePrompt.id,
      };
      draw.schemes.push(copy);
      draw.schemeId = copy.id;
      drawEdit = { kind: 'scheme', id: copy.id, value: copy.name };
      drawDel = null;
      ctx.save();
      ctx.rerender();
      ctx.toast('按当前接口 + 提示词新建了一套方案，顺手改个名字');
      return true;
    }

    if (act === 'draw-scheme-save') {
      if (!scheme) { ctx.toast('先选一套整体方案'); return true; }
      scheme.apiId = image.activeId;
      scheme.promptId = activePrompt.id;
      ctx.save();
      ctx.rerender();
      ctx.toast(`已保存到方案「${scheme.name || '未命名'}」`);
      return true;
    }

    if (act === 'draw-scheme-revert') {
      if (!scheme) { ctx.toast('先选一套整体方案'); return true; }
      const savedApi = apiPresets.find(p => p.id === scheme.apiId);
      const savedPrompt = draw.presets.find(p => p.id === scheme.promptId);
      if (savedApi) { image.activeId = savedApi.id; image.engine = savedApi.engine; }
      if (savedPrompt) draw.presetIdx = draw.presets.indexOf(savedPrompt);
      ctx.save();
      ctx.rerender();
      ctx.toast('已恢复成这套方案保存的值');
      return true;
    }

    if (act === 'draw-scheme-copy') {
      if (!scheme) { ctx.toast('先选一套整体方案'); return true; }
      const copy = {
        id: newId('ds'),
        name: `${scheme.name || '方案'} 副本`.slice(0, 20),
        apiId: scheme.apiId,
        promptId: scheme.promptId,
      };
      draw.schemes.push(copy);
      draw.schemeId = copy.id;
      applyScheme(ctx.state, copy);
      drawEdit = null;
      drawDel = null;
      ctx.save();
      ctx.rerender();
      ctx.toast(`复制成「${copy.name}」`);
      return true;
    }

    if (act === 'draw-scheme-rename') {
      if (!scheme) { ctx.toast('先选一套整体方案'); return true; }
      drawEdit = { kind: 'scheme', id: scheme.id, value: scheme.name || '' };
      drawDel = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-scheme-name-save') {
      const input = globalThis.document?.getElementById('drawSchemeName');
      const name = String(input?.value || '').trim().slice(0, 20);
      const editing = scheme && drawEdit?.kind === 'scheme'
        ? draw.schemes.find(item => item.id === drawEdit.id) || scheme
        : scheme;
      if (editing && name) editing.name = name;
      drawEdit = null;
      ctx.save();
      ctx.rerender();
      ctx.toast(name ? `方案改名为「${name}」` : '名字没变');
      return true;
    }

    if (act === 'draw-scheme-name-cancel') {
      drawEdit = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-scheme-del') {
      if (!scheme) { ctx.toast('先选一套整体方案'); return true; }
      if (draw.schemes.length <= 1) { ctx.toast('至少留一套整体方案'); return true; }
      drawDel = { kind: 'scheme', id: scheme.id };
      drawEdit = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-scheme-del-confirm') {
      if (!scheme) return true;
      draw.schemes = draw.schemes.filter(item => item.id !== scheme.id);
      const next = draw.schemes[0] || null;
      if (next) applyScheme(ctx.state, next);
      else draw.schemeId = '';
      drawDel = null;
      ctx.save();
      ctx.rerender();
      ctx.toast('整体方案已删除');
      return true;
    }

    if (act === 'draw-scheme-del-cancel') {
      drawDel = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-api-toggle') {
      const id = String(data.id || '');
      expandedApiId = expandedApiId === id ? '' : id;
      drawEdit = null;
      drawDel = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-api') {
      const picked = apiPresets.find(p => p.id === String(data.value || ''));
      if (!picked) return true;
      image.activeId = picked.id;
      image.engine = picked.engine;
      ctx.save();
      ctx.rerender();
      ctx.toast(`接口换成「${picked.name || '未命名'}」`);
      return true;
    }

    if (act === 'draw-api-rename') {
      const target = apiById(data.id);
      if (!target?.id) { ctx.toast('现在还没有接口预设'); return true; }
      drawEdit = { kind: 'api', id: target.id, value: target.name || '' };
      drawDel = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-api-name-save') {
      const input = globalThis.document?.getElementById('drawApiName');
      const name = String(input?.value || '').trim().slice(0, 20);
      const target = apiPresets.find(p => p.id === drawEdit?.id) || activeApiPreset;
      if (target?.id && name) target.name = name;
      drawEdit = null;
      ctx.save();
      ctx.rerender();
      ctx.toast(name ? `接口改名为「${name}」` : '名字没变');
      return true;
    }

    if (act === 'draw-api-name-cancel') {
      drawEdit = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-api-del') {
      const target = apiById(data.id);
      if (!target?.id) { ctx.toast('现在还没有接口预设'); return true; }
      if (image.presets.length <= 1) { ctx.toast('至少留一套接口预设'); return true; }
      drawDel = { kind: 'api', id: target.id };
      drawEdit = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-api-del-confirm') {
      const removedId = drawDel?.id || '';
      if (!image.presets.some(item => item.id === removedId)) { drawDel = null; return true; }
      image.presets = image.presets.filter(item => item.id !== removedId);
      image.activeId = image.presets[0].id;
      image.engine = image.presets[0].engine;
      draw.schemes.forEach(item => { if (item.apiId === removedId) item.apiId = image.activeId; });
      const current = draw.schemes.find(item => item.id === draw.schemeId);
      if (current) applyScheme(ctx.state, current);
      if (expandedApiId === removedId) expandedApiId = '';
      drawDel = null;
      ctx.save();
      ctx.rerender();
      ctx.toast('接口预设已删除');
      return true;
    }

    if (act === 'draw-api-del-cancel') {
      drawDel = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-api-new') {
      const source = apiById(data.id) || activeApiPreset || {};
      const copy = { ...source, id: newId('image'), name: `${source.name || '接口'} 副本` };
      image.presets.push(copy);
      image.activeId = copy.id;
      image.engine = copy.engine;
      expandedApiId = copy.id;
      drawEdit = { kind: 'api', id: copy.id, value: copy.name };
      drawDel = null;
      ctx.save();
      ctx.rerender();
      ctx.toast('复制出一套新接口，顺手改个名字');
      return true;
    }

    if (act === 'draw-engine') {
      const target = apiById(data.id);
      if (!target) return true;
      const engine = target.engine;
      ctx.openSheet({
        kind: 'pick', title: '绘图接口',
        items: ENGINES.map(item => ({ value: item.value, label: item.label, note: item.note })),
        onPick: value => {
          const defaults = value === 'novelai' ? (image.novelai || {}) : value === 'doubao' ? (image.doubao || {}) : (image.custom || {});
          target.engine = value;
          if (target.id === image.activeId) image.engine = value;
          target.name = value === 'novelai' ? 'NovelAI 官方' : value === 'doubao' ? '豆包 Seedream' : '自定义接口';
          target.url = String(defaults.url || '');
          target.path = value === 'custom' ? String(defaults.path || '/v1/images/generations') : '';
          target.key = String(defaults.key || '');
          target.model = String(defaults.model || '');
          ctx.save();
          ctx.rerender();
          const name = ENGINES.find(item => item.value === value)?.label || value;
          ctx.toast(`绘图接口换成「${name}」`);
        },
      });
      return true;
    }

    if (act === 'draw-url') {
      const target = apiById(data.id);
      if (!target) return true;
      const engine = target.engine;
      ctx.openSheet({
        kind: 'text', title: engine === 'novelai' ? 'NovelAI 地址' : engine === 'doubao' ? '火山方舟地址' : '接口地址',
        placeholder: engine === 'novelai'
          ? '默认 https://image.novelai.net'
          : engine === 'doubao' ? 'https://ark.cn-beijing.volces.com/api/v3/images/generations'
            : 'https://你的接口/v1/images/generations',
        value: String(target.url || ''),
        onText: value => {
          target.url = value.trim();
          setEngineField(image, target.engine, 'url', target.url);
          ctx.save();
          ctx.rerender();
        },
      });
      return true;
    }

    if (act === 'draw-key') {
      const target = apiById(data.id);
      if (!target) return true;
      const engine = target.engine;
      ctx.openSheet({
        kind: 'text',
        title: engine === 'novelai' ? 'NovelAI Key' : engine === 'doubao' ? 'ARK API Key' : '接口 Key',
        placeholder: engine === 'novelai' ? 'pst- 开头的那串' : engine === 'doubao' ? '火山方舟控制台里的 ARK_API_KEY' : '没验证就留空',
        value: String(target.key || ''),
        onText: value => {
          target.key = value.trim();
          setEngineField(image, target.engine, 'key', target.key);
          ctx.save();
          ctx.rerender();
        },
      });
      return true;
    }

    if (act === 'draw-model') {
      const target = apiById(data.id);
      if (!target) return true;
      const engine = target.engine;
      /* 内置候选 + 拉取到的模型 + 手填；拉不到列表时至少能手填，不让模型选死 */
      const builtin = engine === 'novelai' ? NAI_MODELS : engine === 'doubao' ? DOUBAO_MODELS : [];
      const fetched = (Array.isArray(target.models) ? target.models : [])
        .map(value => ({ value, label: String(value) }));
      const seen = new Set(builtin.map(item => item.value));
      const items = [...builtin, ...fetched.filter(item => !seen.has(item.value))];
      const pickManual = () => ctx.openSheet({
        kind: 'text', title: '模型',
        placeholder: '接口要的模型名，比如 flux-dev',
        value: String(target.model || ''),
        onText: value => { target.model = value.trim(); setEngineField(image, target.engine, 'model', target.model); ctx.save(); ctx.rerender(); },
      });
      items.push({ value: '__manual__', label: '手动填模型名…', note: '列表里没有就自己写' });
      ctx.openSheet({
        kind: 'pick',
        title: '模型',
        note: engine === 'novelai' ? '官方不给模型列表，下面是内置候选；也能手填' : '',
        items,
        onPick: value => {
          if (value === '__manual__') { setTimeout(pickManual, 0); return; }
          target.model = value;
          setEngineField(image, target.engine, 'model', value);
          ctx.save();
          ctx.rerender();
        },
      });
      return true;
    }

    if (act === 'draw-test') {
      const target = apiById(data.id);
      if (!target || !image.presets.includes(target)) return true;
      target.status = { ok: false, text: '正在连接…', at: Date.now() };
      ctx.save();
      ctx.rerender();
      probeImageApi({ engine: target.engine, url: target.url, key: target.key, path: target.path })
        .then(result => {
          target.status = { ok: Boolean(result?.ok), text: String(result?.text || ''), at: Date.now() };
          if (Array.isArray(result?.models) && result.models.length) target.models = result.models;
          ctx.save();
          ctx.rerender();
          ctx.toast(result?.ok ? '连接正常' : String(result?.text || '没连上'));
        })
        .catch(error => {
          target.status = { ok: false, text: error?.message || String(error), at: Date.now() };
          ctx.save();
          ctx.rerender();
          ctx.toast(error?.message || '没连上');
        });
      return true;
    }

    if (act === 'draw-prompt') {
      ctx.openSheet({
        kind: 'text', title: '画面', placeholder: '中文描述，越具体越好',
        value: draw.lastPrompt, onText: value => { draw.lastPrompt = value; ctx.save(); ctx.rerender(); },
      });
      return true;
    }

    if (act === 'draw-pos' || act === 'draw-neg') {
      const target = promptById(data.id);
      if (!target) return true;
      const key = act === 'draw-pos' ? 'pos' : 'neg';
      ctx.openSheet({
        kind: 'text', title: act === 'draw-pos' ? '正向提示词' : '反向提示词',
        placeholder: key === 'pos' ? '质量词 + 想要的东西' : '不想要的东西',
        value: target[key] || '',
        onText: value => {
          target[key] = value;
          ctx.save();
          ctx.rerender();
        },
      });
      return true;
    }

    if (act === 'draw-preset-toggle') {
      const id = String(data.id || '');
      expandedPromptId = expandedPromptId === id ? '' : id;
      drawEdit = null;
      drawDel = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-preset') {
      const picked = draw.presets.find(p => p.id === String(data.value || ''));
      if (!picked) return true;
      draw.presetIdx = draw.presets.indexOf(picked);
      ctx.save();
      ctx.rerender();
      return true;
    }

    if (act === 'draw-preset-rename') {
      const target = promptById(data.id);
      if (!target?.id) { ctx.toast('现在还没有提示词预设'); return true; }
      drawEdit = { kind: 'preset', id: target.id, value: target.name || '' };
      drawDel = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-preset-name-save') {
      const input = globalThis.document?.getElementById('drawPresetName');
      const name = String(input?.value || '').trim().slice(0, 20);
      const target = draw.presets.find(p => p.id === drawEdit?.id) || activePrompt;
      if (target?.id && name) target.name = name;
      drawEdit = null;
      ctx.save();
      ctx.rerender();
      ctx.toast(name ? `提示词改名为「${name}」` : '名字没变');
      return true;
    }

    if (act === 'draw-preset-name-cancel') {
      drawEdit = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-preset-del') {
      const target = promptById(data.id);
      if (!target?.id) { ctx.toast('现在还没有提示词预设'); return true; }
      if (draw.presets.length <= 1) { ctx.toast('至少留一套提示词预设'); return true; }
      drawDel = { kind: 'preset', id: target.id };
      drawEdit = null;
      ctx.rerender();
      return true;
    }

    if (act === 'draw-preset-del-confirm') {
      const removedId = drawDel?.id || '';
      if (!draw.presets.some(p => p.id === removedId)) { drawDel = null; return true; }
      const removedIndex = draw.presets.findIndex(p => p.id === removedId);
      draw.presets.splice(removedIndex, 1);
      draw.presetIdx = Math.max(0, Math.min(draw.presetIdx, draw.presets.length - 1));
      draw.schemes.forEach(item => { if (item.promptId === removedId) item.promptId = draw.presets[0].id; });
      const current = draw.schemes.find(item => item.id === draw.schemeId);
      if (current) applyScheme(ctx.state, current);
      if (expandedPromptId === removedId) expandedPromptId = '';
      drawDel = null;
      ctx.save();
      ctx.rerender();
      ctx.toast('提示词预设已删除');

    id: newId('api'),
    name: autoName,
    engine: info.source === 'custom' ? 'custom' : 'openai',
    url: importedUrl,
    path: '/v1/chat/completions',
    model: info.model || '',
    key: info.key || '',
    temp: 0.8,
    tavernSource: info.source,
    tavernProfileId: info.profileId || '',
    tavernAutoName: autoName,
    models: [],
  };
  store.presets.push(preset);
  expandedId = preset.id;
  ctx.save();
  redraw(ctx);
  say(ctx, importedUrl
    ? `导入了「${preset.name}」，接着测试连接、拉模型`
    : `导入了「${preset.name}」，酒馆没填反代地址，补上地址再连接`);
}

function deleteConfirm(state, store) {
  if (!apiDelete) return '';
  if (apiDelete.type === 'scheme') {
    const scheme = chatSchemesOf(state).find(item => item.id === apiDelete.id);
    if (!scheme) return '';
    return `
      <div class="mp-api-delete">
        <div class="mp-api-delete-title">删除方案「${esc(scheme.name || '未命名')}」？</div>
        <div class="mp-api-delete-sub">只删这套「接口 + 回复预设」的组合，接口和回复预设都还在。至少会留一套方案。</div>
        <div class="mp-api-actions">
          <button class="mp-api-btn is-danger" data-act="api-scheme-del-confirm" type="button">确认删除方案</button>
          <button class="mp-api-btn" data-act="api-delete-cancel" type="button">取消</button>
        </div>
      </div>`;
  }

  const preset = store.presets.find(item => item.id === apiDelete.id);
  if (!preset) return '';
  const linked = chatSchemesOf(state).filter(item => item.apiId === preset.id);
  const chats = Object.values(state.chats || {}).filter(chat => chat.llmPresetId === preset.id);
  return `
    <div class="mp-api-delete">
      <div class="mp-api-delete-title">删除接口「${esc(preset.name || '未命名')}」？</div>
      <div class="mp-api-delete-sub">
        删除后不能恢复。${linked.length ? `${linked.length} 套方案还在引用它，要先处理这些引用。` : '没有方案引用它。'}
        ${store.activeChat === preset.id ? '当前聊天正在用它。' : ''}
        ${chats.length ? `${chats.length} 个单独引用它的会话会恢复跟随手机。` : ''}
        ${linked.length ? '只删接口时，这些方案会改指兜底接口；也可以连方案一起删。' : ''}
      </div>
      <div class="mp-api-actions">
        ${linked.length ? `<button class="mp-api-btn is-danger" data-act="api-del-schemes-confirm" type="button">删接口 + ${linked.length} 套方案</button>` : ''}
        <button class="mp-api-btn${linked.length ? '' : ' is-danger'}" data-act="api-del-confirm" type="button">只删接口</button>
        <button class="mp-api-btn" data-act="api-delete-cancel" type="button">取消</button>
      </div>
    </div>`;
}

function deleteApiPreset(ctx, store, pending, withSchemes) {
  const linked = chatSchemesOf(ctx.state).filter(item => item.apiId === pending.id);
  const linkedCount = linked.length;
  const chatCount = Object.values(ctx.state.chats || {}).filter(chat => chat.llmPresetId === pending.id).length;
  store.presets = store.presets.filter(item => item.id !== pending.id);
  const fallback = store.presets[0];
  let fallbackCreated = false;

  if (withSchemes) {
    const kept = chatSchemesOf(ctx.state).filter(item => item.apiId !== pending.id);
    if (!kept.length) {
      const reply = replyPresetFor(ctx.state, null);
      const scheme = { id: newId('lsch'), name: '默认', apiId: fallback.id, replyId: reply?.id || '' };
      store.chatSchemes = [scheme];
      store.chatSchemeId = scheme.id;
      fallbackCreated = true;
    } else {
      store.chatSchemes = kept;
      if (!kept.some(item => item.id === store.chatSchemeId)) store.chatSchemeId = kept[0].id;
    }
  } else {
    store.chatSchemes.forEach(item => { if (item.apiId === pending.id) item.apiId = fallback.id; });
    if (!store.chatSchemes.some(item => item.id === store.chatSchemeId)) {
      store.chatSchemeId = store.chatSchemes[0]?.id || '';
    }
  }

  if (store.activeChat === pending.id) store.activeChat = fallback.id;
  /* 单个聊天如果引用过这套接口，清掉引用，别留下空 id */
  Object.values(ctx.state.chats || {}).forEach(chat => {
    if (chat && chat.llmPresetId === pending.id) chat.llmPresetId = '';
  });
  if (expandedId === pending.id) expandedId = '';
  drafts.delete(pending.id);
  persistDrafts(ctx.state);
  apiDelete = null;
  ctx.save();
  redraw(ctx);
  const parts = [`接口「${pending.name || '未命名'}」删掉了`];
  if (fallbackCreated) parts.push('方案删空，补了一套「默认」');
  else if (withSchemes && linkedCount) parts.push(`${linkedCount} 套方案一起删了`);
  else if (linkedCount) parts.push(`${linkedCount} 套方案已改指兜底`);
  if (chatCount) parts.push(`${chatCount} 个会话恢复跟随手机`);
  say(ctx, parts.join('，'));
}

function presetDot(preset) {
  if (preset?.status) {
    return preset.status.ok
      ? { cls: 'is-ok', text: preset.status.text || '连接正常' }
      : { cls: 'is-bad', text: preset.status.text || '连接失败' };
  }
  if (preset?.engine === 'tavern') return { cls: 'is-idle', text: '借酒馆自己的接口' };
  return { cls: '', text: '还没测试连接' };
}

    const apiOptions = store.presets.map(preset => ({ value: preset.id, label: preset.name || '未命名' }));
    const replyOptions = replyPresetsOf(ctx.state).map(item => ({ value: item.id, label: item.name || '未命名' }));
    const rows = store.presets.map(preset => {

        ? (draft.model ? `酒馆 API · ${draft.model}` : '借酒馆自己的模型')

              <span class="mp-row-sub">${esc(sub)}</span>

        <section class="mp-ios-card mp-api-scheme" aria-label="当前聊天方案">
          <div class="mp-api-sec-head is-inside">
            <div class="mp-api-sec-copy">
              <div class="mp-api-scheme-kicker">当前聊天方案</div>
            </div>

          <div class="mp-api-scheme-fields">

            </label>

              <span>回复预设</span>
              ${iosSelect('api-reply-select', replyOptions, currentReply?.id || '', ' aria-label="这套方案使用的回复预设"')}
            </label>
          </div>

          ${schemeDirty ? '<div class="mp-api-hint is-dirty">当前改动还没保存。</div>' : ''}

          <div class="mp-api-save-row">
            <button class="mp-api-btn is-primary mp-api-save" data-act="api-scheme-save" type="button">保存</button>
            ${schemeDirty ? '<button class="mp-api-more-btn" data-act="api-scheme-revert" type="button">恢复为方案值</button>' : ''}
          </div>

          <div class="mp-api-more is-spaced">
            <button class="mp-api-more-btn" data-act="api-scheme-new" type="button">新建方案</button>
            <button class="mp-api-more-btn" data-act="api-scheme-rename" type="button">改名</button>

          ${schemeEdit ? `
          <div class="mp-api-name-edit">

            <button class="mp-api-btn is-primary" data-act="api-scheme-name-save" type="button">确定</button>
            <button class="mp-api-btn" data-act="api-scheme-name-cancel" type="button">取消</button>
          </div>` : ''}

          ${apiDelete?.type === 'scheme' ? deleteConfirm(ctx.state, store) : ''}
        </section>

        <div class="mp-api-sec-head">
          <div class="mp-api-sec-copy">

          <button class="mp-icon-btn" data-act="api-new" type="button" aria-label="新建 API 接口">${icon('plus')}</button>

        <div class="mp-api-list">${rows}</div>
        <button class="mp-api-import" data-act="api-import-tavern" type="button">从酒馆导入当前接口</button>

        <div class="mp-api-sec-head">

          </div>
        </div>
        <div class="mp-api-reply">
          <div class="mp-api-reply-main">
            <span class="mp-api-reply-label">当前方案使用</span>

          </div>
          <button class="mp-api-reply-link" data-act="api-open-presets" type="button">管理回复预设${icon('chevron')}</button>
        </div>

        <div class="mp-api-note">方案只记「接口 + 回复预设」，不关联酒馆记忆；接口的地址、Key、模型在各自展开面板里改。</div>
      </div>`;
  },

  onInput(ctx, event) {
    const input = event.target?.closest?.('[data-api-field]');
    if (!input) return false;
    const preset = api(ctx.state).presets.find(item => item.id === input.closest('.mp-api-detail')?.dataset.id);
    if (!preset) return false;
    const draft = draftFor(preset);
    const key = input.dataset.apiField;
    if (key === 'temp') {
      const num = Number(String(input.value || ''));
      draft.temp = Number.isFinite(num) ? Math.min(2, Math.max(0, num)) : 0.8;
    } else if (key) {
      draft[key] = String(input.value || '').trim();
    }
    markDraftNote(input);
    persistDrafts(ctx.state);
    return true;
  },

  handle(ctx, act, data, event) {
    const store = api(ctx.state);
    const scheme = activeChatScheme(ctx.state);

    if (act === 'api-toggle') {
      const id = String(data.id || '');
      const previous = store.presets.find(preset => preset.id === expandedId);
      const detail = ctx.shell.root?.querySelector(`.mp-api-detail[data-id="${expandedId}"]`);
      if (previous && detail) readDraft(detail, draftFor(previous));
      expandedId = expandedId === id ? '' : id;
      schemeEdit = null;
      apiDelete = null;
      redraw(ctx);
      return true;
    }

    if (act === 'api-key-reveal') {
      const id = String(data.id || '');
      const preset = store.presets.find(item => item.id === id);
      if (!preset) return true;
      const detail = event?.target?.closest('.mp-api-detail');
      if (detail) readDraft(detail, draftFor(preset));
      if (revealed.has(id)) revealed.delete(id);
      else revealed.add(id);
      redraw(ctx);
      return true;
    }

    if (act === 'api-scheme-select') {
      const picked = chatSchemesOf(ctx.state).find(item => item.id === String(data.value || ''));
      if (!picked) return true;
      applyChatScheme(ctx.state, picked);
      schemeEdit = null;
      apiDelete = null;
      ctx.save();
      redraw(ctx);
      say(ctx, `整体方案换成「${picked.name || '未命名'}」`);
      return true;
    }

    if (act === 'api-chat-select') {
      const target = store.presets.find(preset => preset.id === String(data.value || ''));
      if (!target) return true;
      store.activeChat = target.id;
      apiDelete = null;
      ctx.save();
      redraw(ctx);
      say(ctx, `聊天 API 已换成「${target.name || '未命名'}」`);
      return true;
    }

    if (act === 'api-reply-select') {
      const target = replyPresetsOf(ctx.state).find(item => item.id === String(data.value || ''));
      if (!target) return true;
      ctx.state.settings.reply.activeId = target.id;
      apiDelete = null;
      ctx.save();
      redraw(ctx);
      say(ctx, `回复预设已换成「${target.name || '未命名'}」`);
      return true;
    }

    if (act === 'api-scheme-revert') {
      if (!scheme) { say(ctx, '先选一套整体方案'); return true; }
      const savedApi = store.presets.find(preset => preset.id === scheme.apiId);
      const savedReply = replyPresetsOf(ctx.state).find(item => item.id === scheme.replyId);
      if (savedApi) store.activeChat = savedApi.id;
      if (savedReply) ctx.state.settings.reply.activeId = savedReply.id;
      ctx.save();
      redraw(ctx);
      say(ctx, '已恢复成这套方案保存的值');
      return true;
    }

    if (act === 'api-open-presets') {
      ctx.go('app-presets');
      return true;
    }

    if (act === 'api-scheme-save') {
      if (!scheme) { say(ctx, '先选一套整体方案'); return true; }
      scheme.apiId = store.activeChat;
      scheme.replyId = ctx.state.settings.reply?.activeId || '';
      store.chatSchemeId = scheme.id;
      schemeEdit = null;
      ctx.save();
      redraw(ctx);
      say(ctx, `已保存到方案「${scheme.name || '未命名'}」`);
      return true;
    }

    if (act === 'api-scheme-new') {
      const reply = replyPresetFor(ctx.state, null);

    try {
      player.src = url;
      const started = player.play();
      if (started && typeof started.then === 'function') {
        started.then(() => finish(true)).catch(error => {
          /* 被浏览器自动播放策略拦住不是音源的问题，别把它当成换源失败 */
          if (error && error.name === 'NotAllowedError') finish(true);
        });
      }
    } catch {
      finish(false);
    }
  });
}

function trackSourceTag(track) {
  if (track.dead) return '暂无可播源';
  const playing = track.playVia || track.via || '';
  const label = SOURCE_LABEL[playing] || '';
  if (!label) return '';
  const swapped = Boolean(track.swapped) || Boolean(track.via && playing && track.via !== playing);
  return swapped ? `${label}·换源` : label;
}

function trackFromState(state) {
  if (current) return current;
  const saved = state?.music?.current;
  if (!saved) return null;
  const playlist = (state.music.playlists || []).find(item => item.id === saved.playlistId);
  const track = playlist?.tracks?.find(item => item.id === saved.trackId);
  if (!track) return null;
  return { ...track, trackId: track.id, playlistId: playlist.id, playlistName: playlist.name };
}

function setCurrent(track, playlist) {
  current = { ...track, trackId: track.id, playlistId: playlist?.id || '', playlistName: playlist?.name || '' };
  playing = Boolean(audio && !audio.paused);
}

function paintProgress() {
  const node = document.getElementById('mpMusicBar');
  const time = document.getElementById('mpMusicTime');
  if (!node || !audio) return;
  const duration = Number(audio.duration) || 0;
  const now = Number(audio.currentTime) || 0;
  const pct = duration ? Math.min(100, now / duration * 100) : 0;
  node.style.width = `${pct}%`;
  if (time) time.textContent = `${fmtTime(now)} / ${duration ? fmtTime(duration) : '--:--'}`;
}

function paintPlayState() {
  playing = Boolean(audio && !audio.paused);
  document.querySelectorAll('[data-music-label]').forEach(node => {
    node.textContent = playing ? '暂停' : '播放';
  });
  document.querySelectorAll('[data-music-icon]').forEach(node => {
    node.innerHTML = icon(playing ? 'pause' : 'play');
  });
  paintProgress();
}

function ensureAudio() {
  if (audio) return audio;
  audio = new Audio();
  audio.preload = 'none';
  audio.addEventListener('timeupdate', paintProgress);
  audio.addEventListener('durationchange', paintProgress);
  audio.addEventListener('play', paintPlayState);
  audio.addEventListener('pause', paintPlayState);
  audio.addEventListener('ended', () => {
    playing = false;
    playNextByQueue();
  });
  audio.addEventListener('error', () => {
    playing = false;
    paintPlayState();
    if (!audio.src) return;            // 手动停止时清空了 src，不算故障
    if (attemptDepth > 0) return;      // 正在试音源，由换源流程决定下一条
    if (current) current.dead = true;
    if (typeof audio.__ctxToast === 'function') audio.__ctxToast('音源断了，正在自动换源…');
    recoverCurrent();
  });
  return audio;
}

function stopMusic() {
  loadToken += 1;   // 让还在跑的换源流程立刻作废
  recovering = false;
  deadCandidates = [];
  if (audio) {
    try { audio.pause(); } catch { /* 忽略 */ }
    try { audio.removeAttribute('src'); audio.load(); } catch { /* 忽略 */ }
  }
  playing = false;
  current = null;
  queue = [];
  queueIndex = 0;
  queuePlaylistId = '';
}

function abortAfter(ms) {
  const controller = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => controller?.abort(), ms);
  return { controller, done: () => clearTimeout(timer) };
}

async function fetchText(url, timeout = 22000) {
  const gate = abortAfter(timeout);
  try {
    const res = await fetch(url, {
      method: 'GET',
      cache: 'no-store',
      credentials: 'omit',
      signal: gate.controller?.signal,
    });
    if (!res.ok) throw new Error(`读取失败（${res.status}）`);
    return await res.text();
  } finally {
    gate.done();
  }
}

async function fetchJson(url) {
  const text = await fetchText(url, 16000);
  try { return JSON.parse(text); } catch { throw new Error('歌单返回格式不对'); }
}

function allowedLink(link) {
  try {
    const host = new URL(link).hostname;
    return ALLOWED_LINKS.some(item => host === item || host.endsWith(`.${item}`));
  } catch {
    return false;
  }
}

async function readPage(link) {
  if (!allowedLink(link)) throw new Error('只支持网易云或汽水的歌单链接');
  return fetchText(`${READER_API}${link}`, 26000);
}

async function resolveNeteaseId(text) {
  const raw = text.trim();
  if (/^\d{5,}$/.test(raw)) return raw;
  const idMatch = raw.match(/[?&]id=([0-9]{5,})/) || raw.match(/playlist\/([0-9]{5,})/);
  if (idMatch) return idMatch[1];
  const short = raw.match(/https?:\/\/[^\s]+/);
  if (!short) return '';
  const link = short[0];
  if (!/163cn\.tv|music\.163\.com/.test(link)) return '';
  const page = await readPage(link);
  const found = page.match(/music\.163\.com\/(?:#\/)?playlist(?:[^0-9]{0,30})([0-9]{5,})/)
    || page.match(/[?&]id=([0-9]{5,})/);
  return found ? found[1] : '';
}

async function neteaseMeta(id) {
  try {
    const text = await readPage(`https://music.163.com/api/v6/playlist/detail?id=${id}&n=0`);
    const name = text.match(/"playlist":\s*\{"id":[^\n]*?"name":"((?:\\.|[^"\\])*)"/);
    const cover = text.match(/"coverImgUrl":"((?:\\.|[^"\\])*)"/);
    return {
      name: name ? jsonText(name[1]) : '',
      cover: cover ? secureUrl(jsonText(cover[1])) : '',
    };
  } catch {
    return { name: '', cover: '' };
  }
}

function neteaseTracks(list, playlistId) {
  if (!Array.isArray(list)) throw new Error('网易云没返回歌曲列表');
  return list.slice(0, 300).map((item, index) => ({
    id: `ne_${playlistId}_${index}`,
    title: String(item.title || '未命名'),
    artist: String(item.author || '').replace(/\s*\/\s*/g, '、'),
    album: '',
    url: secureUrl(item.url || ''),
    pic: secureUrl(item.pic || ''),
    lrc: item.lrc || '',
    via: 'netease',
  })).filter(item => item.title);
}

async function importNetease(ctx, raw) {
  const id = await resolveNeteaseId(raw);
  if (!id) throw new Error('没认出网易云歌单 ID，请粘贴带 playlist?id= 的完整链接');
  const [meta, tracks] = await Promise.all([
    neteaseMeta(id),
    fetchJson(`${MUSIC_API}?server=netease&type=playlist&id=${encodeURIComponent(id)}`),
  ]);
  const list = neteaseTracks(tracks, id);
  if (!list.length) throw new Error('这个歌单里没读到歌');
  savePlaylist(ctx, {
    source: 'netease',
    remoteId: id,
    name: meta.name || `网易云歌单 ${id}`,
    cover: meta.cover || list[0].pic,
    link: `https://music.163.com/playlist?id=${id}`,
    tracks: list,
  });
}

function pageTitle(text) {
  const match = text.match(/^Title:\s*(.+)$/m);
  return match ? match[1].trim() : '';
}

function qishuiPageTracks(text) {
  const body = text.includes('Markdown Content:') ? text.split('Markdown Content:').pop() : text;
  const lines = body.split('\n').map(line => line.trim()).filter(Boolean);
  const tracks = [];
  const seen = new Set();
  for (let index = 0; index < lines.length - 2; index += 1) {
    if (!/^\d{1,4}$/.test(lines[index])) continue;
    const title = lines[index + 1];
    const meta = lines[index + 2];
    if (!title || /^https?:/i.test(title) || !meta.includes('•')) continue;
    const [artistPart, albumPart] = meta.split('•').map(part => part.trim());
    const artist = artistPart || '未知歌手';
    const album = albumPart || '';
    const key = `${title}::${artist}`;
    if (seen.has(key)) continue;
    seen.add(key);
    tracks.push({
      id: `qs_page_${index}_${newId('t').slice(-6)}`,
      title,
      artist,
      album,
      url: '',
      pic: '',
      lrc: '',
      via: 'qishui',
    });
    if (tracks.length >= 200) break;
    index += 2;
  }
  return tracks;
}

function qishuiIdFromText(text) {
  const match = text.match(/[?&]playlist_id=([0-9]{5,})/)
    || text.match(/"playlist"\s*:\s*\{"id"\s*:\s*"([0-9]{5,})"/)
    || text.match(/"id"\s*:\s*"([0-9]{5,})"\s*,\s*"title"/);
  return match ? match[1] : '';
}

async function resolveQishuiId(link) {
  const direct = link.match(/[?&]playlist_id=([0-9]+)/);
  if (direct) return direct[1];
  const page = await readPage(link);
  const found = qishuiIdFromText(page);
  if (found) return found;
  throw new Error('没认出汽水歌单 ID，请粘贴公开歌单的完整分享链接');
}

function qishuiApiTracks(data, playlistId) {
  const resources = Array.isArray(data?.media_resources) ? data.media_resources : [];
  const tracks = [];
  const seen = new Set();
  resources.forEach(item => {
    const entity = item?.entity || {};
    const track = entity.track || entity.track_wrapper?.track || item?.track || {};
    const title = String(track.name || '').trim();
    if (!title) return;
    const key = String(track.id || `${title}::${tracks.length}`);
    if (seen.has(key)) return;
    seen.add(key);
    const artists = Array.isArray(track.artists)
      ? track.artists.map(person => String(person?.name || '').trim()).filter(Boolean).join('、')
      : '';
    tracks.push({
      id: `qs_${playlistId}_${key}`,
      title,
      artist: artists || '未知歌手',
      album: String(track.album?.name || ''),
      url: '',
      pic: '',
      lrc: '',
      via: 'qishui',
    });
  });
  return tracks;
}

function qishuiCover(playlist) {
  const cover = playlist?.url_cover;
  if (!cover) return '';
  const base = Array.isArray(cover.urls) ? cover.urls[0] : '';
  if (!base || !cover.uri) return '';
  return `${base}${cover.uri}~c5_500x500.jpg`;
}

async function importQishui(ctx, link) {
  const remoteId = await resolveQishuiId(link);
  const api = `https://api.qishui.com/luna/pc/playlist/detail?playlist_id=${encodeURIComponent(remoteId)}&cursor=0&cnt=20&aid=386088&device_platform=web&channel=pc_web`;
  let data = null;
  let tracks = [];
  try {
    const text = await readPage(api);
    const body = text.slice(text.indexOf('{'));
    data = JSON.parse(body);
    tracks = qishuiApiTracks(data, remoteId);
  } catch {
    tracks = [];
  }
  if (!tracks.length) {
    const page = await readPage(link);
    tracks = qishuiPageTracks(page);
    if (!tracks.length) throw new Error('没读到汽水歌单里的歌，试试公开歌单的完整分享链接');
    savePlaylist(ctx, {
      source: 'qishui',
      remoteId,
      name: pageTitle(page) || `汽水歌单 ${remoteId}`,
      cover: '',
      link,
      tracks,
    });
    return;
  }
  const name = String(data?.playlist?.title || '').trim() || `汽水歌单 ${remoteId}`;
  savePlaylist(ctx, {
    source: 'qishui',
    remoteId,
    name,
    cover: qishuiCover(data.playlist),
    link,
    tracks,
  });
}

function savePlaylist(ctx, incoming) {
  const music = musicOf(ctx.state);
  const old = music.playlists.find(item => item.source === incoming.source && item.remoteId === incoming.remoteId);
  let playlist;
  if (old) {
    playlist = old;
    playlist.name = incoming.name;
    playlist.cover = incoming.cover || old.cover;
    playlist.tracks = incoming.tracks;
    playlist.link = incoming.link;
    playlist.importedAt = Date.now();
  } else {
    playlist = {
      id: newId('pl'),
      ...incoming,
      importedAt: Date.now(),
    };
    music.playlists.unshift(playlist);
  }
  music.activeId = playlist.id;
  ctx.save();
  ctx.toast(old ? `已更新「${playlist.name}」` : `已导入「${playlist.name}」`);
  ctx.go('music-playlist', { playlistId: playlist.id });
}

async function importByText(ctx, raw) {
  const text = String(raw || '').trim();
  if (!text) return;
  try {
    const link = (text.match(/https?:\/\/[^\s]+/) || [text])[0];
    if (/music\.163\.com|163cn\.tv/.test(link) || /^\d{5,}$/.test(text)) {
      await importNetease(ctx, text);
      return;
    }
    if (/qishui\.douyin\.com|music\.douyin\.com/.test(link)) {
      await importQishui(ctx, link);
      return;
    }
    throw new Error('没认出链接，支持网易云歌单和汽水歌单分享链接');
  } catch (error) {
    ctx.toast(error?.message || '导入失败，稍后再试');
  }
}

/**
 * 试遍候选音源，直到真的开始出声。成功才把地址写回歌单，失败不留下坏链接。
 * gate 变了就说明用户已经切歌或停播，当前这轮直接作废。
 */
async function startTrack(ctx, playlist, track, gate, options = {}) {
  attemptDepth += 1;
  try {
    for await (const candidate of sourceCandidates(track, options.skip || [])) {
      if (gate !== loadToken) return false;
      const player = ensureAudio();
      player.__ctxToast = message => ctx.toast(message);
      const ok = await trySource(player, candidate.url);
      if (gate !== loadToken) return false;
      if (!ok) continue;
      track.url = candidate.url;
      track.playVia = candidate.via;
      track.dead = false;
      track.swapped = !candidate.cached;
      setCurrent(track, playlist);
      playing = !player.paused;
      freshSave(ctx, playlist.id, track.id);
      if (!candidate.cached) ctx.toast(`已自动换源：${sourceLabel(candidate.via)}`);
      paintPlayState();
      ctx.rerender();
      return true;
    }
    return false;
  } finally {
    attemptDepth -= 1;
  }
}

async function playAt(ctx, playlist, index, options = {}) {
  if (!playlist?.tracks?.length) return false;
  const track = playlist.tracks[index];
  if (!track) return false;
  lastCtx = ctx;
  const gate = ++loadToken;
  queue = playlist.tracks;
  queueIndex = index;
  queuePlaylistId = playlist.id;
  deadCandidates = [];
  /* 换歌先把上一首停下，免得找音源的时候旧歌还在响、进度条却挂在新歌上 */
  const player = ensureAudio();
  player.__ctxToast = message => ctx.toast(message);
  try { player.pause(); } catch { /* 忽略 */ }
  try { player.removeAttribute('src'); player.load(); } catch { /* 忽略 */ }
  playing = false;
  setCurrent(track, playlist);
  ctx.toast(track.url ? '正在打开音源…' : '正在找可播音源…');
  const ok = await startTrack(ctx, playlist, track, gate, options);
  if (gate !== loadToken) return false;
  if (!ok) {
    track.url = '';
    track.playVia = '';
    track.dead = true;
    track.swapped = false;
    playing = false;
    paintPlayState();
    ctx.toast('这首暂时没找到能播的音源，可以再点一次重试');
    ctx.rerender();
    return false;
  }
  return true;
}

/** 放到一半音源断了：换一条能播的接着放，实在没有才提示失败 */
async function recoverCurrent() {
  const ctx = lastCtx;
  if (recovering) return;
  if (!ctx || !current) return;
  const playlist = ctx.state.music?.playlists?.find(item => item.id === current.playlistId);
  if (!playlist) return;
  const index = playlist.tracks.findIndex(item => item.id === current.trackId);
  if (index < 0) return;
  const track = playlist.tracks[index];
  recovering = true;
  const gate = ++loadToken;
  const skip = deadCandidates.slice();
  if (current.url) skip.push(current.url);
  deadCandidates = skip.filter(Boolean);
  try {
    const ok = await startTrack(ctx, playlist, track, gate, { skip });
    if (gate !== loadToken) return;
    if (!ok) {
      track.url = '';
      track.playVia = '';
      track.dead = true;
      track.swapped = false;
      playing = false;
      paintPlayState();
      ctx.toast('自动换源没成功，可以再点一次播放');
      ctx.rerender();
    }
  } finally {
    recovering = false;
  }
}

function freshSave(ctx, playlistId, trackId) {
  const music = musicOf(ctx.state);
  music.current = { playlistId, trackId };
  ctx.save();
}

async function playNextByQueue() {
  if (!queue.length || !lastCtx) return;
  queueIndex += 1;
  if (queueIndex >= queue.length) {
    playing = false;
    paintPlayState();
    return;
  }
  const playlist = lastCtx.state.music?.playlists?.find(item => item.id === queuePlaylistId);
  if (!playlist) {
    playing = false;
    paintPlayState();
    return;
  }
  playAt(lastCtx, playlist, queueIndex);
}

function togglePlay(ctx) {
  if (!current) return;
  const playlist = ctx.state.music?.playlists?.find(item => item.id === current.playlistId);
  const player = ensureAudio();
  player.__ctxToast = message => ctx.toast(message);
  const track = playlist ? playlist.tracks.find(item => item.id === current.trackId) : null;
  if (!track?.url || !player.src) {
    if (playlist) {
      const index = playlist.tracks.findIndex(item => item.id === current.trackId);
      playAt(ctx, playlist, Math.max(0, index));
    }
    return;
  }
  if (player.paused) {
    player.play().then(() => { playing = true; paintPlayState(); }).catch(() => ctx.toast('播放失败，稍后再点一次'));
  } else {
    player.pause();
  }
}

function nextTrack(ctx) {
  const playlist = ctx.state.music?.playlists?.find(item => item.id === current?.playlistId);
  if (!playlist) return;
  const index = playlist.tracks.findIndex(item => item.id === current?.trackId);
  const next = index + 1;
  if (!playlist.tracks[next]) { ctx.toast('已经是最后一首了'); return; }
  queue = playlist.tracks;
  queuePlaylistId = playlist.id;
  playAt(ctx, playlist, next);
}

function coverHtml(playlist, className = '') {
  if (playlist?.cover) {
    return `<div class="mp-music-cover ${className}"><img src="${esc(secureUrl(playlist.cover))}" alt=""></div>`;
  }
  return `<div class="mp-music-cover is-empty ${className}" style="background:${coverTint(playlist?.name)}">${icon('music')}</div>`;
}

function coverTint(name) {
  const tints = [
    'linear-gradient(150deg,#e8d7fa,#bda1ee)',
    'linear-gradient(150deg,#d9e5fb,#9dbcef)',
    'linear-gradient(150deg,#f8dceb,#e4a8cf)',
    'linear-gradient(150deg,#d5eee6,#91d2c0)',
    'linear-gradient(150deg,#f5e3d2,#dfb98e)',
  ];
  const text = String(name || 'music');
  let code = 0;
  for (let index = 0; index < text.length; index += 1) code = (code + text.charCodeAt(index) * (index + 3)) % 997;
  return tints[code % tints.length];
}

function trackLine(ctx, track, playlist, index) {
  const active = current && current.playlistId === playlist.id && current.trackId === track.id;
  return `
    <button class="mp-music-track${active ? ' is-on' : ''}" data-act="music-track" data-id="${playlist.id}" data-index="${index}" type="button">
      <span class="mp-music-index">${active ? icon('play') : String(index + 1).padStart(2, '0')}</span>
      <span class="mp-music-track-main">
        <b>${esc(track.title)}</b>
        <span>${esc(track.artist || '未知歌手')}${track.album ? ` · ${esc(track.album)}` : ''}</span>
      </span>
      <span class="mp-music-track-side">${esc(trackSourceTag(track))}</span>
    </button>`;
}

function playerHtml(ctx, state) {
  const track = trackFromState(state);
  if (!track) return '';
  const cover = track.pic || '';
  return `
    <div class="mp-music-player">
      ${cover ? `<div class="mp-music-cover is-small"><img src="${esc(secureUrl(cover))}" alt=""></div>` : `<div class="mp-music-cover is-small is-empty">${icon('music')}</div>`}
      <div class="mp-music-player-main">
        <div class="mp-music-now">
          <b>${esc(track.title)}</b>
          <span>${esc(track.artist || '未知歌手')}</span>
        </div>
        <div class="mp-music-progress"><i id="mpMusicBar"></i></div>
        <div class="mp-music-time" id="mpMusicTime">0:00 / --:--</div>
      </div>
      <button class="mp-music-play" data-act="music-toggle" type="button" aria-label="播放或暂停">
        <span data-music-icon>${icon(playing ? 'pause' : 'play')}</span>
      </button>
      <button class="mp-music-next" data-act="music-next" type="button" aria-label="下一首">${icon('next')}</button>
    </div>`;
}

function playAllButton(playlist) {
  return `<button class="mp-btn accent mp-music-all" data-act="music-playlist-play" data-id="${playlist.id}" type="button">${icon('play')}<span>播放全部</span></button>`;
}

const musicApp = {
  id: 'music', name: '音乐', icon: 'music',

  render(ctx) {
    const music = musicOf(ctx.state);
    const playlists = music.playlists;
    const cards = playlists.map(playlist => {
      const active = current?.playlistId === playlist.id;
      return `
        <button class="mp-music-card${active ? ' is-on' : ''}" data-act="music-open" data-id="${playlist.id}" type="button">
          ${coverHtml(playlist, 'is-list')}
          <div class="mp-music-card-main">
            <div class="mp-music-card-name">${esc(playlist.name)}</div>
            <div class="mp-music-card-sub">${playlist.tracks.length} 首 · ${playlist.source === 'qishui' ? '汽水' : '网易云'}</div>
            <div class="mp-music-card-bar"><i style="width:${active && playing ? '60%' : '0%'}"></i></div>
          </div>
          <span class="mp-music-card-play">${icon(active && playing ? 'pause' : 'play')}</span>
        </button>`;
    }).join('');

    return `
      <div class="mp-page-body mp-music">
        <div class="mp-music-hero">
          <div>
            <div class="mp-subtitle" style="margin-top:2px">音乐 · 把喜欢的歌单放进口袋</div>
          </div>
          <button class="mp-icon-btn" data-act="music-import" type="button" aria-label="导入歌单">${icon('plus')}</button>

  /** 把酒馆用户拉进小手机；带 dirty 的本地改动不被覆盖。 */
  const syncUsers = async () => {
    const result = await readTavernPersonas();
    if (!result.available) {
      state.usersFromTavern = false;
      return result;
    }
    const previous = new Map((state.users || []).map(user => [user.key, user]));
    state.users = result.list.map(item => {
      const local = previous.get(item.key);
      return local?.dirty
        ? { ...item, name: local.name, description: local.description, lorebook: local.lorebook ?? item.lorebook, dirty: true }
        : item;
    });
    state.usersFromTavern = true;

    /* 换人时头像必须跟着换：新这位没头像就清掉，别留着上一个人的图 */
    const useUser = (user, fallback = {}) => {
      const key = String(user?.key || fallback.key || '');
      state.settings.user.key = key;
      state.settings.user.name = String(user?.name || fallback.name || '我');
      state.settings.user.avatar = String(user?.avatarUrl || fallback.avatar || '');
    };

    if (state.settings.userMode === 'pin') {
      const pinned = state.users.find(user => user.key === state.settings.pinnedUser);
      if (pinned) useUser(pinned);
      else if (state.users[0]) {
        state.settings.pinnedUser = state.users[0].key;
        useUser(state.users[0]);
      }
    } else {
      useUser(
        state.users.find(user => user.key === result.current) || null,
        { key: result.current, name: result.currentName, avatar: result.currentAvatar },
      );
    }
    return result;
  };

  const ai = makeAi(state);
  const host = {
    probe: probeHost,
    readCharacters: readTavernCharacters,
    readCards: readTavernCards,
    readBooks: readCharacterBooks,
    readWorldBooks: readWorldBookNames,
    toggleBookEntry: setWorldEntryEnabled,
    readUserAvatar,
    syncUsers,
    writeUser: writeTavernPersona,
    readApi: readTavernApi,
    listModels: listTavernModels,
  };

  rootEl = document.createElement('div');
  rootEl.id = 'meme-phone';
  document.body.append(rootEl);

  ctx = {
    state,
    store,
    ai,
    host,
    save: () => {
      return store.touch().then(() => true).catch(error => {
        ctx.toast?.(error.message || '保存失败，先去设置里导出备份');
        return false;
      });
    },
    reset: () => {
      const next = emptyState();
      store.replace(next);
      ctx.state = next;
      ctx.rerender?.();
    },
    onDraft: (entry, value) => {
      if (entry.view !== 'thread') return;
      const chat = state.chats[entry.params?.chatId];
      if (chat) chat.draft = value;
    },
    onClose: () => closeMemePhone(),
  };

  shellApi = createShell({ root: rootEl, ctx, apps: APPS, desktopApps: DESKTOP_APPS, dockApps: DOCK_APPS });

  /* 主题与壁纸 */
  applyTheme(state, rootEl);

  /* 自定义壁纸：选图后压到 1440×1920 内再存，避免把 localStorage 撑爆 */
  async function useCustomWall(file) {
    const looksImage = (file?.type && file.type.startsWith('image/')) || /\.(jpg|jpeg|png|webp|gif|bmp)$/i.test(file?.name || '');
    if (!looksImage) { ctx.toast('请选一张图片'); return; }
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      const url = URL.createObjectURL(file);
      image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
      image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读不出来')); };
      image.src = url;
    });
    const maxW = 1440;
    const maxH = 1920;
    const scale = Math.min(1, maxW / img.width, maxH / img.height);
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.width * scale));
    canvas.height = Math.max(1, Math.round(img.height * scale));
    const painter = canvas.getContext('2d');
    if (!painter) throw new Error('画布不可用');
    painter.drawImage(img, 0, 0, canvas.width, canvas.height);

    /* 按图片明暗自动挑日间/夜间，免得深色壁纸配浅色字看不清 */
    const probe = document.createElement('canvas');
    probe.width = 32;
    probe.height = 32;
    const probeCtx = probe.getContext('2d');
    probeCtx?.drawImage(img, 0, 0, 32, 32);
    let luma = 0;
    const pixels = probeCtx?.getImageData(0, 0, 32, 32).data;
    if (pixels) {
      for (let index = 0; index < pixels.length; index += 4) {
        luma += 0.2126 * pixels[index] + 0.7152 * pixels[index + 1] + 0.0722 * pixels[index + 2];
      }
      luma = luma / (pixels.length / 4) / 255;
      state.settings.theme = luma < 0.45 ? 'night' : 'day';
    }

    state.settings.customWall = canvas.toDataURL('image/jpeg', 0.82);
    state.settings.wallpaper = 'custom';
    if (state.settings.dress) state.settings.dress.theme = 'default';
    ctx.save();
    ctx.rerender();
    ctx.toast('自定义壁纸已换上');
  }

  /* 自定义 App 图标：裁成正方形、缩到 192px，避免把存档撑大 */
  async function useCustomIcon(file, appId) {
    const looksImage = (file?.type && file.type.startsWith('image/')) || /\.(jpg|jpeg|png|webp|gif|bmp)$/i.test(file?.name || '');
    if (!looksImage) { ctx.toast('请选一张图片'); return; }
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      const url = URL.createObjectURL(file);
      image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
      image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读不出来')); };
      image.src = url;
    });
    const side = Math.min(img.width, img.height);
    const sx = Math.max(0, (img.width - side) / 2);
    const sy = Math.max(0, (img.height - side) / 2);
    const canvas = document.createElement('canvas');
    canvas.width = 192;
    canvas.height = 192;
    const painter = canvas.getContext('2d');
    if (!painter) throw new Error('画布不可用');
    painter.clearRect(0, 0, 192, 192);
    painter.drawImage(img, sx, sy, side, side, 0, 0, 192, 192);
    if (!state.settings.dress || typeof state.settings.dress !== 'object') state.settings.dress = {};
    const dress = state.settings.dress;
    if (!dress.icons || typeof dress.icons !== 'object') dress.icons = {};
    const current = dress.icons[appId] && typeof dress.icons[appId] === 'object' ? dress.icons[appId] : {};
    dress.icons[appId] = { ...current, image: canvas.toDataURL('image/webp', 0.86) };
    ctx.save();
    ctx.rerender();
    ctx.toast('图标已换上');
  }

  /* 主界面顶栏背景图：裁成横幅比例、缩到 720px 宽，别把存档撑大 */
  async function useCustomBanner(file) {
    const looksImage = (file?.type && file.type.startsWith('image/')) || /\.(jpg|jpeg|png|webp|gif|bmp)$/i.test(file?.name || '');
    if (!looksImage) { ctx.toast('请选一张图片'); return; }
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      const url = URL.createObjectURL(file);
      image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
      image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读不出来')); };
      image.src = url;
    });
    const canvas = document.createElement('canvas');
    canvas.width = 720;
    canvas.height = 160;
    const painter = canvas.getContext('2d');
    if (!painter) throw new Error('画布不可用');
    const ratio = canvas.width / canvas.height;
    const cropW = Math.min(img.width, img.height * ratio);
    const cropH = cropW / ratio;
    const sx = Math.max(0, (img.width - cropW) / 2);
    const sy = Math.max(0, (img.height - cropH) / 2);
    painter.drawImage(img, sx, sy, cropW, cropH, 0, 0, canvas.width, canvas.height);
    const settings = state.settings;
    if (!settings.profile || typeof settings.profile !== 'object') settings.profile = { bio: '', banner: '' };
    settings.profile.banner = canvas.toDataURL('image/jpeg', 0.82);
    ctx.save();
    ctx.rerender();
    ctx.toast('顶栏背景图换好了');
  }

  /* 聊天照片：长边压到 1000px、JPEG 0.78，再存进会话 */
  async function useMessagePhoto(file, chatId) {
    if (!chatId) return;
    const looksImage = (file?.type && file.type.startsWith('image/')) || /\.(jpg|jpeg|png|webp|gif|bmp)$/i.test(file?.name || '');
    if (!looksImage) { ctx.toast('请选一张图片'); return; }
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      const url = URL.createObjectURL(file);
      image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
      image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读不出来')); };
      image.src = url;
    });
    const limit = 1000;
    const scale = Math.min(1, limit / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.width * scale));
    canvas.height = Math.max(1, Math.round(img.height * scale));
    const painter = canvas.getContext('2d');
    if (!painter) throw new Error('画布不可用');
    painter.drawImage(img, 0, 0, canvas.width, canvas.height);
    let dataUrl = canvas.toDataURL('image/jpeg', 0.78);
    if (dataUrl.length > 380000) dataUrl = canvas.toDataURL('image/jpeg', 0.6);
    pushMessage(state, chatId, { from: 'me', kind: 'image', text: '', image: dataUrl });
    ctx.save();
    ctx.rerender();
    setTimeout(() => {
      const box = rootEl.querySelector('.mp-messages');
      if (box) box.scrollTop = box.scrollHeight;
    }, 30);
    ctx.toast('照片发过去了');
  }

  rootEl.addEventListener('change', event => {
    const id = event.target?.id;
    const file = event.target?.files?.[0];
    if (id === 'mpWallFile') {
      event.target.value = '';
      if (file) useCustomWall(file).catch(error => ctx.toast(error.message || '换壁纸失败'));
      return;
    }
    if (id === 'mpMsgPhoto') {
      const chatId = event.target?.dataset?.chat || '';
      event.target.value = '';
      if (file) useMessagePhoto(file, chatId).catch(error => ctx.toast(error.message || '照片没发出去'));
      return;
    }
    if (id === 'mpProfileBanner') {
      event.target.value = '';
      if (file) useCustomBanner(file).catch(error => ctx.toast(error.message || '换背景图失败'));
      return;
    }
    if (id === 'mpIconFile') {
      const appId = event.target?.dataset?.app;
      event.target.value = '';
      if (file && appId) useCustomIcon(file, appId).catch(error => ctx.toast(error.message || '换图标失败'));
    }
  });
  /* 顶栏背景图 / 聊天照片的 input 藏在页面里，个别 WebView 不冒泡 change，补一道捕获监听 */
  const docRef = rootEl.ownerDocument;
  docRef?.addEventListener('change', event => {
    const id = event.target?.id;
    if (id !== 'mpProfileBanner' && id !== 'mpMsgPhoto') return;
    const file = event.target.files?.[0];
    const chatId = event.target?.dataset?.chat || '';
    event.target.value = '';
    if (!file) return;
    if (id === 'mpProfileBanner') useCustomBanner(file).catch(error => ctx.toast(error.message || '换背景图失败'));
    if (id === 'mpMsgPhoto') useMessagePhoto(file, chatId).catch(error => ctx.toast(error.message || '照片没发出去'));
  }, true);

  /* 用户头像（酒馆里有 persona 头像） */
  try {
    const avatar = await readUserAvatar();
    if (avatar) state.settings.user.avatar = avatar;
  } catch { /* 没头像就不显示 */ }

  /* 宿主能力探针，设置页会读 */
  shellApi.shell.hostInfo = await probeHost().catch(() => ({}));

  /* 酒馆用户名单：跟随就取当前那位，固定就取钉住的那位 */
  try {
    const personas = await syncUsers();
    if (personas.available) {
      store.touch();
      shellApi.render();
    }
  } catch { /* 拉不到名单就保持原样 */ }

  /* 跟随模式：酒馆那边换用户，这边跟着换 */
  clearInterval(followTimer);
  followTimer = setInterval(async () => {
    if (!rootEl || state.settings.userMode === 'pin') return;
    try {
      const result = await readTavernPersonas();
      if (!result.available) return;
      const key = String(result.current || '');
      if (!key || key === state.settings.user.key) return;
      /* 这位可能在名单里被筛掉（没设显示名），名字退回酒馆里的 name1，头像按文件名取 */
      const current = result.list.find(user => user.key === key) || null;
      state.users = result.list;
      state.usersFromTavern = true;
      state.settings.user.key = key;
      state.settings.user.name = String(current?.name || result.currentName || '我');
      state.settings.user.avatar = String(current?.avatarUrl || result.currentAvatar || '');
      store.touch();
      shellApi?.render();
    } catch { /* 换不过来就算了，等下次打开 */ }
  }, 4000);

  /* 点空白关闭 */
  rootEl.addEventListener('click', event => {
    if (event.target.classList.contains('mp-overlay') || event.target.classList.contains('mp-scrim')) {
      closeMemePhone();
    }
  });

  return rootEl;
}

function closeMemePhone() {
  if (!rootEl) return;
  stopMusic();
  clearInterval(followTimer);
  followTimer = 0;
  shellApi?.destroy();
  rootEl.remove();
  rootEl = null;
  shellApi = null;
}

function applyTheme(state, root = rootEl) {
  if (!root) return;
  const theme = state.settings.theme === 'night' ? 'night' : 'day';
  root.dataset.mpTheme = theme;
  /* 背景：none 透明 / day 晨光 / night 夜色 / custom 自定义图 */
  applyWall(root, state.settings);
  applyLook(root, state.settings);
}



/** 预览页 / 调试用：直接跳到某个页面。 */
function goView(view, params = {}) {
  if (!ctx?.shell) return;
  let payload = params;
  if (view === 'thread' && !params.chatId) {
    const first = Object.values(ctx.state.chats)[0];
    if (!first) return;
    payload = { chatId: first.id };
  }
  if (view === 'app-extras' && !params.contactId) {
    const withExtras = Object.keys(ctx.state.extras).find(key => (ctx.state.extras[key] || []).length);
    if (withExtras) payload = { contactId: withExtras };
  }
  if (view === 'user-item' && !params.key) {
    const first = (ctx.state.users || [])[0];
    if (first?.key) payload = { key: first.key };
  }
  if (view === 'character-card' && !params.name) {
    const first = (ctx.state.characters || [])[0];
    if (first?.name) payload = { name: first.name };
  }
  if (view === 'p-charphone' && !payload.contactId) {
    const first = Object.values(ctx.state.contacts || {}).find(item => item.kind !== 'group');
    if (first) payload = { contactId: first.id };
  }
  if (view === 'p-charphone' && params.tab) ctx.shell.cpTab = params.tab;
  if (view === 'p-chatphone' && (!payload.contactId || !payload.peer)) {
    const first = Object.values(ctx.state.contacts || {}).find(item => item.kind !== 'group');
    const lookup = first ? ensureLookup(ctx.state, first) : null;
    const peer = lookup?.chats?.[0]?.id;
    if (first && peer) payload = { contactId: first.id, peer };
  }
  ctx.go(view, payload);
}

/** 导入一份备份（设置面板用）：只替换 meme-phone 自己的数据。 */
async function importState(raw) {
  await initMemePhone();
  const next = normalize(raw);
  store.replace(next);
  if (ctx) ctx.state = next;
  await store.flush();
  shellApi?.render();
  return next;
}

exports["isOpen"] = isOpen;
exports["initMemePhone"] = initMemePhone;
exports["getState"] = getState;
exports["openMemePhone"] = openMemePhone;
exports["closeMemePhone"] = closeMemePhone;
exports["applyTheme"] = applyTheme;
exports["goView"] = goView;
exports["importState"] = importState;
