/**
 * 生成一段文字。
 * 传了具体接口预设时先走那套地址 / Key / 模型；没传、是酒馆 API，或那套没填地址时走宿主。
 * 真机上走宿主 generateQuietPrompt；预览环境返回演示文案并标记 demo=true。
 */
/**
 * 酒馆的 generateQuietPrompt 只吃一段文本，这里统一把消息列表摊平。
 * 预览页也调这个函数，保证预览里「酒馆扁平文本」和真机发出的完全一致。
 */
function tavernQuietPrompt(messages, system = '', prompt = '') {
  const messageText = Array.isArray(messages) && messages.length
    ? messages.map(message => {
      const role = message?.role === 'assistant' ? '[角色示例]' : '';
      return [role, String(message?.content || '')].filter(Boolean).join('\n');
    }).filter(Boolean).join('\n\n')
    : '';
  return [
    system ? `【回复要求】\n${String(system)}` : '',
    messageText || String(prompt || ''),
  ].filter(Boolean).join('\n\n');
}

async function generate({ prompt, system = '', messages = null, demoReply = '', preset = null }) {
  const script = await loadHostScript();
  if (script && preset && preset.engine !== 'tavern' && String(preset.url || '').trim()) {
    try {
      const text = await presetCompletion(preset, { prompt, system, messages });
      if (text) return { text, demo: false };
    } catch { /* 这套接口没接通就退回酒馆自己的模型，别让聊天卡死 */ }
  }
  if (script && typeof script.generateQuietPrompt === 'function') {
    const quiet = tavernQuietPrompt(messages, system, prompt);
    const text = await script.generateQuietPrompt({ quietPrompt: quiet, quietName: '' });
    if (typeof text === 'string' && text.trim()) return { text: text.trim(), demo: false };
    return { text: '', demo: false, error: '模型没有返回内容' };
  }
  return { text: demoReply, demo: true };
}

/** 借酒馆后端请求一套自定义 OpenAI 兼容接口，避开浏览器 CORS。 */
async function presetCompletion(preset, { prompt, system, messages }) {
  const script = await loadHostScript();
  if (!script) return '';
  const base = String(preset.url || '').trim().replace(/\/+$/, '');
  const path = String(preset.path || '').trim() || '/v1/chat/completions';
  const joined = path.startsWith('/v1') && /\/v1$/i.test(base)
    ? `${base}${path.replace(/^\/v1/, '')}`
    : (/\/chat\/completions$/i.test(base) ? base : `${base}${path.startsWith('/') ? path : `/${path}`}`);
  const url = /^https?:/i.test(path) ? path : joined;
  const ctx = globalThis.SillyTavern?.getContext?.() || script.getContext?.() || {};
  const getHeaders = ctx.getRequestHeaders || script.getRequestHeaders;
  const headers = typeof getHeaders === 'function' ? { ...getHeaders() } : {};
  if (!headers['X-CSRF-Token']) {
    const token = ctx.csrf_token || globalThis.csrf_token || '';
    if (token) headers['X-CSRF-Token'] = token;
  }
  headers['Content-Type'] = 'application/json';

  const outgoing = Array.isArray(messages) && messages.length
    ? messages
      .filter(message => message && String(message.content || '').trim())
      .slice(-40)
      .map(message => ({
        role: ['system', 'user', 'assistant'].includes(message.role) ? message.role : 'system',
        content: String(message.content).trim(),
      }))
    : [];
  if (!outgoing.length) {
    if (system) outgoing.push({ role: 'system', content: String(system) });
    outgoing.push({ role: 'user', content: String(prompt || '') });
  }
  const body = {
    chat_completion_source: 'custom',
    custom_url: url,
    custom_include_headers: '',
    reverse_proxy: base,
    proxy_password: String(preset.key || ''),
    model: String(preset.model || ''),
    messages: outgoing,
    temperature: typeof preset.temp === 'number' ? preset.temp : 0.8,
    stream: false,
  };
  const response = await fetch('/api/backends/chat-completions/generate', {
    method: 'POST',
    headers,
    body: JSON.stringify(body),
    credentials: 'same-origin',
    cache: 'no-store',
  });
  if (!response.ok) throw new Error(`接口返回 ${response.status}`);
  const data = await response.json().catch(() => null);
  if (!data || data.error) throw new Error(data?.message || '接口没有返回内容');
  const content = data?.choices?.[0]?.message?.content ?? data?.choices?.[0]?.text ?? data?.content ?? data?.text;
  if (Array.isArray(content)) return content.map(part => (typeof part === 'string' ? part : part?.text || '')).join('').trim();
  return typeof content === 'string' ? content.trim() : '';
}


const NAI_MAX_ATTEMPTS = 4;
const NAI_MAX_WAIT_MS = 60_000;

/**
 * NovelAI 出图。
 * 请求包裹结构与官方前端 / 参考扩展一致：{ input, model, action, parameters }；
 * 返回是 msgpack zip，需要解出第一张图，不能按普通 JSON images 接口解析。
 */
async function novelaiImage({
  engine = 'novelai',
  url, key, model, width, height, steps = 28, scale = 5,
  sampler = 'k_euler_ancestral', noise = 'karras', seed, prompt = '', negative = '',
}) {
  const base = String(url || 'https://image.novelai.net').trim().replace(/\/+$/, '');
  const token = String(key || '').trim();

  if (engine === 'custom') {
    if (!base) throw new Error('先填自定义接口的地址');
    return customImage({ base, token, model, width, height, seed, prompt });
  }

  if (engine === 'doubao') {
    if (!base) throw new Error('先填火山方舟的地址');
    if (!token) throw new Error('先填火山方舟的 ARK API Key');
    return doubaoImage({ base, token, model, width, height, seed, prompt });
  }

  if (!token) throw new Error('先填 NovelAI 的 Key');

  const payload = buildNaiPayload({ model, width, height, steps, scale, sampler, noise, seed, prompt, negative });

  let result;
  for (let attempt = 1; ; attempt += 1) {
    try {
      let res;
      try {
        res = await fetch(naiEndpoint(base, 'generate-image'), {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      } catch (error) {
        const wrapped = new Error(`连不上 ${base}：${error.message}`);
        wrapped.network = true;
        throw wrapped;
      }
      if (!res.ok) throw await naiHttpError(res);

      const { base64, filename } = await unzipNaiImage(await res.arrayBuffer());
      const format = (filename.split('.').pop() || 'png').toLowerCase();
      result = { url: `data:image/${format === 'jpg' ? 'jpeg' : format};base64,${base64}` };
      break;
    } catch (error) {
      if (!naiShouldRetry(error, attempt)) throw error;
      const retryAfterMs = typeof error?.retryAfterMs === 'number' ? error.retryAfterMs : null;
      const waitMs = Math.min(Math.max(
        Math.round(2000 * 2 ** (attempt - 1) * (0.5 + 0.5 * Math.random())),
        retryAfterMs ?? 0,
      ), NAI_MAX_WAIT_MS);
      console.warn(`[meme-phone] NAI 请求失败，${Math.round(waitMs / 1000)}s 后重试（第 ${attempt}/${NAI_MAX_ATTEMPTS - 1} 次）`, error);
      await naiDelay(waitMs);
    }
  }

  return result;
}

function naiEndpoint(base, path = 'generate-image') {
  const clean = String(base || '').trim().replace(/\/+$/, '');
  if (!clean) throw new Error('先填 NovelAI 接口地址');
  const seg = String(path || '').replace(/^\/+/, '');
  if (clean.endsWith(`/ai/${seg}`) || clean.endsWith(`/${seg}`)) return clean;
  return `${clean}/ai/${seg}`;
}

function parseRetryAfter(value) {
  const text = String(value || '').trim();
  if (!text) return null;
  if (/^\d+$/.test(text)) {
    const ms = Number(text) * 1000;
    return Number.isFinite(ms) ? Math.min(ms, NAI_MAX_WAIT_MS) : null;
  }
  const at = Date.parse(text);
  return Number.isNaN(at) ? null : Math.min(Math.max(0, at - Date.now()), NAI_MAX_WAIT_MS);
}

function naiShouldRetry(error, attempt) {
  if (attempt >= NAI_MAX_ATTEMPTS) return false;
  const status = typeof error?.status === 'number' ? error.status : undefined;
  if (status !== undefined) {
    return status === 408 || status === 429 || (status >= 500 && status !== 501);
  }
  return Boolean(error?.network);
}

function naiDelay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function isNai3Model(model) {
  return String(model || '').includes('diffusion-3');
}

/* NAI 5 只认这几种采样器，别的会被官方判参数错；选错了退回默认那个 */
const NAI_V5_SAMPLERS = new Set([
  'k_euler_ancestral', 'k_euler', 'k_dpmpp_2s_ancestral', 'k_dpmpp_2m_sde', 'k_dpmpp_2m', 'k_dpmpp_sde',
]);

function buildNaiPayload({ model, width, height, steps, scale, sampler, noise, seed, prompt, negative }) {
  const n3 = isNai3Model(model);
  const isV5 = /nai-diffusion-5/.test(String(model || ''));
  const safeSampler = isV5 && !NAI_V5_SAMPLERS.has(sampler) ? 'k_euler_ancestral' : sampler;
  const paramsVersion = isV5 ? 4 : 3;
  const params = {
    params_version: paramsVersion,
    width,
    height,
    scale,
    sampler: safeSampler,
    steps,
    n_samples: 1,
    ucPreset: 3,
    qualityToggle: true,
    dynamic_thresholding: false,
    controlnet_strength: 1,
    legacy: false,
    legacy_uc: false,
    add_original_image: true,
    cfg_rescale: 0,
    noise_schedule: noise,
    skip_cfg_above_sigma: null,
    legacy_v3_extend: false,
    stream: 'msgpack',
    seed: Number(seed) > 0 ? Number(seed) : Math.floor(Math.random() * 2 ** 32),
    negative_prompt: negative || '',
    reference_strength_multiple: [],
    normalize_reference_strength_multiple: true,
    use_coords: false,
  };

  if (n3) {
    params.sm = false;
    params.sm_dyn = false;
    params.reference_image_multiple = [];
    params.reference_information_extracted_multiple = [];
  } else {
    params.reference_image_multiple_cached = [];
    params.characterPrompts = [];
    params.v4_prompt = {
      caption: { base_caption: prompt, char_captions: [] },
      use_coords: false,
      use_order: true,
    };
    params.v4_negative_prompt = {
      caption: {
        base_caption: negative || '',
        char_captions: [],
      },
      legacy_uc: false,
    };
  }

  if (safeSampler === 'k_euler_ancestral') {
    params.deliberate_euler_ancestral_bug = false;
    params.prefer_brownian = true;
  }

  const body = {
    input: prompt,
    action: 'generate',
    parameters: params,
    use_new_shared_trial: true,
  };
  if (model) body.model = model;
  return body;
}

async function naiHttpError(resp) {
  const text = (await resp.text().catch(() => '')).trim();
  let detail = text;
  try {
    const json = JSON.parse(text);
    if (typeof json?.message === 'string') detail = json.message;
  } catch {
    /* 非 JSON 错误体直接用原文 */
  }
  const retryAfterMs = parseRetryAfter(resp.headers?.get('Retry-After'));
  let message;
  switch (resp.status) {
    case 400:
      message = `NovelAI 请求校验失败：${detail.slice(0, 300) || '参数不对'}`;
      break;
    case 401:
      message = 'NovelAI API Key 错误或无效';
      break;
    case 402:
      message = 'NovelAI 需要有效订阅';
      break;
    case 429:
      message = 'NovelAI 请求过于频繁，稍后再试';
      break;
    default:
      message = `NovelAI 返回 ${resp.status}${detail ? `：${detail.slice(0, 300)}` : ''}`;
  }
  const error = new Error(message);
  error.status = resp.status;
  error.retryAfterMs = retryAfterMs;
  return error;
}

function bytesToBase64(bytes) {
  let bin = '';
  const CHUNK = 0x8000;
  for (let offset = 0; offset < bytes.length; offset += CHUNK) {
    bin += String.fromCharCode(...bytes.subarray(offset, offset + CHUNK));
  }
  return btoa(bin);
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('当前环境不支持解压 NovelAI 返回的 zip 包');
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function readZipEntries(buffer) {
  const bytes = new Uint8Array(buffer);
  const entries = {};
  let centralOffset = -1;
  let centralCount = 0;

  for (let i = Math.max(0, bytes.length - 22); i >= 0; i -= 1) {
    if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) {
      const eocd = new DataView(bytes.buffer, bytes.byteOffset + i);
      centralCount = eocd.getUint16(10, true);
      centralOffset = eocd.getUint32(16, true);
      break;
    }
  }

  if (centralOffset >= 0) {
    let cursor = centralOffset;
    for (let index = 0; index < centralCount; index += 1) {
      if (bytes[cursor] !== 0x50 || bytes[cursor + 1] !== 0x4b || bytes[cursor + 2] !== 0x02 || bytes[cursor + 3] !== 0x03) break;
      const central = new DataView(bytes.buffer, bytes.byteOffset + cursor);
      const method = central.getUint16(10, true);
      const compressedSize = central.getUint32(20, true);
      const nameLength = central.getUint16(28, true);
      const extraLength = central.getUint16(30, true);
      const commentLength = central.getUint16(32, true);
      const localOffset = central.getUint32(42, true);
      const name = new TextDecoder().decode(bytes.subarray(cursor + 46, cursor + 46 + nameLength));

      const local = new DataView(bytes.buffer, bytes.byteOffset + localOffset);
      const localNameLength = local.getUint16(26, true);
      const localExtraLength = local.getUint16(28, true);
      const localCompressedSize = local.getUint32(18, true);
      const dataStart = localOffset + 30 + localNameLength + localExtraLength;
      const size = compressedSize || localCompressedSize;
      const raw = bytes.subarray(dataStart, dataStart + size);
      entries[name] = method === 8 ? await inflateRaw(raw) : raw;
      cursor += 46 + nameLength + extraLength + commentLength;
    }
  }

  if (!Object.keys(entries).length) {
    let offset = 0;
    while (offset + 30 <= bytes.length) {
      if (bytes[offset] !== 0x50 || bytes[offset + 1] !== 0x4b || bytes[offset + 2] !== 0x03 || bytes[offset + 3] !== 0x04) break;
      const local = new DataView(bytes.buffer, bytes.byteOffset + offset);
      const method = local.getUint16(8, true);
      const compressedSize = local.getUint32(18, true);
      const nameLength = local.getUint16(26, true);
      const extraLength = local.getUint16(28, true);
      const name = new TextDecoder().decode(bytes.subarray(offset + 30, offset + 30 + nameLength));
      const dataStart = offset + 30 + nameLength + extraLength;
      const raw = bytes.subarray(dataStart, dataStart + compressedSize);
      entries[name] = method === 8 ? await inflateRaw(raw) : raw;
      offset = dataStart + compressedSize;
    }
  }

  return entries;
}

async function unzipNaiImage(buffer) {
  let entries;
  try {
    entries = await readZipEntries(buffer);
  } catch (error) {
    throw new Error(`NovelAI 返回不是有效的 zip 包：${error.message}`);
  }
  const names = Object.keys(entries);
  const name = names.find(item => /\.(png|jpe?g|webp)$/i.test(item)) || names[0];
  if (!name) throw new Error('NovelAI 返回的 zip 包里没有图片');
  return { base64: bytesToBase64(entries[name]), filename: name };
}

/**
 * 把绘图接口地址剥成根地址，用来拼探测路径。
 * 用户可能把整条生图地址粘进来（/ai/generate-image、/api/v3/images/generations），
 * 也可能只填站点（127.0.0.1:7860），这里都收成同一种口径。
 */
function imageApiRoot(engine, url, path = '') {
  let base = String(url || '').trim().replace(/\/+$/, '');
  if (!base) return '';
  if (engine === 'novelai') {
    base = base
      .replace(/\/ai\/generate-image-stream$/i, '')
      .replace(/\/ai\/generate-image$/i, '')
      .replace(/\/generate-image$/i, '');
    return base.replace(/\/+$/, '');
  }
  base = base.replace(/\/images\/generations$/i, '');
  if (/\/(api\/)?v\d+$/.test(base)) return base;
  const route = String(path || '').trim();
  const version = route.match(/\/v\d+/);
  if (version) base = `${base}${version[0]}`;
  else if (!/\/(api\/)?v\d+$/.test(base)) base = `${base}/v1`;
  return base.replace(/\/+$/, '');
}

/** 各家 /models 返回结构不一样，统一抓成模型名列表。 */
function modelNamesOf(payload) {
  const list = Array.isArray(payload?.data) ? payload.data
    : Array.isArray(payload?.models) ? payload.models
      : Array.isArray(payload) ? payload : [];
  const names = list.map(item => {
    if (typeof item === 'string') return item;
    return item?.id || item?.name || item?.model || '';
  }).map(item => String(item || '').trim()).filter(Boolean);
  return [...new Set(names)].sort();
}

function naiTierLabel(data) {
  if (!data || typeof data !== 'object') return '';
  if (data.active === false) return '没有生效的订阅';
  const tier = Number(data.tier);
  if (!Number.isFinite(tier) || tier <= 0) return data.active ? '订阅有效' : '';
  return ['', 'Tablet', 'Scroll', 'Opus', 'Opus 年付'][tier] || `档位 ${tier}`;
}

/**
 * 绘图接口的「测试连接 / 拉取模型」。
 * NovelAI 官方没有模型列表接口（/ai/models 一律 404），只能拿 /user/subscription 验 Key，
 * 所以这里回的是内置候选；豆包和自定义是 OpenAI 风格，可以直接 GET /models。
 */
async function probeImageApi({ engine = 'novelai', url = '', key = '', path = '' } = {}) {
  const base = imageApiRoot(engine, url, path);
  if (!base) throw new Error('先填接口地址');
  const token = String(key || '').trim();

  if (engine === 'novelai') {
    if (!token) throw new Error('先填 NovelAI Key');
    let res;
    try {
      res = await fetch(`${base}/user/subscription`, {
        method: 'GET',
        headers: { Authorization: `Bearer ${token}` },
        cache: 'no-store',
        credentials: 'omit',
      });
    } catch (error) {
      throw new Error(`连不上 ${base}：${error.message}`);
    }
    if (res.status === 401 || res.status === 403) throw new Error('NovelAI Key 不对，或没权限');
    if (res.status === 404) {
      return { ok: false, models: [], text: `${base} 没有订阅接口，Key 没验成；模型只能从内置候选里选或手动填` };
    }
    if (!res.ok) throw new Error(`NovelAI 返回 ${res.status}`);
    const data = await res.json().catch(() => null);
    const tier = naiTierLabel(data);
    return {
      ok: Boolean(tier) && tier !== '没有生效的订阅',
      models: [],
      text: `Key 有效${tier ? ` · ${tier}` : ''} · 官方不给模型列表，模型从内置候选里选`,
    };
  }

  const headers = {};
  if (token) headers.Authorization = `Bearer ${token}`;
  let res;
  try {
    res = await fetch(`${base}/models`, { method: 'GET', headers, cache: 'no-store', credentials: 'omit' });
  } catch (error) {
    throw new Error(`连不上 ${base}：${error.message}`);
  }
  if (res.status === 401 || res.status === 403) throw new Error('Key 不对，或没有拉模型的权限');
  if (res.status === 404 || res.status === 405) {
    return { ok: false, models: [], text: `${base} 没有模型列表接口，模型只能手动填` };
  }
  if (!res.ok) throw new Error(`接口返回 ${res.status}`);
  const text = await res.text().catch(() => '');
  let payload = null;
  try { payload = JSON.parse(text); } catch { throw new Error('模型列表不是 JSON，可能地址填到了网页首页'); }
  const models = modelNamesOf(payload);
  if (!models.length) return { ok: false, models: [], text: `${base} 连上了，但没返回模型名` };
  return { ok: true, models, text: `连接正常 · ${models.length} 个模型 · ${base}` };
}

/** 豆包 Seedream（火山方舟）：images/generations，字段比 OpenAI 多一个 watermark / 组图开关。 */async function doubaoImage({ base, token, model, width, height, seed, prompt }) {
  const payload = {
    model,
    prompt,
    size: `${width}x${height}`,
    response_format: 'b64_json',
    watermark: false,
  };
  /* 4.x 才有组图开关；3.0 不认这个字段 */
  if (/seedream-4/.test(model || '')) payload.sequential_image_generation = 'disabled';
  if (Number(seed) > 0) payload.seed = Number(seed);

  let res;
  try {
    res = await fetch(base, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  } catch (error) {
    throw new Error(`连不上 ${base}：${error.message}`);
  }
  if (!res.ok) {
    const detail = await res.text().catch(() => '');
    const short = detail ? `：${detail.slice(0, 160)}` : '';
    throw new Error(`火山方舟返回 ${res.status}${short}`);
  }
  return imageFromResponse(res, '豆包');
}

/** 自定义接口：OpenAI 风格 images 接口；只发最通用的字段，避免严格端点的多余参数报错。 */
async function customImage({ base, token, model, width, height, seed, prompt }) {
  const payload = {
    prompt,
    size: `${width}x${height}`,
    n: 1,
    response_format: 'b64_json',
  };
  if (model) payload.model = model;
  if (Number(seed) > 0) payload.seed = Number(seed);

  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = `Bearer ${token}`;

  let res;
  try {
    res = await fetch(base, { method: 'POST', headers, body: JSON.stringify(payload) });
  } catch (error) {
    throw new Error(`连不上 ${base}：${error.message}`);
  }
  if (!res.ok) {
    const detail = await res.text().catch(() => '');
    throw new Error(`接口返回 ${res.status}${detail ? `：${detail.slice(0, 160)}` : ''}`);
  }
  return imageFromResponse(res, '接口');
}

async function imageFromResponse(res, label) {
  const type = res.headers.get('content-type') || '';
  if (type.includes('application/json')) {
    const json = await res.json().catch(() => null);
    const b64 = json?.image || json?.data?.[0]?.b64_json || json?.data?.[0]?.image || json?.b64_json || '';
    if (b64) return { url: b64.startsWith('data:') ? b64 : `data:image/png;base64,${b64}` };
    const remote = json?.data?.[0]?.url || json?.url || json?.image_url || '';
    if (remote) return { url: remote };
    throw new Error(`${label} 返回里没有图`);
  }
  if (type.includes('image/')) {
    const blob = await res.blob();
    return { url: URL.createObjectURL(blob) };
  }
  throw new Error(`${label} 返回了压缩包，当前只支持直出图片的接口`);
}

/**
 * 酒馆里可以绑给人的世界书名单。
 * 人设的 lorebook 只存书名，真正的世界书还是酒馆自己那份。
 */
async function readWorldBookNames() {
  const script = await loadHostScript();
  if (!script) return { available: false, list: [], current: '' };
  try {
    const ctx = globalThis.SillyTavern?.getContext?.() || script.getContext?.() || {};
    let names = script.world_names || ctx.world_names || [];
    if (!Array.isArray(names) || !names.length) {
      try {
        const headers = ctx.getRequestHeaders?.() || script.getRequestHeaders?.() || {};
        const response = await fetch('/api/settings/get', { method: 'POST', headers, body: '{}' });
        if (response.ok) {
          const saved = await response.json();
          if (Array.isArray(saved.world_names)) names = saved.world_names;
        }
      } catch { /* 读不到名单就只显示已绑定的那本 */ }
    }
    const current = typeof script.world_info === 'string' ? script.world_info : '';
    const list = [...new Set([...names, current].map(String).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'zh'));
    return { available: true, list, current };
  } catch {
    return { available: false, list: [], current: '' };
  }
}

/**
 * 酒馆的用户（persona）名单。
 * 名字与设定都住在酒馆设置里：power_user.personas 存「头像文件名 → 显示名」，
 * power_user.persona_descriptions 存每个头像对应的设定文本。读不到就返回 available:false。
 */
async function readTavernPersonas() {
  const script = await loadHostScript();
  if (!script) return { available: false, list: [], current: '', currentName: '', currentAvatar: '' };
  try {
    const ctx = script.getContext?.() || script;
    const pu = script.power_user || script.powerUser || ctx.powerUser || ctx.powerUserSettings || globalThis.power_user || {};
    const names = pu.personas && typeof pu.personas === 'object' ? pu.personas : null;
    if (!names) return { available: false, list: [], current: '', currentName: '', currentAvatar: '' };
    const descs = pu.persona_descriptions && typeof pu.persona_descriptions === 'object' ? pu.persona_descriptions : {};
    const thumb = script.getThumbnailUrl;
    const current = String(script.user_avatar || ctx.user_avatar || '');
    const currentName = String(script.name1 || ctx.name1 || '');
    const list = Object.entries(names)
      .filter(([, name]) => Boolean(name))
      .map(([key, name]) => ({
        key,
        name: String(name || '').trim(),
        description: String(descs[key]?.description || ''),
        lorebook: String(descs[key]?.lorebook || (key === current ? pu.persona_description_lorebook : '') || ''),
        avatarUrl: typeof thumb === 'function' ? thumb('persona', key) : '',
      }));
    return {
      available: true,
      list,
      current,
      currentName,
      /* 当前这人可能没设显示名、被上面的过滤筛掉，头像仍按文件名取 */
      currentAvatar: typeof thumb === 'function' && current ? thumb('persona', current) : '',
    };
  } catch {
    return { available: false, list: [], current: '', currentName: '', currentAvatar: '' };
  }
}

/**
 * 把改过的名字 / 设定 / 人设世界书写回酒馆。
 * 只改内存里的 power_user，再让酒馆自己保存设置——不走私有接口，装进酒馆就能用。
 */
async function writeTavernPersona({ key, name, description, lorebook }) {
  const script = await loadHostScript();
  const ctx = script?.getContext?.() || script || {};
  const pu = script?.power_user || script?.powerUser || ctx.powerUser || ctx.powerUserSettings || globalThis.power_user;
  if (!pu || !pu.personas) throw new Error('没接上酒馆，改不了酒馆那一边');
  if (!key) throw new Error('这条没有对应的酒馆用户');

  const cleanName = String(name || '').trim();
  if (cleanName) pu.personas[key] = cleanName;

  if (typeof description === 'string' || typeof lorebook === 'string') {
    const descs = pu.persona_descriptions || (pu.persona_descriptions = {});
    const next = { ...(descs[key] || {}) };
    if (typeof description === 'string') next.description = description;
    if (typeof lorebook === 'string') next.lorebook = String(lorebook || '').trim();
    descs[key] = next;
  }

  if (String(script.user_avatar || ctx.user_avatar || '') === key) {
    if (cleanName) {
      script.name1 = cleanName;
      if (ctx.name1 !== undefined) ctx.name1 = cleanName;
    }
    if (typeof lorebook === 'string') {
      pu.persona_description_lorebook = String(lorebook || '').trim();
      if (ctx.powerUser) ctx.powerUser.persona_description_lorebook = pu.persona_description_lorebook;
    }
    const box = globalThis.document?.querySelector('#user_name');
    if (box && cleanName) box.value = cleanName;
  }

  const save = ctx.saveSettingsDebounced || script.saveSettingsDebounced;
  if (typeof save === 'function') await save();
  return { ok: true };
}

/**
 * 酒馆当前在用的 API 配置（只读，不写）。
 * 酒馆把连接参数放在 oai_settings：反向代理地址在 reverse_proxy，
 * 代理密码（也就是 Key）在 proxy_password，来源与模型各有字段。
 * 只在用户点「从酒馆导入」时调用，读不到就返回 available:false。
 */
async function readTavernApi() {
  const script = await loadHostScript();
  if (!script) return { available: false, reason: '没接上酒馆，先打开酒馆再试' };
  try {
    const ctx = globalThis.SillyTavern?.getContext?.() || script.getContext?.() || script;
    const direct = script.oai_settings
      || script.chatCompletionSettings
      || ctx.oai_settings
      || ctx.oaiSettings
      || ctx.chatCompletionSettings
      || script.settings?.oai_settings
      || globalThis.oai_settings
      || null;
    let settings = direct;

    /* getContext() 通常不暴露 oai_settings；用酒馆自己的设置接口兜底 */
    if (!settings || typeof settings !== 'object' || !Object.keys(settings).length) {
      try {
        const headers = ctx.getRequestHeaders?.() || script.getRequestHeaders?.() || {};
        const response = await fetch('/api/settings/get', {
          method: 'POST',
          headers,
          body: '{}',
        });
        if (response.ok) {
          const saved = await response.json();
          settings = saved.oai_settings || saved.settings?.oai_settings || null;
        }
      } catch { /* 读不到就继续走下面的失败提示 */ }
    }

    if (!settings) {
      return { available: false, reason: '酒馆没把这版接口设置暴露出来' };
    }

    const source = String(settings.chat_completion_source || 'openai');
    const model = String(
      settings.custom_model
      || settings.openai_model
      || settings.claude_model
      || settings.google_model
      || settings.openrouter_model
      || settings.mistralai_model
      || settings.cohere_model
      || '',
    ).trim();
    const proxy = String(settings.reverse_proxy || '').trim();
    const customUrl = String(settings.custom_url || '').trim();
    const key = String(
      settings.custom_key
      || settings.proxy_password
      || settings.openai_key
      || settings.openrouter_key
      || settings.claude_key
      || settings.google_key
      || settings.mistralai_key
      || settings.cohere_key
      || '',
    ).trim();
    let url = (proxy || customUrl).replace(/\/+$/, '');
    if (!url && source === 'openai') url = 'https://api.openai.com';
    if (!url && source === 'openrouter') url = 'https://openrouter.ai/api';

    /* 酒馆新版把「接口名字」放在连接配置里；有选中项就带上名字，导入时直接用它命名 */
    const manager = script.extensionSettings?.connectionManager
      || ctx.extensionSettings?.connectionManager
      || {};
    const profiles = Array.isArray(manager.profiles) ? manager.profiles : [];
    const selected = typeof manager.selectedProfile === 'object' && manager.selectedProfile
      ? manager.selectedProfile
      : profiles.find(item => item && item.id === manager.selectedProfile) || null;
    const profile = selected
      || profiles.find(item => String(item?.['api-url'] || '').trim().replace(/\/+$/, '') === url)
      || null;
    const profileName = String(profile?.name || '').trim();

    return {
      available: true,
      source,
      url,
      key,
      model,
      name: profileName,
      profileId: profile?.id || '',
      direct: Boolean(proxy || customUrl),
      reason: url ? '' : '酒馆这套走内部转发，没有可直连的地址',
    };
  } catch (error) {
    return { available: false, reason: `读酒馆设置时出错：${error.message || error}` };
  }
}

/**
 * 借酒馆后端拉一次模型列表。
 * 小手机在酒馆窗口里跑，直接 fetch 外部接口会被 CORS 拦；
 * 酒馆自己的 /api/backends/chat-completions/status 就是干这个的，还带着酒馆存的 Key。
 * 传进来的 preset 有地址 / Key 时优先用它，没有就用酒馆当前设置。
 */
async function listTavernModels(preset = {}) {
  const script = await loadHostScript();
  if (!script) return { available: false, models: [], reason: '没接上酒馆' };
  try {
    const ctx = globalThis.SillyTavern?.getContext?.() || script.getContext?.() || {};
    const settings = script.oai_settings
      || script.chatCompletionSettings
      || ctx.oai_settings
      || ctx.oaiSettings
      || ctx.chatCompletionSettings
      || script.settings?.oai_settings
      || globalThis.oai_settings
      || {};
    const source = String(preset.tavernSource || settings.chat_completion_source || 'openai');
    const url = String(preset.url || settings.reverse_proxy || settings.custom_url || '').trim();
    const key = String(
      preset.key
      || settings.custom_key
      || settings.proxy_password
      || settings.openai_key
      || settings.openrouter_key
      || '',
    ).trim();
    const getHeaders = ctx.getRequestHeaders || script.getRequestHeaders;
    const headers = typeof getHeaders === 'function' ? { ...getHeaders() } : {};
    if (!headers['X-CSRF-Token']) {
      const token = ctx.csrf_token || globalThis.csrf_token || '';
      if (token) headers['X-CSRF-Token'] = token;
    }
    headers['Content-Type'] = 'application/json';

    const body = {
      chat_completion_source: source,
      reverse_proxy: url,
      proxy_password: key,
    };
    if (source === 'custom') {
      body.custom_url = url;
      body.custom_include_headers = String(settings.custom_include_headers || '');
    }
    const response = await fetch('/api/backends/chat-completions/status', {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      credentials: 'same-origin',
      cache: 'no-store',
    });
    if (!response.ok) {
      return { available: true, models: [], reason: `酒馆后端返回 ${response.status}` };
    }
    const data = await response.json().catch(() => null);
    if (!data || data.error) {
      return { available: true, models: [], reason: data?.message || '酒馆后端没连上这个接口' };

    openSheet: (sheet) => { shell.sheetAnimated = false; shell.sheet = sheet; render(); },

    icon: ico,
    esc,
    TINT,
    clockText,
    dateText,
    timeText,
    shortText,
  });

  /* ------------------------------------------------------------ 渲染 */

  function desktopHtml() {
    const state = ctx.state;
    const chats = chatsOf(state);
    const recent = chats.find(chat => lastMessage(chat));
    const diary = latestDiary(state);
    const recentContact = recent ? contactById(state, recent.contactId) : null;
    const recentMsg = recent ? lastMessage(recent) : null;
    const me = Array.isArray(state.users)
      ? state.users.find(item => item && item.key && item.key === state.settings.user.key) || null
      : null;
    const themed = state.settings.dress?.theme === 'pixel' ? PIXEL_BUNNY : null;
    const myName = themed ? themed.profile.name : (state.settings.user.name || me?.name || '我');
    const myAvatar = themed ? themed.avatar : (state.settings.user.avatar || me?.avatarUrl || '');
    const ownBio = String(state.settings.profile?.bio || '').trim();
    const myBio = ownBio || (themed ? themed.profile.bio : String(me?.description || '把每天的事，记在这台小手机里。').trim());
    const ownBanner = String(state.settings.profile?.banner || '').trim();
    const themedBanner = themed ? themed.banner : '';
    const bannerImage = ownBanner || themedBanner;
    const bannerStyle = bannerImage ? ` style="background-image:url(&quot;${bannerImage}&quot;);background-size:cover;background-position:center"` : '';
    const stampText = dateText().replace('<br>', ' · ');

    const iconButtons = desktopApps.map(app => `
      <button class="mp-app" data-act="open-app" data-app="${app.id}" type="button" aria-label="${esc(app.name)}">
        ${appTileHtml(app, state)}
        <span class="mp-app-label">${esc(app.name)}</span>
      </button>`).join('');

    const dockButtons = dockApps.map(app => {
      const badge = app.id === 'chat' ? unreadTotal(state) : 0;
      return `
      <button class="mp-app" data-act="open-app" data-app="${app.id}" type="button" aria-label="${esc(app.name)}">
        ${appTileHtml(app, state, badge)}
        <span class="mp-app-label">${esc(app.name)}</span>
      </button>`;
    }).join('');

    return `
      <div class="mp-desktop">
        <div class="mp-profile">
          <span class="mp-profile-banner${bannerImage ? ' is-custom' : ''}" data-act="profile-banner"${bannerStyle} title="点一下换背景图">
            <span class="mp-profile-stamp">${stampText}</span>
          </span>
          <span class="mp-profile-avatar${myAvatar ? '' : ' is-empty'}" data-act="open-app" data-app="user"${myAvatar ? ` style="background-image:url(&quot;${myAvatar}&quot;)"` : ''}>${myAvatar ? '' : esc(String(myName).slice(0, 1))}</span>
          <span class="mp-profile-name" data-act="open-app" data-app="user">${esc(myName)}</span>
          ${shell.bioEdit ? `
          <div class="mp-profile-bio-edit">
            <input id="mpProfileBio" class="mp-profile-bio-input" type="text" maxlength="30" value="${esc(myBio)}" placeholder="写一句签名">
            <button class="mp-profile-mini is-primary" data-act="profile-bio-save" type="button">存</button>
            <button class="mp-profile-mini" data-act="profile-bio-cancel" type="button">取消</button>
          </div>` : `
          <button class="mp-profile-bio" data-act="profile-bio-edit" type="button">
            <span>${esc(myBio || '点这里写签名')}</span>
            ${ico('brush')}
          </button>`}
        </div>
        <input id="mpProfileBanner" type="file" accept="image/*" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0">

        <div class="mp-widget-strip">
          <button class="mp-mini-widget" data-act="open-app" data-app="chat" type="button">
            <span class="mp-mini-head">${ico('chat')} 最近</span>
            ${recentContact ? `
            <span class="mp-mini-main">
              ${avatarHtml(recentContact.name, recentContact.avatar, 'mp-mini-avatar')}
              <span class="mp-mini-copy">
                <span class="mp-mini-name">${esc(recentContact.name)}</span>
                <span class="mp-mini-msg">${esc(recentMsg?.text || '')}</span>
              </span>
            </span>` : `
            <span class="mp-mini-empty">等一条新消息</span>`}
          </button>

          <button class="mp-mini-widget" data-act="open-app" data-app="diary" type="button">
            <span class="mp-mini-head">${ico('diary')} ${diary ? esc(diaryDateLabel(diary)) : '昨日日记'}</span>
            <span class="mp-mini-text">${diary ? esc(diary.text) : '这一格还空着。写一句今天的事，它就会留在这里。'}</span>
          </button>
        </div>

        <div class="mp-apps">${iconButtons}</div>

        <div class="mp-dock">${dockButtons}</div>
      </div>`;
  }

  function diaryDateLabel(diary) {
    const [, month, day] = diary.key.split('-');
    return `${Number(month)}月${Number(day)}日`;
  }

  function pageHtml() {
    const entry = shell.stack[shell.stack.length - 1];
    const app = apps[entry.view];
    if (!app) return desktopHtml();
    const body = app.render(ctx, entry.params || {});
    // 页面自己没画返回键就补一条：所有界面都得能回去
    const hasBack = String(body).includes('data-act="back"');
    return `
      <div class="mp-page" data-view="${esc(entry.view)}">
        ${hasBack ? '' : `<div class="mp-nav"><button class="mp-back" data-act="back" type="button">${ico('back')}<span>返回</span></button><span style="flex:1"></span></div>`}
        ${body}
      </div>`;
  }

  function sheetHtml() {
    const sheet = shell.sheet;
    if (!sheet) return '';
    const still = shell.sheetAnimated ? ' is-still' : '';

    if (sheet.kind === 'text') {
      return `
        <div class="mp-mask${still}" data-act="sheet-close"></div>
        <div class="mp-sheet${still}" role="dialog" aria-modal="true">
          ${sheet.title ? `<div class="mp-sheet-title">${esc(sheet.title)}</div>` : ''}
          <textarea id="mpSheetText" class="mp-sheet-textarea" placeholder="${esc(sheet.placeholder || '')}">${esc(sheet.value || '')}</textarea>
          <div style="display:flex;gap:8px;margin-top:9px">
            <button class="mp-sheet-cancel" data-act="sheet-close" type="button" style="margin-top:0;flex:1">取消</button>
            <button class="mp-sheet-cancel" data-act="sheet-text-ok" type="button" style="margin-top:0;flex:1.4;background:linear-gradient(150deg,#9583f2,#7f6ce9);color:#fff;box-shadow:0 8px 18px rgba(140,116,224,.26)">${esc(sheet.confirm || '存下来')}</button>
          </div>
        </div>`;
    }

    if (sheet.kind === 'form') {
      const fields = (sheet.fields || []).map((field, index) => {
        const id = `mpField${index}`;
        let control = '';
        if (field.type === 'textarea') {
          control = `<textarea id="${id}" class="mp-sheet-textarea mp-sheet-form-textarea" maxlength="${field.maxLength || 4000}" placeholder="${esc(field.placeholder || '')}">${esc(field.value || '')}</textarea>`;
        } else if (field.type === 'checks') {
          const picked = new Set(Array.isArray(field.value) ? field.value.map(String) : []);
          const options = (field.options || []).map(option => `
            <label class="mp-sheet-check">
              <input type="checkbox" data-check-field="${esc(field.name)}" value="${esc(option.value)}"${picked.has(String(option.value)) ? ' checked' : ''}>
              <span>${esc(option.label)}</span>
            </label>`).join('');
          control = `<div class="mp-sheet-checks">${options}</div>`;
        } else if (field.type === 'select') {
          const options = (field.options || []).map(option => `<option value="${esc(option.value)}"${String(option.value) === String(field.value) ? ' selected' : ''}>${esc(option.label)}</option>`).join('');
          control = `<div class="mp-select-wrap"><select id="${id}" class="mp-sheet-input mp-sheet-select">${options}</select>${ico('chevron')}</div>`;
        } else {
          control = `<input id="${id}" class="mp-sheet-input" type="text" maxlength="${field.maxLength || 30}" value="${esc(field.value || '')}" placeholder="${esc(field.placeholder || '')}">`;
        }
        return `<label class="mp-sheet-field">
          <span class="mp-sheet-field-label">${esc(field.label || '')}</span>
          ${control}
          ${field.hint ? `<span class="mp-sheet-field-hint">${esc(field.hint)}</span>` : ''}
        </label>`;
      }).join('');
      return `
        <div class="mp-mask${still}" data-act="sheet-close"></div>
        <div class="mp-sheet${still}" role="dialog" aria-modal="true">
          ${sheet.title ? `<div class="mp-sheet-title">${esc(sheet.title)}</div>` : ''}
          <div class="mp-sheet-form">${fields}</div>
          <div style="display:flex;gap:8px;margin-top:9px">
            <button class="mp-sheet-cancel" data-act="sheet-close" type="button" style="margin-top:0;flex:1">取消</button>
            <button class="mp-sheet-cancel" data-act="sheet-form-ok" type="button" style="margin-top:0;flex:1.4;background:linear-gradient(150deg,#9583f2,#7f6ce9);color:#fff;box-shadow:0 8px 18px rgba(140,116,224,.26)">${esc(sheet.confirm || '保存')}</button>
          </div>
        </div>`;
    }

    const items = (sheet.items || []).map(item => `
      <button class="mp-sheet-item${item.danger ? ' danger' : ''}" data-act="sheet-pick" data-value="${esc(item.value)}" type="button">
        ${item.icon ? ico(item.icon) : ''}<span>${esc(item.label)}</span>
      </button>`).join('');
    return `
      <div class="mp-mask${still}" data-act="sheet-close"></div>
      <div class="mp-sheet${still}" role="dialog" aria-modal="true">
        ${sheet.title ? `<div class="mp-sheet-title">${esc(sheet.title)}</div>` : ''}
        ${items}
        <button class="mp-sheet-cancel" data-act="sheet-close" type="button">取消</button>
      </div>`;
  }

  /* 桌面宿主的窗口往往装不下 844 高的手机：按可用视口等比缩小，整机才不会被裁掉 */
  function deviceScale() {
    const vw = window.visualViewport?.width || window.innerWidth || 0;
    const vh = window.visualViewport?.height || window.innerHeight || 0;
    if (!vw || !vh) return 1;
    const fit = Math.min((vw - 48) / 390, (vh - 48) / 844);
    return Math.max(0.45, Math.min(1, fit));
  }

  function deviceTransform() {
    const offset = shell.deviceOffset || { x: 0, y: 0 };
    return `translate(${Math.round(offset.x || 0)}px, ${Math.round(offset.y || 0)}px) scale(${deviceScale().toFixed(4)})`;
  }

  function render() {
    if (!root) return;
    const state = ctx.state;
    const status = state.settings.theme === 'night' ? 'night' : 'day';
    /* 同一页重绘（切下拉、保存、开关）时把滚动位置带回原位，别让它看起来像整页刷新 */
    const prevView = shell.stack[shell.stack.length - 1]?.view || '';
    const prevScroll = root.querySelector('.mp-page-body')?.scrollTop || 0;
    root.className = 'mp-root';
    root.dataset.mpTheme = status;
    applyWall(root, state.settings);
    applyLook(root, state.settings);
    root.innerHTML = `
      <div class="mp-overlay">
        <div class="mp-device" style="transform: ${deviceTransform()}">
          <div class="mp-screen">
            ${state.settings.dress?.island === 'hide' ? '' : '<div class="mp-island"></div>'}
            <div class="mp-drag-handle" data-drag="phone" title="按住顶部拖动手机"></div>
            <div class="mp-wallpaper"></div>
            <div class="mp-scrim"></div>
            <div class="mp-status">
              <span class="mp-status-left">${shell.stack.length && !shell.sheet ? `<button class="mp-status-back" data-act="back" type="button" aria-label="返回">${ico('back')}</button>` : ''}</span>
              <span class="mp-status-right">${clockText()}</span>
            </div>
            ${shell.stack.length ? pageHtml() : desktopHtml()}
            ${sheetHtml()}
            ${shell.toastMessage ? `<div class="mp-toast">${esc(shell.toastMessage)}</div>` : ''}
            <div class="mp-home-bar" data-act="home" title="回桌面"></div>
          </div>
        </div>
      </div>`;

    restoreLive();
    shell.improveSendState();
    if (prevScroll > 0 && (shell.stack[shell.stack.length - 1]?.view || '') === prevView) {
      const box = root.querySelector('.mp-page-body');
      if (box) box.scrollTop = prevScroll;
    }
    if (shell.sheet) shell.sheetAnimated = true;
  }

  function restoreLive() {
    const input = root.querySelector('.mp-compose-box input');
    if (input && shell.live.inputValue) {
      input.value = shell.live.inputValue;
      shell.improveSendState();
      if (shell.live.focus) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }
    if (shell.scroller) {
      const box = root.querySelector('.mp-messages');
      if (box) box.scrollTop = shell.scroller;
    }
  }

  shell.improveSendState = function improveSendState() {
    const button = root.querySelector('.mp-send');
    const input = root.querySelector('.mp-compose-box input');
    if (!button || !input) return;
    const hasText = Boolean(input.value.trim());
    button.classList.toggle('is-text', hasText);
    button.classList.toggle('is-wake', !hasText);
  };

  shell.refresh = render;

  /* --------------------------------------------------------- 提示自动消失 */

  function scheduleToastClear() {
    clearTimeout(shell.toastTimer);
    shell.toastTimer = setTimeout(() => {
      shell.toastMessage = '';
      const node = root.querySelector('.mp-toast');
      if (node) node.remove();
    }, 2400);
  }

  /* ----------------------------------------------------------- 事件绑定 */

  const acts = {
    'open-app': (data) => { shell.live = { inputValue: '', focus: false }; ctx.go('app-' + data.app, {}); },
    'home': () => { shell.live = { inputValue: '', focus: false }; ctx.home(); },
    'back': () => { if (shell.sheet) ctx.closeSheet(); else ctx.back(); },
    'sheet-close': () => ctx.closeSheet(),
    'sheet-pick': (data) => {
      const sheet = shell.sheet;
      const handler = sheet?.onPick;
      const value = data.value;
      /* 先回调，再渲染：重渲染会重建对象，先关弹层会让回调改到旧对象上 */
      shell.sheet = null;
      shell.sheetAnimated = false;
      if (typeof handler === 'function') handler(value);
      if (!shell.sheet) render();
    },
    'sheet-text-ok': () => {
      const sheet = shell.sheet;
      const node = root.querySelector('#mpSheetText');
      const value = node ? node.value : '';
      const handler = sheet?.onText;
      shell.sheet = null;
      shell.sheetAnimated = false;
      if (typeof handler === 'function') handler(value);
      if (!shell.sheet) render();
    },
    'sheet-form-ok': () => {
      const sheet = shell.sheet;
      const fields = sheet?.fields || [];
      const values = {};
      fields.forEach((field, index) => {
        if (field.type === 'checks') {
          values[field.name] = [...root.querySelectorAll(`[data-check-field="${field.name}"]`)].filter(node => node.checked).map(node => node.value);
          return;
        }
        const node = root.querySelector(`#mpField${index}`);
        values[field.name] = node ? node.value : '';
      });
      const handler = sheet?.onForm;
      shell.sheet = null;
      shell.sheetAnimated = false;
      if (typeof handler === 'function') handler(values);
      if (!shell.sheet) render();
    },
    'toast': (data) => ctx.toast(data.message || ''),
    'profile-banner': () => { root.querySelector('#mpProfileBanner')?.click(); },
    'profile-bio-edit': () => {
      shell.bioEdit = true;
      render();
      setTimeout(() => {
        const node = root.querySelector('#mpProfileBio');
        if (!node) return;
        node.focus();
        node.select();
        node.onkeydown = (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            root.querySelector('[data-act="profile-bio-save"]')?.click();
          } else if (event.key === 'Escape') {
            event.preventDefault();
            root.querySelector('[data-act="profile-bio-cancel"]')?.click();
          }
        };
      }, 60);
    },
    'profile-bio-save': () => {
      const node = root.querySelector('#mpProfileBio');
      const value = String(node ? node.value : '').trim().slice(0, 30);
      const settings = ctx.state.settings;
      if (!settings.profile || typeof settings.profile !== 'object') settings.profile = { bio: '', banner: '' };
      settings.profile.bio = value;
      shell.bioEdit = false;
      render();
      ctx.save();
      ctx.toast(value ? '签名已经换了' : '签名清空了');
    },
    'profile-bio-cancel': () => { shell.bioEdit = false; render(); },
    'phone-close': () => { if (typeof ctx.onClose === 'function') ctx.onClose(); },
    'toggle-theme': () => {
      const settings = ctx.state.settings;
      const next = settings.theme === 'night' ? 'day' : 'night';
      settings.theme = next;
      if (!['none', 'custom'].includes(settings.wallpaper)) settings.wallpaper = next;
      render();
      ctx.save();
    },
  };

  root.addEventListener('click', event => {
    /* 原生 <select> / <input> 的取值只走下面的 change 事件；click 阶段还没有选中值，
       不能按按钮动作执行，否则打开下拉或聚焦输入框时会被默认值保存并整页重渲染。 */
    if (event.target.closest('select[data-act], input[data-act], textarea[data-act]')) return;
    const target = event.target.closest('[data-act]');
    if (!target || !root.contains(target)) return;
    const act = target.dataset.act;
    if (act === 'sheet-pick' && String(target.dataset.value).startsWith('__')) return;
    const data = Object.assign({}, target.dataset);
    const entry = shell.stack[shell.stack.length - 1];
    const app = entry ? apps[entry.view] : null;

    /* 页面先处理，未消费再交给全局 */
    if (app && typeof app.handle === 'function' && app.handle(ctx, act, data, event)) return;
    if (acts[act]) { acts[act](data, event); return; }
    if (typeof ctx.onGlobalAct === 'function' && ctx.onGlobalAct(act, data, event)) return;
  });

  /* 下拉框 / 输入框：原生控件只负责取值，动作仍走统一 handle */
  root.addEventListener('change', event => {
    const target = event.target.closest('[data-act]');
    if (!target || !root.contains(target)) return;
    if (!['SELECT', 'INPUT', 'TEXTAREA'].includes(target.tagName)) return;
    const act = target.dataset.act;
    const data = Object.assign({}, target.dataset, { value: target.value });
    const entry = shell.stack[shell.stack.length - 1];
    const app = entry ? apps[entry.view] : null;
    if (app && typeof app.handle === 'function' && app.handle(ctx, act, data, event)) return;
    if (acts[act]) { acts[act](data, event); return; }
    if (typeof ctx.onGlobalAct === 'function' && ctx.onGlobalAct(act, data, event)) return;
  });

  /* 顶部中间拖动手机壳：只在最上面一条区域响应，不影响页面里的滑动 */
  let phoneDrag = null;
  function clampDeviceOffset(x, y) {
    const scale = deviceScale();
    const maxX = Math.max(0, (window.innerWidth + 390 * scale) / 2 - 90 * scale);
    const maxY = Math.max(0, (window.innerHeight + 844 * scale) / 2 - 120 * scale);
    return {
      x: Math.max(-maxX, Math.min(maxX, x)),
      y: Math.max(-maxY, Math.min(maxY, y)),
    };
  }
  root.addEventListener('pointerdown', event => {
    const handle = event.target.closest('[data-drag="phone"]');
    if (!handle) return;
    const device = root.querySelector('.mp-device');
    if (!device) return;
    event.preventDefault();
    event.stopPropagation();
    phoneDrag = {
      id: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      baseX: shell.deviceOffset?.x || 0,
      baseY: shell.deviceOffset?.y || 0,
    };
    device.classList.add('is-dragging');
    handle.setPointerCapture?.(event.pointerId);
  });
  window.addEventListener('pointermove', event => {
    if (!phoneDrag || event.pointerId !== phoneDrag.id) return;
    const device = root.querySelector('.mp-device');
    if (!device) return;
    const next = clampDeviceOffset(
      phoneDrag.baseX + event.clientX - phoneDrag.startX,
      phoneDrag.baseY + event.clientY - phoneDrag.startY
    );
    shell.deviceOffset = next;
    device.style.transform = deviceTransform();
    event.preventDefault();
  }, { passive: false });
  const endPhoneDrag = event => {
    if (!phoneDrag || event.pointerId !== phoneDrag.id) return;
    phoneDrag = null;
    root.querySelector('.mp-device')?.classList.remove('is-dragging');
  };
  window.addEventListener('pointerup', endPhoneDrag);
  window.addEventListener('pointercancel', endPhoneDrag);
  window.addEventListener('resize', () => {
    shell.deviceOffset = clampDeviceOffset(shell.deviceOffset?.x || 0, shell.deviceOffset?.y || 0);
    const device = root.querySelector('.mp-device');
    if (device) device.style.transform = deviceTransform();
  });

  /* 上滑：页面里快速上滑一段就回桌面 */
  let swipe = null;

  root.addEventListener('pointerdown', event => {
    if (!shell.stack.length) return;
    const screen = root.querySelector('.mp-screen');
    if (!screen) return;
    const rect = screen.getBoundingClientRect();
    const fromBottom = event.clientY - rect.top;
    const zone = event.pointerType === 'mouse' ? rect.height - 150 : rect.height * 0.5;
    if (fromBottom < zone) return;
    swipe = { x: event.clientX, y: event.clientY, t: Date.now() };
  });

  root.addEventListener('pointerup', event => {
    if (!swipe) return;
    const dy = event.clientY - swipe.y;
    const dx = Math.abs(event.clientX - swipe.x);
    const dt = Date.now() - swipe.t;
    const need = event.pointerType === 'mouse' ? -60 : -90;
    const hit = dy <= need && dx <= 80 && dt <= 620;
    swipe = null;
    if (!hit || !shell.stack.length) return;
    if (document.activeElement?.blur) document.activeElement.blur();
    shell.live = { inputValue: '', focus: false };
    ctx.home();
  });

  root.addEventListener('pointercancel', () => { swipe = null; });

  /* 长按：data-hold 元素 420ms 触发 hold 动作 */
  let holdTimer = 0;
  let holdTarget = null;

  root.addEventListener('pointerdown', event => {
    const target = event.target.closest('[data-hold]');
    if (!target) return;
    holdTarget = target;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      if (!holdTarget) return;
      const entry = shell.stack[shell.stack.length - 1];
      const app = entry ? apps[entry.view] : null;
      const data = Object.assign({}, holdTarget.dataset);
      if (app?.handle && app.handle(ctx, holdTarget.dataset.hold, data, event)) {
        if (navigator.vibrate) navigator.vibrate(12);
      }
      holdTarget = null;
    }, 420);
  });

  const cancelHold = () => { clearTimeout(holdTimer); holdTarget = null; };
  root.addEventListener('pointerup', cancelHold);
  root.addEventListener('pointercancel', cancelHold);
  root.addEventListener('pointermove', cancelHold);

  /* 输入：不整页重绘，只切发送键状态并同步草稿 */
  root.addEventListener('input', event => {
    const entry = shell.stack[shell.stack.length - 1];
    const app = entry ? apps[entry.view] : null;
    if (app && typeof app.onInput === 'function' && app.onInput(ctx, event)) return;
    const input = event.target.closest('.mp-compose-box input');
    if (!input) return;
    shell.live.inputValue = input.value;

];

const DOUBAO_MODELS = [

  { value: 'doubao-seedream-4-0-250828', label: 'Seedream 4.0' },

];

const ENGINES = [
  { value: 'novelai', label: 'NovelAI 官方', note: '官方端点，Key 以 pst- 开头' },
  { value: 'doubao', label: '豆包 · 火山方舟', note: 'ark.cn-beijing.volces.com，填 ARK_API_KEY' },

const QUALITY = 'best quality, amazing quality, very aesthetic, absurdres';
const DEFAULT_NEG = 'lowres, bad anatomy, bad hands, bad feet, text, watermark, signature, worst quality, jpeg artifacts';

const TINTS = [

function ensure(state) {
  const base = {
    config: {
      url: '', key: '', model: 'nai-diffusion-4-curated-preview',
      size: '832x1216', steps: 28, scale: 5,
      sampler: 'k_euler_ancestral', noise: 'karras', seed: '',
    },
    presets: [{ id: 'dp_default', name: '默认', pos: '', neg: '' }],
    presetIdx: 0,
    schemes: [],
    schemeId: '',
    lastPrompt: '',
    history: [],
  };
  if (!state.draw || typeof state.draw !== 'object') state.draw = base;
  /* 保留原对象引用：弹层渲染会重跑 ensure，换成新对象会让回调改到旧对象上 */
  if (!state.draw.config || typeof state.draw.config !== 'object') state.draw.config = {};
  Object.keys(base.config).forEach(key => {
    if (state.draw.config[key] === undefined) state.draw.config[key] = base.config[key];
  });
  const drawPresets = Array.isArray(state.draw.presets)
    ? state.draw.presets.filter(item => item && typeof item === 'object')
    : [];
  if (!drawPresets.length) drawPresets.push(...base.presets.map(item => ({ ...item })));
  state.draw.presets = drawPresets;
  drawPresets.forEach((item, index) => {
    item.id = item.id || `dp_${index}`;
    item.name = item.name || `预设 ${index + 1}`;
    item.pos = item.pos || '';
    item.neg = item.neg || '';
  });
  if (typeof state.draw.presetIdx !== 'number' || state.draw.presetIdx >= state.draw.presets.length) state.draw.presetIdx = 0;
  if (!Array.isArray(state.draw.history)) state.draw.history = [];

  const img = state.settings.image;
  if (!img || typeof img !== 'object') state.settings.image = {};
  const image = state.settings.image;
  image.engine = ['custom', 'doubao'].includes(image.engine) ? image.engine : 'novelai';
  image.novelai = { url: 'https://image.novelai.net', key: '', model: 'nai-diffusion-4-curated-preview', ...(image.novelai || {}) };
  image.doubao = { url: 'https://ark.cn-beijing.volces.com/api/v3/images/generations', key: '', model: 'doubao-seedream-4-5-251128', ...(image.doubao || {}) };
  image.custom = { url: '', key: '', model: '', path: '/v1/images/generations', ...(image.custom || {}) };

  /* 把原来那套单一接口配置收成第一套「绘图接口预设」，老存档不用手动迁移 */
  const imagePresets = Array.isArray(image.presets)
    ? image.presets.filter(item => item && typeof item === 'object')
    : [];
  image.presets = imagePresets;
  if (!imagePresets.length) {
    const engine = image.engine;
    const legacy = engine === 'novelai' ? image.novelai : engine === 'doubao' ? image.doubao : image.custom;
    imagePresets.push({
      id: 'image_default',
      name: engine === 'novelai' ? 'NovelAI 官方' : engine === 'doubao' ? '豆包 Seedream' : '自定义接口',
      engine,
      url: legacy.url || '',
      path: legacy.path || '',
      key: legacy.key || '',
      model: legacy.model || '',
    });
  }
  imagePresets.forEach((item, index) => {
    item.id = item.id || `image_${index}`;
    item.name = item.name || `接口 ${index + 1}`;
    item.engine = ['custom', 'doubao'].includes(item.engine) ? item.engine : 'novelai';
    item.url = String(item.url || '');
    item.path = String(item.path || '');
    item.key = String(item.key || '');
    item.model = String(item.model || '');
  });
  if (!imagePresets.some(item => item.id === image.activeId)) image.activeId = imagePresets[0].id;

  /* 整体方案 = 一套接口预设 + 一套提示词预设 */
  if (!Array.isArray(state.draw.schemes)) state.draw.schemes = [];
  state.draw.schemes = state.draw.schemes.filter(item => item && typeof item === 'object');
  state.draw.schemes.forEach((item, index) => {
    item.id = item.id || `ds_${index}`;
    item.name = item.name || `方案 ${index + 1}`;
    item.apiId = item.apiId || image.activeId;
    item.promptId = item.promptId || state.draw.presets[0].id;
  });
  if (!state.draw.schemes.some(item => item.id === state.draw.schemeId)) {
    state.draw.schemeId = state.draw.schemes[0]?.id || '';
  }
  if (!state.draw.schemes.length) {
    const first = {
      id: 'ds_default',
      name: '默认方案',
      apiId: image.activeId,
      promptId: state.draw.presets[state.draw.presetIdx]?.id || state.draw.presets[0].id,
    };
    state.draw.schemes.push(first);
    state.draw.schemeId = first.id;
  }
  return state.draw;
}

function activeApi(state) {
  const image = state.settings?.image || {};
  return (image.presets || []).find(item => item.id === image.activeId) || (image.presets || [])[0] || null;
}

function activePrompt(state) {
  const draw = state.draw || {};
  return draw.presets?.[draw.presetIdx] || draw.presets?.[0] || { id: '', name: '默认', pos: '', neg: '' };
}

function applyScheme(state, scheme) {
  const image = state.settings.image;
  const draw = state.draw;
  if (scheme.apiId && image.presets.some(item => item.id === scheme.apiId)) {
    image.activeId = scheme.apiId;
    const picked = image.presets.find(item => item.id === scheme.apiId);
    if (picked) image.engine = picked.engine;
  }
  const index = draw.presets.findIndex(item => item.id === scheme.promptId);
  if (index >= 0) draw.presetIdx = index;
  draw.schemeId = scheme.id;
}

function sizeOf(key) {
  return SIZES.find(item => item.key === key) || SIZES[0];
}

function maskKey(key) {
  const text = String(key || '');
  if (!text) return '没填';
  if (text.length <= 8) return text.slice(0, 2) + '···';
  return `${text.slice(0, 4)}···${text.slice(-4)}`;
}

function joinUrl(base, path) {
  const clean = String(base || '').trim().replace(/\/+$/, '');
  if (!clean) return '';
  if (/\/v1\/|images\/generations|\/ai\/generate-image/.test(clean)) return clean;
  const route = String(path || '').trim();
  if (!route) return clean;
  return `${clean}${route.startsWith('/') ? '' : '/'}${route}`;
}

/* 绘图接口只读 settings.image 里当前选中的那套接口预设，跟聊天 API 分开 */
function imageEndpoint(state) {
  const image = state.settings?.image || {};
  const preset = activeApi(state);
  if (!preset) {
    const legacyEngine = ['custom', 'doubao'].includes(image.engine) ? image.engine : 'novelai';
    const cfg = legacyEngine === 'novelai' ? (image.novelai || {}) : legacyEngine === 'doubao' ? (image.doubao || {}) : (image.custom || {});
    return {
      engine: legacyEngine,
      name: legacyEngine === 'novelai' ? 'NovelAI 官方' : legacyEngine === 'doubao' ? '豆包 · 火山方舟' : '自定义接口',
      url: String(cfg.url || '').trim(),
      path: legacyEngine === 'custom' ? String(cfg.path || '/v1/images/generations').trim() : '',
      key: String(cfg.key || '').trim(),
      model: String(cfg.model || '').trim(),
    };
  }
  const engine = ['custom', 'doubao'].includes(preset?.engine) ? preset.engine : 'novelai';
  const drawCfg = state.draw?.config || {};
  return {
    engine,
    name: String(preset?.name || (engine === 'novelai' ? 'NovelAI 官方' : engine === 'doubao' ? '豆包 · 火山方舟' : '自定义接口')),
    url: String(preset?.url || (engine === 'novelai' ? drawCfg.url : '') || '').trim(),
    path: engine === 'custom' ? String(preset?.path || '/v1/images/generations').trim() : '',
    key: String(preset?.key || (engine === 'novelai' ? drawCfg.key : '') || '').trim(),
    model: String(preset?.model || (engine === 'novelai' ? drawCfg.model : '') || '').trim(),
  };
}

function endpointReady(ep) {
  if (ep.engine === 'custom') return Boolean(ep.url);
  return Boolean(ep.url && ep.key);
}

/** 把当前绘图接口的地址 / Key / 模型同步回各引擎的默认配置，换引擎时不丢。 */
function setEngineField(image, engine, key, value) {
  const bucket = engine === 'novelai' ? image.novelai : engine === 'doubao' ? image.doubao : image.custom;
  if (bucket && key in bucket) bucket[key] = value;
}

function nameEditBlock(kind, value) {

/* 统一的 iOS 风格下拉框：跟聊天接口页同一套样式和取值方式 */
function iosSelect(act, items, value, attrs = '') {
  const options = items.map(item => `
    <option value="${esc(item.value)}"${String(item.value) === String(value) ? ' selected' : ''}>${esc(item.label)}</option>`).join('');
  return `<div class="mp-select-wrap"><select data-act="${act}"${attrs}>${options}</select>${icon('chevron')}</div>`;
}

function engineLabel(engine) {
  return engine === 'novelai' ? 'NovelAI 官方' : engine === 'doubao' ? '豆包 · 火山方舟' : '自定义接口';
}

function engineNote(engine) {
  return engine === 'novelai' ? '官方端点，只用 Key' : engine === 'doubao' ? '火山方舟 images 接口，只用 Key' : '地址 + Key 自己填';
}

function apiDot(preset) {
  if (preset?.status) {
    return preset.status.ok
      ? { cls: 'is-ok', text: preset.status.text || '连接正常' }
      : { cls: 'is-bad', text: preset.status.text || '连接失败' };
  }
  return { cls: 'is-idle', text: '还没测试连接' };
}

function presetEndpoint(preset) {
  const engine = ['custom', 'doubao'].includes(preset?.engine) ? preset.engine : 'novelai';
  return {
    engine,
    url: String(preset?.url || '').trim(),
    path: engine === 'custom' ? String(preset?.path || '/v1/images/generations').trim() : '',
    key: String(preset?.key || '').trim(),
    model: String(preset?.model || '').trim(),
  };
}

function presetStatusText(p) {
  if (p.status?.text) return p.status.text;
  const ep = presetEndpoint(p);
  return endpointReady(ep) ? '还没测试连接' : '先填地址和 Key，再测试连接 · 拉取模型';
}

/* 方案管理的页面内联状态：改名只开一个输入行，删除只开一条确认，不走弹层；展开哪条预设也只在页内记一下 */
let drawEdit = null;   // { kind: 'scheme' | 'api' | 'preset', id, value }
let drawDel = null;    // { kind: 'scheme' | 'api' | 'preset', id }
let expandedApiId = '';
let expandedPromptId = '';

const drawApp = {
  id: 'draw', name: '绘图', icon: 'image',

  render(ctx) {
    const draw = ensure(ctx.state);
    const cfg = draw.config;
    const image = ctx.state.settings.image;
    const apiPresets = image.presets || [];
    const preset = draw.presets[draw.presetIdx] || draw.presets[0];
    const size = sizeOf(cfg.size);
    const ep = imageEndpoint(ctx.state);
    const ready = endpointReady(ep);
    const scheme = draw.schemes.find(item => item.id === draw.schemeId) || null;
    const schemeDirty = Boolean(scheme && (scheme.apiId !== image.activeId || scheme.promptId !== preset.id));
    const busy = Boolean(draw.busy);

    const schemeOptions = draw.schemes.map((item, index) => ({
      value: item.id, label: item.name || `方案 ${index + 1}`,
    }));
    const apiOptions = apiPresets.map((item, index) => ({
      value: item.id, label: item.name || `接口 ${index + 1}`,
    }));
    const promptOptions = draw.presets.map((item, index) => ({
      value: item.id, label: item.name || `预设 ${index + 1}`,
    }));

    const rows = [
      { act: 'draw-size', label: '尺寸', value: size.label },
      { act: 'draw-steps', label: '步数', value: `${cfg.steps} 步` },
      { act: 'draw-scale', label: '引导', value: `${cfg.scale}` },
      { act: 'draw-sampler', label: '采样器', value: cfg.sampler.replace('k_', '') },
      { act: 'draw-noise', label: '噪声', value: cfg.noise },
      { act: 'draw-seed', label: '种子', value: cfg.seed ? cfg.seed : '随机' },
    ];

    const history = draw.history.slice(0, 6).map((item, index) => `
      <div class="mp-draw-card">
        <div class="mp-draw-img" style="background:${item.tint || TINTS[index % TINTS.length]}"${item.url ? ` data-img="${esc(item.url)}"` : ''}>
          ${item.url ? `<img src="${esc(item.url)}" alt="">` : `<span class="mp-draw-ph">${icon('spark')}<span>演示</span></span>`}
        </div>
        <div class="mp-draw-meta">
          <span>${esc(item.prompt || '没有描述').slice(0, 26)}</span>
          <span class="mp-draw-seed">seed ${esc(String(item.seed))}</span>
        </div>
        <div class="mp-draw-acts">
          <button class="mp-action-btn" data-act="draw-again" data-i="${index}" type="button">${icon('refresh')}<span>再来一张</span></button>
          <button class="mp-action-btn" data-act="draw-del" data-i="${index}" type="button">${icon('trash')}<span>删掉</span></button>
        </div>
      </div>`).join('');

    const apiRows = apiPresets.map(p => {
      const active = p.id === image.activeId;
      const open = p.id === expandedApiId;

      const sub = `${engineLabel(p.engine)} · ${p.model || '未选模型'}`;
      return `
        <div class="mp-api-stack">
          <button class="mp-row mp-api-row${open ? ' is-open' : ''}" data-act="draw-api-toggle" data-id="${p.id}" type="button" aria-expanded="${open}">

              <span class="mp-api-dot ${dot.cls}" title="${esc(dot.text)}" aria-label="${esc(dot.text)}"></span>
