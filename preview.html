<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meme-phone · 界面预览</title>
<style>
html, body { height: 100%; margin: 0; }
body {
  display: grid;
  place-items: center;
  background:
    radial-gradient(90% 70% at 10% 6%, #ffe9f3 0%, transparent 58%),
    radial-gradient(80% 70% at 92% 92%, #e6faf2 0%, transparent 56%),
    linear-gradient(160deg, #fdf9ff, #f4f1fb 52%, #f7fbff);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
/* ==========================================================================
   meme-phone · 界面样式
   晨光粉彩 + 三层玻璃（壁纸 / 磨砂玻璃 / 实色卡片）
   ========================================================================== */

/* ------------------------------------------------------------- 设计变量 */
.mp-root {
  --lav: #8e7bf2;
  --lav-deep: #6a55d8;
  --pink: #f2a0c2;
  --mint: #7fd2bc;
  --honey: #f5c27a;
  --sky: #8fb9f2;

  --text: #2b2937;
  --text-2: rgba(43, 41, 55, .62);
  --text-3: rgba(43, 41, 55, .40);
  --text-4: rgba(43, 41, 55, .26);
  --line: rgba(43, 41, 55, .07);
  --line-soft: rgba(43, 41, 55, .04);

  --page: #fbf9fe;
  --page-2: #f6f3fb;
  --glass: rgba(255, 255, 255, .78);
  --glass-strong: rgba(255, 255, 255, .92);
  --card: #fff;

  --accent: var(--lav);
  --accent-deep: var(--lav-deep);
  --ok: #37b98b;
  --warn: #e9b15c;

  --shadow-s: 0 4px 14px rgba(120, 108, 180, .10);
  --shadow-m: 0 10px 26px rgba(120, 108, 180, .13);
  --shadow-l: 0 22px 50px rgba(120, 108, 180, .20);

  --r-s: 12px;
  --r-m: 18px;
  --r-l: 22px;
  --r-xl: 30px;

  --font-ui: -apple-system, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", SimSun, serif;
  --font-scale: 1;
  --line-scale: 1;
  --font-weight: 400;
  --field-bg: rgba(255, 255, 255, .86);
  --field-solid: #ffffff;
  --field-border: rgba(43, 41, 55, .12);

  --wall-day: linear-gradient(160deg, #fbf7ff 0%, #f2f5fd 48%, #f6faf5 100%);
  --wall-night: linear-gradient(160deg, #191627 0%, #141222 52%, #0f141a 100%);
  --wall-custom: var(--wall-day);
  --wallpaper: var(--wall-day);
}

.mp-root[data-mp-theme="night"] {
  --text: #ece9f7;
  --text-2: rgba(236, 233, 247, .66);
  --text-3: rgba(236, 233, 247, .52);
  --text-4: rgba(236, 233, 247, .32);
  --line: rgba(255, 255, 255, .08);
  --line-soft: rgba(255, 255, 255, .04);

  --page: #14121f;
  --page-2: #100e19;
  --glass: rgba(28, 25, 44, .62);
  --glass-strong: rgba(34, 30, 52, .82);
  --card: rgba(255, 255, 255, .05);
  --field-bg: rgba(255, 255, 255, .10);
  --field-solid: #2b2640;
  --field-border: rgba(255, 255, 255, .16);

  --accent: #a795ff;
  --accent-deep: #8b76f2;

  --shadow-s: 0 4px 14px rgba(0, 0, 0, .28);
  --shadow-m: 0 10px 26px rgba(0, 0, 0, .34);
  --shadow-l: 0 22px 50px rgba(0, 0, 0, .44);

  --wallpaper: var(--wall-night);
}

/* --------------------------------------------------------------- 外壳 */
.mp-overlay {
  position: fixed;
  inset: 0;
  z-index: 100000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  /* 手机壳外完全透明：酒馆自己的背景直接透出来 */
  background: transparent;
  font-family: var(--font-ui);
  color: var(--text);
}

@keyframes mp-fade {
  from { opacity: .001; }
  to { opacity: 1; }
}

.mp-device {
  position: relative;
  width: 390px;
  height: 844px;
  border-radius: 54px;
  padding: 10px;
  background: linear-gradient(160deg, #ffffff, #efeaf8 60%, #ffffff);
  box-shadow:
    0 40px 90px rgba(120, 110, 170, .26),
    0 0 0 1px rgba(255, 255, 255, .9),
    inset 0 0 0 1px rgba(255, 255, 255, .7);
  transform-origin: center;
}

.mp-screen {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 46px;
  overflow: hidden;
  background: var(--page);
  isolation: isolate;
}

/* 壁纸层：只在桌面与页面边缘透出来 */
.mp-wallpaper {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-image: var(--wallpaper);
  background-size: cover;
  background-position: center 18%;
  transform: scale(1.04);
  transition: opacity .3s ease;
}

.mp-scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255, 250, 253, .18) 0%, rgba(255, 255, 255, 0) 26%, rgba(245, 241, 255, .10) 58%, rgba(238, 249, 245, .26) 100%);
}

/* ---------------------------------------------------------- 状态栏 */
.mp-status {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  font-size: calc(14px * var(--font-scale));
  font-weight: 600;
  letter-spacing: .01em;
  color: var(--text);
  pointer-events: none;
}

.mp-island {
  position: absolute;
  top: 12px;
  left: 50%;
  width: 104px;
  height: 30px;
  border-radius: 20px;
  background: #1b1830;
  box-shadow: 0 3px 12px rgba(90, 80, 130, .22);
  transform: translateX(-50%);
}

.mp-status .mp-status-right {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}

.mp-status-left {
  display: flex;
  align-items: center;
  min-width: 34px;
}

.mp-status-back {
  pointer-events: auto;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 12px;
  background: rgba(255, 255, 255, .58);
  color: var(--accent-deep);
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .78), var(--shadow-s);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.mp-status-back:active { transform: scale(.94); }
.mp-status .mp-status-back .mp-i { width: 19px; height: 19px; }

/* 返回键统一放到状态栏左边，页面里的旧返回键不再重复显示 */
.mp-nav .mp-back[data-act="back"],
.mp-thread-head .mp-back[data-act="back"],
.mp-root .mp-back[data-act="back"] { display: none; }

/* 返回键改到状态栏后，聊天页头像让出左上角的位置 */
.mp-thread-head { padding-left: 52px; }

/* 顶部中间：拖动手机壳 */
.mp-drag-handle {
  position: absolute;
  top: 6px;
  left: 50%;
  width: 128px;
  height: 42px;
  z-index: 46;
  transform: translateX(-50%);
  border-radius: 24px;
  cursor: grab;
  touch-action: none;
}
.mp-drag-handle:active { cursor: grabbing; }
.mp-device.is-dragging { transition: none; }
.mp-device { transition: transform .26s cubic-bezier(.22, .68, .38, 1); will-change: transform; }

/* ------------------------------------------------------------- 桌面 */
.mp-desktop {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  padding: 54px 18px 16px;
  overflow: hidden;
}

.mp-widget {
  position: relative;
  flex: 0 0 auto;
  border-radius: var(--r-xl);
  padding: 17px 18px 14px;
  background: linear-gradient(168deg, rgba(255, 255, 255, .86), rgba(255, 255, 255, .58));
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  box-shadow: 0 18px 42px rgba(120, 108, 180, .16), inset 0 0 0 1px rgba(255, 255, 255, .78);
  cursor: pointer;
  transition: transform .22s cubic-bezier(.22, .68, .38, 1);
}

.mp-widget:active { transform: scale(.985); }

.mp-widget-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.mp-clock {
  font-size: calc(46px * var(--font-scale));
  line-height: calc(1 * var(--line-scale));
  font-weight: 600;
  letter-spacing: -.05em;
  color: var(--text);
}

.mp-date {
  text-align: right;
  font-size: calc(12px * var(--font-scale));
  line-height: calc(1.55 * var(--line-scale));
  color: var(--text-3);
  padding-top: 3px;
}

.mp-di-card {
  margin-top: 13px;
  padding: 11px 12px 10px;
  border-radius: 16px;
  background: rgba(255, 255, 255, .68);
  border: 1px solid rgba(255, 255, 255, .76);
}

.mp-di-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: calc(11px * var(--font-scale));
  letter-spacing: .02em;
  color: var(--text-3);
  margin-bottom: 6px;
}

.mp-di-text {
  font-family: var(--font-serif);
  font-size: calc(13.5px * var(--font-scale));
  line-height: calc(1.62 * var(--line-scale));
  color: var(--text-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.mp-recent {
  margin-top: 9px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.mp-recent .mp-avatar {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  font-size: calc(12px * var(--font-scale));
}

.mp-recent-body { flex: 1; min-width: 0; }

.mp-recent-name {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: calc(12.5px * var(--font-scale));
  font-weight: 600;
  color: var(--text);
}

.mp-recent-msg {
  font-size: calc(11.5px * var(--font-scale));
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

/* ------------------------------------------------------ 桌面资料卡 */
.mp-profile {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 0 0 auto;
  width: 100%;
  padding: 0 0 12px;
  border: 0;
  border-radius: 28px;
  overflow: hidden;
  color: inherit;
  font: inherit;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
  background: linear-gradient(168deg, rgba(255, 255, 255, .96), rgba(255, 255, 255, .86));
  backdrop-filter: blur(24px) saturate(155%);
  -webkit-backdrop-filter: blur(24px) saturate(155%);
  box-shadow: 0 18px 40px rgba(120, 108, 180, .16), inset 0 0 0 1px rgba(255, 255, 255, .86);
  transition: transform .22s cubic-bezier(.22, .68, .38, 1);
}

.mp-profile-banner { cursor: pointer; }

.mp-profile-banner {
  position: relative;
  display: block;
  width: 100%;
  height: 86px;
  overflow: hidden;
  background:
    radial-gradient(110% 150% at 8% 0%, rgba(255, 190, 218, .94), transparent 58%),
    radial-gradient(110% 140% at 100% 10%, rgba(188, 226, 255, .9), transparent 62%),
    linear-gradient(135deg, #ffe3ef, #e8e1ff 52%, #ddf7ee);
}

.mp-profile-banner::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--wall-custom, none);
  background-size: cover;
  background-position: center;
  opacity: .42;
  filter: saturate(1.08);
}

.mp-profile-banner::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, .26), transparent 40%, rgba(255, 255, 255, .34));
}

.mp-profile-stamp {
  position: absolute;
  z-index: 2;
  top: 10px;
  right: 12px;
  padding: 4px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .62);
  color: rgba(48, 42, 72, .62);
  font-size: calc(10.5px * var(--font-scale));
  font-weight: 500;
  white-space: nowrap;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.mp-profile-avatar {
  position: relative;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  margin: -32px auto 0;
  cursor: pointer;
  color: #fff;
  font-size: calc(21px * var(--font-scale));
  font-weight: 600;
  text-transform: uppercase;
  border: 2.5px solid rgba(255, 255, 255, .96);
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  box-shadow: 0 8px 18px rgba(95, 80, 140, .2), inset 0 0 0 1px rgba(255, 255, 255, .3);
}

.mp-profile-avatar.is-empty {
  background: linear-gradient(150deg, #b9c8f2, #cdb7ef);
  color: #fff;
}

.mp-profile-name {
  position: relative;
  z-index: 2;
  margin-top: 6px;
  color: var(--text);
  font-size: calc(16.5px * var(--font-scale));
  font-weight: 650;
  letter-spacing: -.01em;
}

.mp-profile-handle {
  position: relative;
  z-index: 2;
  margin-top: 0;
  color: var(--text-3);
  font-size: calc(10.5px * var(--font-scale));
}

.mp-profile-banner.is-custom::before { display: none; }

.mp-profile-bio {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  max-width: 300px;
  margin-top: 5px;
  padding: 3px 10px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--text-2);
  font: inherit;
  font-size: calc(12px * var(--font-scale));
  line-height: calc(1.45 * var(--line-scale));
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.mp-profile-bio > span {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.mp-profile-bio .mp-i {
  width: 12px;
  height: 12px;
  flex: 0 0 auto;
  opacity: .55;
}

.mp-profile-bio:active { background: rgba(255, 255, 255, .5); }

.mp-profile-bio-edit {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 6px;
  width: calc(100% - 32px);
  margin-top: 6px;
}

.mp-profile-bio-input {
  flex: 1;
  min-width: 0;
  height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 10px;
  background: rgba(255, 255, 255, .78);
  box-shadow: inset 0 0 0 1px rgba(140, 130, 190, .2);
  color: var(--text);
  font: inherit;
  font-size: calc(12px * var(--font-scale));
}

.mp-profile-mini {
  flex: 0 0 auto;
  height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 10px;
  background: rgba(255, 255, 255, .7);
  color: var(--text-2);
  font: inherit;
  font-size: calc(11.5px * var(--font-scale));
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(140, 130, 190, .16);
}

.mp-profile-mini.is-primary {
  background: linear-gradient(150deg, #9583f2, #7f6ce9);
  color: #fff;
  box-shadow: 0 6px 14px rgba(140, 116, 224, .24);
}


.mp-profile-loc {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .62);
  color: var(--text-3);
  font-size: calc(10px * var(--font-scale));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .58);
}

.mp-profile-loc .mp-i { width: 12px; height: 12px; }

/* ------------------------------------------------------ 桌面小部件条 */
.mp-widget-strip {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.mp-mini-widget {
  min-width: 0;
  padding: 10px 12px 11px;
  border: 0;
  border-radius: 20px;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  background: linear-gradient(160deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, .56));
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  box-shadow: 0 10px 24px rgba(120, 108, 180, .12), inset 0 0 0 1px rgba(255, 255, 255, .74);
  transition: transform .2s cubic-bezier(.22, .68, .38, 1);
}

.mp-mini-widget:active { transform: scale(.97); }

.mp-mini-head {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--text-3);
  font-size: calc(10.5px * var(--font-scale));
  letter-spacing: .01em;
}

.mp-mini-head .mp-i { width: 13px; height: 13px; }

.mp-mini-main {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 7px;
  min-width: 0;
}

.mp-mini-avatar {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  border-radius: 9px;
  background-size: cover;
  background-position: center;
  color: #fff;
  font-size: calc(10px * var(--font-scale));
  font-weight: 600;
}

.mp-mini-copy { display: flex; flex-direction: column; min-width: 0; gap: 1px; }

.mp-mini-name {
  color: var(--text);
  font-size: calc(12px * var(--font-scale));
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mp-mini-msg
.mp-mini-empty {
  color: var(--text-3);
  font-size: calc(11px * var(--font-scale));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mp-mini-empty { display: block; margin-top: 9px; }

.mp-mini-text {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 6px;
  color: var(--text-2);
  font-size: calc(11.5px * var(--font-scale));
  line-height: calc(1.45 * var(--line-scale));
}

/* ------------------------------------------------------ 桌面图标网格 */
.mp-apps {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  justify-items: center;
  align-content: start;
  row-gap: 8px;
  padding: 14px 0 0;
  overflow-y: auto;
  scrollbar-width: none;
}

.mp-apps::-webkit-scrollbar { display: none; }

.mp-app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  color: inherit;
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}

.mp-app .mp-tile {
  position: relative;
  width: 58px;
  height: 58px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 18px rgba(120, 110, 170, .22), inset 0 0 0 1px rgba(255, 255, 255, .55);
  transition: transform .18s cubic-bezier(.22, .68, .38, 1);
}

.mp-app .mp-tile::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .36), rgba(255, 255, 255, 0) 46%);
}

.mp-app .mp-tile .mp-i {
  position: relative;
  z-index: 1;
  width: 25px;
  height: 25px;
  color: #fff;
  filter: drop-shadow(0 1px 1px rgba(90, 70, 120, .18));
}

.mp-app:active .mp-tile { transform: scale(.93); }

.mp-app .mp-app-label {
  font-size: calc(11px * var(--font-scale));
  font-weight: 500;
  color: var(--text);
  text-shadow: 0 1px 0 rgba(255, 255, 255, .45);
}

.mp-app .mp-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 9px;
  background: #ff7a8a;
  color: #fff;
  font-size: calc(10px * var(--font-scale));
  font-weight: 600;
  line-height: 17px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(255, 90, 120, .35);
  z-index: 2;
}

/* --------------------------------------------------------------- Dock */
.mp-dock {
  flex: 0 0 auto;
  margin-top: 12px;
  padding: 9px 10px;
  border-radius: 26px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .88), rgba(246, 242, 255, .70));
  backdrop-filter: blur(26px) saturate(160%);
  -webkit-backdrop-filter: blur(26px) saturate(160%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .92), 0 16px 34px rgba(120, 108, 180, .22);
}

.mp-dock .mp-app .mp-tile {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  box-shadow: 0 6px 14px rgba(120, 110, 170, .20), inset 0 0 0 1px rgba(255, 255, 255, .5);
}

.mp-dock .mp-app .mp-app-label { display: none; }

.mp-home-bar {
  position: absolute;
  bottom: 7px;
  left: 50%;
  width: 118px;
  height: 4px;
  border-radius: 3px;
  background: rgba(43, 41, 55, .26);
  transform: translateX(-50%);
  z-index: 40;
  cursor: pointer;
}

/* --------------------------------------------------------- 页面通用 */
.mp-page {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, rgba(251, 249, 254, .955), rgba(246, 243, 251, .97));
  backdrop-filter: blur(26px) saturate(130%);
  -webkit-backdrop-filter: blur(26px) saturate(130%);
}

@keyframes mp-in {
  from { transform: translateX(12px) scale(.99); }
  to { transform: none; }
}

.mp-nav {
  flex: 0 0 auto;
  height: 52px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}

.mp-page-body {
  padding-bottom: 14px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 18px 26px;
  scrollbar-width: none;
}

.mp-page-body::-webkit-scrollbar { display: none; }

.mp-title {
  font-size: calc(31px * var(--font-scale));
  font-weight: 600;
  letter-spacing: -.038em;
  line-height: calc(1.16 * var(--line-scale));
  margin: 2px 0 3px;
}

.mp-subtitle {
  font-size: calc(12px * var(--font-scale));
  color: var(--text-3);
  margin-bottom: 16px;
}

.mp-icon-btn {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 0;
  background: rgba(255, 255, 255, .82);
  color: var(--text);
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .9), var(--shadow-s);
}

.mp-icon-btn .mp-i { width: 18px; height: 18px; }
.mp-icon-btn:active { transform: scale(.94); }

/* 顶部返回栏 */
.mp-back {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 6px 10px 6px 4px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--accent-deep);
  font-size: calc(14px * var(--font-scale));
  cursor: pointer;
}

.mp-back .mp-i { width: 19px; height: 19px; }

/* ------------------------------------------------------------- 列表 */
.mp-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 14px;
  border-radius: var(--r-m);
  background: var(--card);
  box-shadow: var(--shadow-s);
  cursor: pointer;
  border: 0;
  width: 100%;
  text-align: left;
  color: inherit;
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}

.mp-row:active { transform: scale(.988); }
.mp-row + .mp-row { margin-top: 8px; }

.mp-row-main { flex: 1; min-width: 0; }

.mp-row-name {
  font-size: calc(14.5px * var(--font-scale));
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.mp-row-sub {
  display: block;
  font-size: calc(11.5px * var(--font-scale));
  color: var(--text-3);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mp-row-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  font-size: calc(11px * var(--font-scale));
  color: var(--text-3);
}

.mp-avatar {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: calc(14px * var(--font-scale));
  font-weight: 600;
  color: #fff;
  background: linear-gradient(150deg, var(--lav), var(--lav-deep));
  text-shadow: 0 1px 2px rgba(60, 40, 90, .2);
  overflow: hidden;
  background-size: cover;
  background-position: center;
}

.mp-avatar.lg { width: 64px; height: 64px; border-radius: 20px; font-size: calc(20px * var(--font-scale)); }

.mp-dot {
  width: 6px;
  height: 6px;
  border-radius: 3px;
  background: var(--ok);
  flex: 0 0 auto;
}

.mp-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 9px;
  font-size: calc(10.5px * var(--font-scale));
  font-weight: 500;
  background: rgba(142, 123, 242, .10);
  color: var(--accent-deep);
  border: 1px solid rgba(142, 123, 242, .22);
}

.mp-pill.mint { background: rgba(127, 210, 188, .16); color: #1c8f70; border-color: rgba(127, 210, 188, .38); }
.mp-pill.pink { background: rgba(242, 160, 194, .16); color: #c55e88; border-color: rgba(242, 160, 194, .38); }
.mp-pill.plain { background: rgba(43, 41, 55, .05); color: var(--text-2); border-color: transparent; }

.mp-badge-count {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--accent);
  color: #fff;
  font-size: calc(10.5px * var(--font-scale));
  font-weight: 600;
  line-height: 18px;
  text-align: center;
}

/* 聊天设置页头：这个会话是谁，现在是什么状态 */
.mp-chat-set-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 14px;
  border-radius: var(--r-l);
  background: rgba(255, 255, 255, .82);
  box-shadow: var(--shadow-s);
}

.mp-chat-set-head .mp-avatar {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  font-size: calc(15px * var(--font-scale));
}

.mp-chat-set-main { flex: 1; min-width: 0; }

.mp-chat-set-name {
  font-size: calc(15px * var(--font-scale));
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mp-chat-set-sub {
  margin-top: 3px;
  font-size: calc(10.5px * var(--font-scale));
  line-height: calc(1.5 * var(--line-scale));
  color: var(--text-4);
}

.mp-set-row.is-danger .mp-set-name { color: #b75a73; }
.mp-set-row.is-danger .mp-set-ico {
  color: #b75a73;
  background: rgba(216, 106, 134, .10);
}

.mp-root[data-mp-theme="night"] .mp-chat-set-head {
  background: rgba(48, 43, 68, .72);
}

.mp-root[data-mp-theme="night"] .mp-set-row.is-danger .mp-set-name { color: #ee9bb1; }
.mp-root[data-mp-theme="night"] .mp-set-row.is-danger .mp-set-ico {
  color: #ee9bb1;
  background: rgba(238, 155, 177, .12);
}

/* ------------------------------------------------------------ 会话页 */
.mp-thread {
  position: absolute;
  inset: 0;
  z-index: 21;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, rgba(252, 250, 255, .96), rgba(248, 245, 253, .97));
  backdrop-filter: blur(28px) saturate(130%);
  -webkit-backdrop-filter: blur(28px) saturate(130%);
}

.mp-thread-head {
  flex: 0 0 auto;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line-soft);
}

.mp-thread-head .mp-avatar { width: 32px; height: 32px; border-radius: 11px; font-size: calc(12px * var(--font-scale)); }

.mp-thread-name { font-size: calc(15px * var(--font-scale)); font-weight: 600; }
.mp-thread-status {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: calc(10.5px * var(--font-scale));
  color: var(--text-3);
  margin-top: 1px;
}

.mp-messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  scrollbar-width: none;
}

.mp-messages::-webkit-scrollbar { display: none; }

.mp-time {
  text-align: center;
  font-size: calc(10.5px * var(--font-scale));
  color: var(--text-4);
  margin: 6px 0 2px;
}

.mp-sys {
  align-self: center;
  font-size: calc(10.5px * var(--font-scale));
  color: var(--text-3);
  background: rgba(43, 41, 55, .04);
  padding: 3px 10px;
  border-radius: 9px;
}

.mp-msg {
  display: flex;
  gap: 8px;
  max-width: 84%;
}

.mp-msg.me { align-self: flex-end; flex-direction: row-reverse; }
.mp-msg .mp-avatar { width: 28px; height: 28px; border-radius: 9px; font-size: calc(11px * var(--font-scale)); margin-top: 2px; }

.mp-avatar-btn {
  flex: none;
  margin: -4px;
  padding: 4px;
  border: 0;
  border-radius: 13px;
  background: none;
  line-height: calc(0 * var(--line-scale));
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.mp-avatar-btn .mp-avatar { margin-top: 0; }
.mp-avatar-btn:active .mp-avatar { transform: scale(.94); }

.mp-msg-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mp-msg.me .mp-msg-body { align-items: flex-end; }

.mp-bubble {
  padding: 9px 13px;
  border-radius: var(--r-m);
  font-size: calc(13.5px * var(--font-scale));
  line-height: calc(1.6 * var(--line-scale));
  background: #fff;
  border: 1px solid rgba(142, 123, 242, .12);
  box-shadow: var(--shadow-s);
  word-break: break-word;
  white-space: pre-wrap;
  user-select: none;
  cursor: default;
}

.mp-msg.me .mp-bubble {
  background: linear-gradient(150deg, #8f7cf0, #b283e8);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 8px 18px rgba(140, 116, 224, .26);
}

/* 照片、大表情、转发：都是气泡，但长得不一样 */
.mp-bubble-photo {
  padding: 0;
  border: 0;
  background: transparent;
  box-shadow: none;
  line-height: 0;
  overflow: hidden;
  cursor: pointer;
}
.mp-msg.me .mp-bubble-photo { background: transparent; box-shadow: none; }
.mp-bubble-photo img {
  display: block;
  max-width: 168px;
  max-height: 220px;
  border-radius: var(--r-m);
  box-shadow: var(--shadow-s);
}

.mp-bubble-emoji {
  padding: 2px 4px;
  border: 0;
  background: transparent;
  box-shadow: none;
  font-size: calc(38px * var(--font-scale));
  line-height: 1.15;
}
.mp-msg.me .mp-bubble-emoji { background: transparent; box-shadow: none; }

.mp-bubble-forward { min-width: 178px; }
.mp-forward-head {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 4px;
  font-size: calc(9.5px * var(--font-scale));
  color: var(--text-4);
}
.mp-forward-head .mp-i { width: 12px; height: 12px; }
.mp-forward-text { white-space: pre-wrap; word-break: break-word; }
.mp-forward-src {
  margin-top: 5px;
  font-size: calc(9.5px * var(--font-scale));
  color: var(--text-4);
}
.mp-msg.me .mp-forward-head,
.mp-msg.me .mp-forward-src { color: rgba(255, 255, 255, .78); }
.mp-msg.me .mp-forward-text { color: #fff; }

.mp-sys.is-poke,
.mp-sys.is-recall {
  background: transparent;
  font-size: calc(10px * var(--font-scale));
  color: var(--text-4);
}

/* 看大图 */
.mp-photo-page { display: flex; flex-direction: column; gap: 10px; height: 100%; }
.mp-photo-full {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 8px;
  border-radius: var(--r-m);
  background: rgba(43, 41, 55, .05);
}
.mp-photo-full img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; }
.mp-photo-bar { display: flex; justify-content: center; padding-bottom: 6px; }

.mp-quote {
  display: block;
  margin-bottom: 6px;
  padding: 5px 8px;
  border-radius: 10px;
  border-left: 2px solid rgba(142, 123, 242, .4);
  background: rgba(142, 123, 242, .08);
  font-size: calc(11.5px * var(--font-scale));
  line-height: calc(1.5 * var(--line-scale));
  color: var(--text-2);
}

.mp-msg.me .mp-quote {
  background: rgba(255, 255, 255, .18);
  border-left-color: rgba(255, 255, 255, .55);
  color: rgba(255, 255, 255, .86);
}

.mp-msg-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: calc(9.5px * var(--font-scale));
  color: var(--text-4);
}

.mp-tag-proactive {
  color: #1c8f70;
  background: rgba(127, 210, 188, .18);
  border: 1px solid rgba(127, 210, 188, .38);
  border-radius: 7px;
  padding: 0 5px;
  font-size: calc(9px * var(--font-scale));
}

.mp-typing {
  display: inline-flex;
  gap: 3px;
  padding: 10px 13px;
  background: #fff;
  border-radius: var(--r-m);
  box-shadow: var(--shadow-s);
}

.mp-typing i {
  width: 5px;
  height: 5px;
  border-radius: 3px;
  background: var(--text-3);
  animation: mp-blink 1.1s infinite;
}

.mp-typing i:nth-child(2) { animation-delay: .18s; }
.mp-typing i:nth-child(3) { animation-delay: .36s; }

@keyframes mp-blink {
  0% 60% 100% { opacity: .25; }
  30% { opacity: 1; }
}

/* 输入区 */
.mp-composer {
  flex: 0 0 auto;
  padding: 8px 12px 20px;
  border-top: 1px solid var(--line-soft);
  background: rgba(252, 250, 255, .82);
}

.mp-composer-tip {
  text-align: center;
  font-size: calc(10px * var(--font-scale));
  color: var(--text-4);
  margin-bottom: 6px;
}

.mp-composer-row {
  display: flex;
  align-items: flex-end;
  gap: 7px;
}

.mp-compose-box {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px 7px 12px;
  border-radius: 21px;
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--line), var(--shadow-s);
}

.mp-compose-box input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: none;
  font: inherit;
  font-size: calc(13.5px * var(--font-scale));
  color: var(--text);
}

.mp-compose-box input::placeholder { color: var(--text-4); }

.mp-sq-btn {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 12px;
  cursor: pointer;
  background: rgba(43, 41, 55, .05);
  color: var(--text-2);
  transition: transform .16s ease, background .2s ease, color .2s ease;
}

.mp-sq-btn:active { transform: scale(.92); }
.mp-sq-btn .mp-i { width: 18px; height: 18px; }

.mp-send {
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 19px;
  cursor: pointer;
  background: rgba(43, 41, 55, .06);
  color: var(--text-3);
  transition: transform .16s ease, background .24s ease, color .24s ease, box-shadow .24s ease;
}

.mp-send .mp-i { width: 19px; height: 19px; }
.mp-send:active { transform: scale(.92); }

/* 有文字：紫罗兰渐变 */
.mp-send.is-text {
  background: linear-gradient(150deg, #9a86f5, #7f6ce9);
  color: #fff;
  box-shadow: 0 8px 18px rgba(140, 116, 224, .30);
}

/* 空输入：薄荷「唤醒」态 */
.mp-send.is-wake {
  background: rgba(127, 210, 188, .22);
  color: #1c8f70;
  box-shadow: inset 0 0 0 1px rgba(127, 210, 188, .45);
}

.mp-quote-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  padding: 6px 8px 6px 10px;
  border-radius: 12px;
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--line);
  font-size: calc(11.5px * var(--font-scale));
  color: var(--text-2);
}

.mp-quote-chip .mp-quote-chip-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ------------------------------------------------------------ 日记页 */
.mp-diary-hero {
  padding: 14px 15px;
  border-radius: var(--r-l);
  background: #fff;
  box-shadow: var(--shadow-m);
  margin-bottom: 14px;
}

.mp-diary-hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.mp-diary-hero-date { font-size: calc(12px * var(--font-scale)); color: var(--text-3); }
.mp-diary-hero-text {
  font-family: var(--font-serif);
  font-size: calc(13.5px * var(--font-scale));
  line-height: calc(1.78 * var(--line-scale));
  color: var(--text);
  white-space: pre-wrap;
}

.mp-diary-empty { color: var(--text-3); font-size: calc(12.5px * var(--font-scale)); line-height: calc(1.7 * var(--line-scale)); }

.mp-month-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.mp-month-bar .mp-month { font-size: calc(14px * var(--font-scale)); font-weight: 600; }

.mp-cal {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-bottom: 14px;
}

.mp-cal .mp-wd {
  text-align: center;
  font-size: calc(10px * var(--font-scale));
  color: var(--text-4);
  padding-bottom: 2px;
}

.mp-cal button {
  position: relative;
  aspect-ratio: 1;
  border: 0;
  background: none;
  border-radius: 11px;
  font: inherit;
  font-size: calc(12px * var(--font-scale));
  color: var(--text-3);
  cursor: pointer;
}

.mp-cal button.today { color: var(--text); font-weight: 600; }
.mp-cal button.has { color: var(--text); }
.mp-cal button.sel { background: rgba(142, 123, 242, .14); color: var(--accent-deep); font-weight: 600; }
.mp-cal button .mark {
  position: absolute;
  bottom: 5px;
  left: 50%;
  width: 3.5px;
  height: 3.5px;
  border-radius: 2px;
  background: var(--pink);
  transform: translateX(-50%);
}

.mp-diary-card {
  padding: 14px 15px;
  border-radius: var(--r-l);
  background: #fff;
  box-shadow: var(--shadow-s);
  margin-bottom: 10px;
}

.mp-diary-card .mp-diary-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.mp-diary-tags { display: flex; gap: 5px; flex-wrap: wrap; }

/* ------------------------------------------------------------ 设置页 */
.mp-group {
  margin-bottom: 14px;
}

.mp-group-label {
  font-size: calc(11px * var(--font-scale));
  color: var(--text-4);
  padding: 0 6px 7px;
  letter-spacing: .04em;
}

.mp-group-box {
  border-radius: var(--r-l);
  background: #fff;
  box-shadow: var(--shadow-s);
  overflow: hidden;
}

.mp-set-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 14px;
  cursor: pointer;
  border: 0;
  background: none;
  width: 100%;
  text-align: left;
  color: inherit;
  font: inherit;
}

.mp-set-row + .mp-set-row { border-top: 1px solid var(--line-soft); }
.mp-set-row:active { background: rgba(142, 123, 242, .05); }

.mp-set-ico {
  width: 28px;
  height: 28px;
  flex: 0 0 auto;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: rgba(142, 123, 242, .10);
  color: var(--accent-deep);
}

.mp-set-ico .mp-i { width: 16px; height: 16px; }

.mp-set-name { flex: 1; min-width: 0; font-size: calc(13.5px * var(--font-scale)); }
.mp-set-name small { display: block; font-size: calc(10.5px * var(--font-scale)); color: var(--text-4); margin-top: 1px; }
.mp-set-value { font-size: calc(12px * var(--font-scale)); color: var(--text-3); }

.mp-switch {
  position: relative;
  width: 51px;
  height: 31px;
  flex: 0 0 auto;
  border: 0;
  border-radius: 16px;
  background: #e9e9ea;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .04);
  cursor: pointer;
  transition: background .25s ease;
}

.mp-switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 3px 7px rgba(0, 0, 0, .16), 0 1px 1px rgba(0, 0, 0, .1);
  transition: transform .25s cubic-bezier(.3, .7, .4, 1);
}

.mp-switch.on { background: #34c759; }
.mp-switch.on::after { transform: translateX(20px); }

.mp-root[data-mp-theme="night"] .mp-switch { background: #39393d; }
.mp-root[data-mp-theme="night"] .mp-switch.on { background: #34c759; }

/* ------------------------------------------------------- 通用卡片/按钮 */
.mp-card {
  border-radius: var(--r-l);
  background: #fff;
  box-shadow: var(--shadow-s);
  padding: 14px 15px;
  margin-bottom: 10px;
}

.mp-card-title {
  font-size: calc(13px * var(--font-scale));
  font-weight: 600;
  color: var(--text);
  line-height: calc(1.4 * var(--line-scale));
}

.mp-card-sub {
  margin-top: 4px;
  font-size: calc(12px * var(--font-scale));
  line-height: calc(1.65 * var(--line-scale));
  color: var(--text-3);
}

.mp-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 15px;
  border: 0;
  border-radius: 14px;
  background: #fff;
  color: var(--text);
  font: inherit;
  font-size: calc(12.5px * var(--font-scale));
  font-weight: 500;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--line), var(--shadow-s);
}

.mp-btn .mp-i { width: 15px; height: 15px; }
.mp-btn:active { transform: scale(.97); }

.mp-btn.accent {
  background: linear-gradient(150deg, #9583f2, #7f6ce9);
  color: #fff;
  box-shadow: 0 8px 18px rgba(140, 116, 224, .26);
}

.mp-btn.ghost { background: rgba(255, 255, 255, .7); box-shadow: inset 0 0 0 1px var(--line); }

.mp-seg {
  display: inline-flex;
  padding: 3px;
  border-radius: 13px;
  background: rgba(43, 41, 55, .05);
}

.mp-seg button {
  border: 0;
  background: none;
  font: inherit;
  font-size: calc(11.5px * var(--font-scale));
  color: var(--text-3);
  padding: 5px 12px;
  border-radius: 10px;
  cursor: pointer;
}

.mp-seg button.on { background: #fff; color: var(--accent-deep); box-shadow: var(--shadow-s); }

.mp-root[data-mp-theme="night"] .mp-seg { background: rgba(255, 255, 255, .06); }
.mp-root[data-mp-theme="night"] .mp-seg button { color: var(--text-3); }
.mp-root[data-mp-theme="night"] .mp-seg button.on {
  background: rgba(255, 255, 255, .14);
  color: var(--text);
  box-shadow: var(--shadow-s);
}

/* 空态 */
.mp-empty {
  padding: 40px 0;
  text-align: center;
  color: var(--text-3);
  font-size: calc(12.5px * var(--font-scale));
  line-height: calc(1.8 * var(--line-scale));
}

/* ---------------------------------------------------------- 弹层/提示 */
.mp-mask {
  position: absolute;
  inset: 0;
  z-index: 60;
  background: rgba(58, 50, 88, .32);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  animation: mp-fade .2s ease;
}

.mp-sheet {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 8px;
  z-index: 61;
  border-radius: 26px;
  padding: 10px;
  background: rgba(255, 255, 255, .94);
  backdrop-filter: blur(30px) saturate(150%);
  -webkit-backdrop-filter: blur(30px) saturate(150%);
  box-shadow: 0 22px 50px rgba(90, 80, 130, .28), inset 0 0 0 1px rgba(255, 255, 255, .9);
  animation: mp-sheet .26s cubic-bezier(.2, .8, .3, 1);
  max-height: calc(100% - 16px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* 弹层内部重渲染时不要再播放入场动画，否则会闪一下 */
.mp-mask.is-still,
.mp-sheet.is-still {
  animation: none;
}

@keyframes mp-sheet {
  from { transform: translateY(22px); opacity: .4; }
  to { transform: none; opacity: 1; }
}

.mp-sheet-title {
  font-size: calc(11.5px * var(--font-scale));
  color: var(--text-3);
  text-align: center;
  padding: 4px 0 8px;
}

.mp-sheet-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 13px 12px;
  border: 0;
  border-radius: 16px;
  background: none;
  color: inherit;
  font: inherit;
  font-size: calc(13.5px * var(--font-scale));
  cursor: pointer;
  text-align: left;
}

.mp-sheet-item .mp-i { width: 18px; height: 18px; color: var(--text-2); }
.mp-sheet-item:active { background: rgba(142, 123, 242, .06); }
.mp-sheet-item.danger { color: #d0526b; }
.mp-sheet-item.danger .mp-i { color: #d0526b; }

.mp-sheet-cancel {
  margin-top: 6px;
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 16px;
  background: rgba(255, 255, 255, .9);
  font: inherit;
  font-size: calc(14px * var(--font-scale));
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--line);
}

.mp-sheet-form { display: grid; gap: 10px; }
.mp-sheet-field { display: grid; gap: 5px; }
.mp-sheet-field-label { font-size: calc(11.5px * var(--font-scale)); color: var(--text-3); padding-left: 3px; }
.mp-sheet-field-hint { font-size: calc(10.5px * var(--font-scale)); color: var(--text-4); padding-left: 3px; }
.mp-sheet-input {
  width: 100%;
  box-sizing: border-box;
  border-radius: 14px;
  border: 1px solid var(--field-border);
  background: var(--field-solid);
  color: var(--text);
  font: inherit;
  font-size: calc(14px * var(--font-scale));
  padding: 11px 12px;
  outline: none;
}
.mp-sheet-select { padding: 11px 36px 11px 12px; }
.mp-sheet-form-textarea { height: 116px; }
.mp-sheet-checks {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 2px 0;
}
.mp-sheet-check {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 9px;
  border-radius: 11px;
  border: 1px solid var(--field-border);
  background: var(--field-solid);
  color: var(--text);
  font-size: calc(12px * var(--font-scale));
  cursor: pointer;
}
.mp-sheet-check input {
  width: 13px;
  height: 13px;
  accent-color: var(--accent);
  margin: 0;
}
.mp-sheet-check span { max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.mp-toast {
  position: absolute;
  left: 50%;
  top: 58px;
  z-index: 80;
  max-width: 78%;
  padding: 9px 15px;
  border-radius: 14px;
  background: rgba(43, 39, 60, .88);
  color: #fff;
  font-size: calc(12px * var(--font-scale));
  line-height: calc(1.5 * var(--line-scale));
  text-align: center;
  transform: translateX(-50%);
  box-shadow: 0 10px 26px rgba(0, 0, 0, .24);
  animation: mp-toast .22s ease;
  pointer-events: none;
}

@keyframes mp-toast {
  from { opacity: .2; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* ------------------------------------------------------------ 夜间模式 */
.mp-root[data-mp-theme="night"] .mp-page,
.mp-root[data-mp-theme="night"] .mp-thread {
  background: linear-gradient(180deg, rgba(22, 19, 35, .92), rgba(16, 14, 26, .96));
  backdrop-filter: blur(26px) saturate(120%);
}

.mp-root[data-mp-theme="night"] .mp-widget {
  background: linear-gradient(168deg, rgba(44, 38, 68, .72), rgba(30, 26, 48, .54));
  box-shadow: 0 18px 42px rgba(0, 0, 0, .42), inset 0 0 0 1px rgba(255, 255, 255, .10);
}

.mp-root[data-mp-theme="night"] .mp-profile {
  background: linear-gradient(168deg, rgba(44, 38, 68, .9), rgba(30, 26, 48, .78));
  box-shadow: 0 18px 42px rgba(0, 0, 0, .42), inset 0 0 0 1px rgba(255, 255, 255, .10);
}

.mp-root[data-mp-theme="night"] .mp-profile-banner {
  background:
    radial-gradient(110% 150% at 8% 0%, rgba(129, 86, 136, .9), transparent 58%),
    radial-gradient(110% 140% at 100% 10%, rgba(73, 102, 145, .88), transparent 62%),
    linear-gradient(135deg, #3a2946, #2c2a53 52%, #1f3a3d);
}

.mp-root[data-mp-theme="night"] .mp-profile-stamp,
.mp-root[data-mp-theme="night"] .mp-profile-loc {
  background: rgba(255, 255, 255, .08);
  color: rgba(236, 233, 247, .62);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .10);
}

.mp-root[data-mp-theme="night"] .mp-mini-widget {
  background: linear-gradient(160deg, rgba(44, 38, 66, .74), rgba(30, 26, 48, .58));
  box-shadow: 0 10px 24px rgba(0, 0, 0, .34), inset 0 0 0 1px rgba(255, 255, 255, .10);
}

.mp-root[data-mp-theme="night"] .mp-di-card { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .08); }
.mp-root[data-mp-theme="night"] .mp-dock { background: linear-gradient(180deg, rgba(44, 38, 66, .7), rgba(26, 22, 42, .62)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .10), 0 16px 34px rgba(0, 0, 0, .4); }
.mp-root[data-mp-theme="night"] .mp-row,
.mp-root[data-mp-theme="night"] .mp-group-box,
.mp-root[data-mp-theme="night"] .mp-card,
.mp-root[data-mp-theme="night"] .mp-diary-hero,
.mp-root[data-mp-theme="night"] .mp-diary-card { background: rgba(255, 255, 255, .055); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
.mp-root[data-mp-theme="night"] .mp-bubble { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .08); color: var(--text); }
.mp-root[data-mp-theme="night"] .mp-msg.me .mp-bubble { background: linear-gradient(150deg, #6f5fd0, #8f68c8); }
.mp-root[data-mp-theme="night"] .mp-extra-source { background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
.mp-root[data-mp-theme="night"] .mp-compose-box { background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
.mp-root[data-mp-theme="night"] .mp-send { background: rgba(255, 255, 255, .08); }
.mp-root[data-mp-theme="night"] .mp-icon-btn { background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
.mp-root[data-mp-theme="night"] .mp-app .mp-app-label { color: #ece9f7; text-shadow: none; }
.mp-root[data-mp-theme="night"] .mp-cal button.has { color: var(--text); }
.mp-root[data-mp-theme="night"] .mp-sheet { background: rgba(38, 33, 56, .92); box-shadow: 0 22px 50px rgba(0, 0, 0, .5); }

/* 夜间普通按钮不能继续用白底白字 */
.mp-root[data-mp-theme="night"] .mp-btn:not(.accent),
.mp-root[data-mp-theme="night"] .mp-btn.ghost,
.mp-root[data-mp-theme="night"] .mp-sheet-cancel {
  background: rgba(255, 255, 255, .09);
  color: var(--text);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .10);
}
.mp-root[data-mp-theme="night"] .mp-home-bar { background: rgba(236, 233, 247, .32); }
.mp-root[data-mp-theme="night"] .mp-scrim {
  background: linear-gradient(180deg, rgba(10, 8, 20, .18) 0%, rgba(10, 8, 20, .32) 60%, rgba(10, 8, 20, .52) 100%);
}

/* ------------------------------------------------------------ 缩放适配
   手机壳的尺寸由 shell.js 的 deviceScale() 按可用视口算好后写进
   inline transform（translate + scale 一起），这里不再用媒体查询改
   transform —— 否则会被 inline style 直接覆盖，短窗口下手机被上下裁掉。 */

@media (prefers-reduced-motion: reduce) {
  .mp-page .mp-thread .mp-sheet { animation: none; }
}

/* =========================================================================
   修正块：图标默认尺寸 / 状态栏层级 / 页面顶部让位
   —— 这一组放在最后，靠顺序覆盖上面的同名规则（不改原有声明）。
   ========================================================================= */

/* svg 默认按字号走，避免在没有尺寸约束的容器里撑成一大块 */
.mp-i {
  width: 1em;
  height: 1em;
  flex: 0 0 auto;
}

.mp-status .mp-i { width: 15px; height: 15px; }
.mp-di-label .mp-i { width: 13px; height: 13px; }

/* 状态栏与灵动岛永远在页面之上 */
.mp-status { z-index: 44; }
.mp-island { z-index: 45; }

/* 页面从状态栏下面开始，别把时钟压在导航上 */
.mp-page
.mp-thread {
  padding-top: 44px;
  box-sizing: border-box;
}

/* ---- 收尾：快捷动作 / 引用行 ---- */

/* 桌面图标与 Dock 之间的快捷动作，填掉中间的空档 */
.mp-quick {
  flex: 0 0 auto;
  display: flex;
  gap: 8px;
  padding: 14px 0 4px;
}

.mp-quick-btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 38px;
  border: 0;
  border-radius: 14px;
  background: rgba(255, 255, 255, .66);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .8), 0 6px 16px rgba(120, 108, 180, .12);
  color: var(--text);
  font-size: calc(12px * var(--font-scale));
  font-weight: 500;
  letter-spacing: .01em;
  cursor: pointer;
  transition: transform .16s ease;
}

.mp-quick-btn .mp-i { width: 15px; height: 15px; color: var(--accent-deep); }
.mp-quick-btn:active { transform: scale(.96); }

/* 引用：一条淡紫细线 + 两个字号的缩进，不抢气泡 */
.mp-quote-line {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  margin: 0 2px 4px;
  padding-left: 8px;
  border-left: 2px solid rgba(142, 123, 242, .5);
  font-size: calc(11.5px * var(--font-scale));
  line-height: calc(1.5 * var(--line-scale));
  color: var(--text-3);
}

.mp-quote-line .mp-i { width: 11px; height: 11px; margin-top: 2px; opacity: .7; }
.mp-quote-line span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.mp-extra-source {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 16px;
  padding: 11px 13px;
  border-radius: 14px;
  background: rgba(255, 255, 255, .56);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .7);
  font-size: calc(12.5px * var(--font-scale));
  line-height: calc(1.7 * var(--line-scale));
  color: var(--text-2);
}
.mp-extra-source .mp-i { flex: none; width: 13px; height: 13px; margin-top: 3px; opacity: .55; }
.mp-extra-source span { min-width: 0; }

/* 修正二：时间分割线居中 / 桌面图标略放大 / 日记卡三行 */
.mp-time {
  align-self: center;
  text-align: center;
  margin: 6px 0 2px;
  font-size: calc(10.5px * var(--font-scale));
  letter-spacing: .02em;
  color: var(--text-3);
}

.mp-app .mp-tile {
  width: 58px;
  height: 58px;
  border-radius: 17px;
}

.mp-app .mp-tile .mp-i { width: 25px; height: 25px; }

.mp-app .mp-app-label {
  font-size: calc(11px * var(--font-scale));
  margin-top: 4px;
}

.mp-apps {
  gap: 7px 0;
  padding-top: 12px;
}

.mp-di-text { -webkit-line-clamp: 3; }

/* 修正三：夜间主题的快捷条与机身 */
.mp-root[data-mp-theme="night"] .mp-quick-btn {
  background: rgba(255, 255, 255, .10);
  color: var(--text);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), 0 6px 16px rgba(0, 0, 0, .34);
}

.mp-root[data-mp-theme="night"] .mp-quick-btn .mp-i { color: #c9bcfb; }

.mp-root[data-mp-theme="night"] .mp-app .mp-app-label {
  color: #efeaff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
}

.mp-root[data-mp-theme="night"] .mp-device {
  background: linear-gradient(160deg, #3a3454, #221d38 58%, #36304f);
  box-shadow:
    0 40px 90px rgba(20, 12, 40, .55),
    0 0 0 1px rgba(255, 255, 255, .10),
    inset 0 0 0 1px rgba(255, 255, 255, .08);
}

/* ======================================================= 透明背景 + 回桌面 */

/* 背景四种：none 透明 / day 晨光素色 / night 夜色素色 / custom 用户图片 */
.mp-root[data-mp-wall="day"] .mp-wallpaper {
  background-image: var(--wall-day);
}

.mp-root[data-mp-wall="night"] .mp-wallpaper {
  background-image: var(--wall-night);
}

.mp-root[data-mp-wall="custom"] .mp-wallpaper {
  background-image: var(--wall-custom);
  background-position: center;
}

/* 素色底：手机壳外始终透明，只有屏幕里换成干净的浅色纸，绝不再透酒馆 */
.mp-root[data-mp-wall="none"] .mp-wallpaper,
.mp-root[data-mp-wall="none"] .mp-scrim {
  display: none;
}

.mp-root[data-mp-wall="none"] .mp-device {
  background: rgba(255, 255, 255, .12);
  box-shadow:
    0 30px 70px rgba(74, 62, 110, .20),
    inset 0 0 0 1px rgba(255, 255, 255, .55);
}

.mp-root[data-mp-wall="none"] .mp-screen {
  background: var(--page);
}

.mp-root[data-mp-wall="none"] .mp-page,
.mp-root[data-mp-wall="none"] .mp-thread,
.mp-root[data-mp-wall="none"] .mp-page-body {
  background: var(--page);
}

.mp-root[data-mp-wall="none"][data-mp-theme="night"] .mp-device {
  background: rgba(18, 14, 30, .52);
  box-shadow: 0 30px 70px rgba(10, 8, 20, .42), inset 0 0 0 1px rgba(255, 255, 255, .16);
}

.mp-root[data-mp-wall="none"][data-mp-theme="night"] .mp-screen {
  background: #12101a;
}

.mp-root[data-mp-wall="none"][data-mp-theme="night"] .mp-page,
.mp-root[data-mp-wall="none"][data-mp-theme="night"] .mp-thread {
  background: linear-gradient(180deg, #161222, #100c18);
}

/* 回桌面：底部操作条 */
.mp-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 34px;
  padding: 0 13px;
  border: 0;
  border-radius: 13px;
  font: inherit;
  font-size: calc(12px * var(--font-scale));
  color: var(--text-2);
  background: rgba(255, 255, 255, .78);
  box-shadow: inset 0 0 0 1px rgba(142, 123, 242, .16), 0 6px 16px rgba(120, 108, 180, .14);
  cursor: pointer;
  transition: transform .14s ease, box-shadow .14s ease;
}

.mp-action-btn .mp-i {
  width: 15px;
  height: 15px;
}

.mp-action-btn:hover {
  transform: translateY(-1px);
}

.mp-action-btn.primary {
  color: #fff;
  background: linear-gradient(150deg, var(--lav), var(--lav-deep));
  box-shadow: 0 8px 18px rgba(120, 102, 230, .30);
}

/* 底部小横条：加宽点击区，也可上滑 */
.mp-home-bar {
  width: 132px;
  height: 5px;
  bottom: 6px;
}

.mp-home-bar::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -8px;
  transform: translateX(-50%);
  width: 190px;
  height: 44px;
}

/* 外观页的主题小胶囊按钮 */
.mp-chip-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 0;
  border-radius: 16px;
  font: inherit;
  color: var(--text);
  background: rgba(255, 255, 255, .72);
  box-shadow: inset 0 0 0 1px rgba(142, 123, 242, .14), 0 6px 16px rgba(120, 108, 180, .10);
  cursor: pointer;
}

.mp-chip-btn.is-on {
  background: rgba(142, 123, 242, .12);
  box-shadow: inset 0 0 0 1.5px rgba(142, 123, 242, .42), 0 6px 16px rgba(120, 108, 180, .12);
}

.mp-root[data-mp-theme="night"] .mp-chip-btn {
  background: rgba(255, 255, 255, .08);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
}

.mp-root[data-mp-theme="night"] .mp-chip-btn.is-on {
  background: rgba(142, 123, 242, .22);
  box-shadow: inset 0 0 0 1.5px rgba(160, 140, 250, .5);
}

/* 会话类页面：浮在输入框上方的小胶囊，不挡消息 */
/* 操作条浮在底部，正文让出它的高度，最后一行不会被压住 */
.mp-page .mp-page-body {
  padding-bottom: 30px;
}


/* ============================ 绘图 + 接口（本段新增） ============================ */

.mp-root .mp-draw-state {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 14px;
  background: rgba(233, 177, 92, .12);
  color: #8a6a33;
  font-size: calc(12px * var(--font-scale));
  line-height: calc(1.5 * var(--line-scale));
}
.mp-root .mp-draw-state.is-on {
  background: rgba(127, 210, 188, .16);
  color: #2c7f68;
}
.mp-root .mp-draw-state .mp-i {
  width: 15px; height: 15px; flex: none;
  opacity: .8;
}
.mp-root .mp-draw-state span { flex: 1; min-width: 0; }
.mp-root .mp-draw-state-btn {

/* ===================== 图标统一：毛玻璃磁贴（本段） ===================== */
.mp-app .mp-tile {

    radial-gradient(130% 115% at 16% 6%, rgba(255, 214, 234, .34), rgba(255, 255, 255, 0) 62%),

    0 9px 20px rgba(118, 106, 168, .16),

    inset 0 -1px 0 rgba(150, 138, 205, .16),
    inset 0 0 0 1px rgba(255, 255, 255, .56);
}

.mp-app .mp-tile::after {
  inset: 0;

    linear-gradient(155deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .05) 56%, rgba(150, 132, 235, .18));
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  box-shadow:
    0 9px 22px rgba(0, 0, 0, .36),

.mp-root[data-mp-theme="night"] .mp-app .mp-tile::after {

  display: grid;
  place-items: center;
  background:
    radial-gradient(130% 115% at 16% 6%, rgba(255, 214, 234, .34), rgba(255, 255, 255, 0) 62%),
    radial-gradient(135% 120% at 90% 98%, rgba(196, 226, 222, .30), rgba(255, 255, 255, 0) 64%),
    linear-gradient(155deg, rgba(255, 255, 255, .58), rgba(255, 255, 255, .24) 58%);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  box-shadow:
    0 6px 14px rgba(118, 106, 168, .14),
    inset 0 1px 0 rgba(255, 255, 255, .92),
    inset 0 0 0 1px rgba(255, 255, 255, .52);
  color: #4f4179;
}

.mp-glass-ico .mp-i {
  width: 20px;
  height: 20px;
  opacity: .92;
}

.mp-root[data-mp-theme="night"] .mp-glass-ico {
  background:
    radial-gradient(130% 115% at 16% 6%, rgba(255, 150, 200, .16), rgba(255, 255, 255, 0) 62%),
    radial-gradient(135% 120% at 90% 98%, rgba(120, 200, 190, .14), rgba(255, 255, 255, 0) 64%),
    linear-gradient(155deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .05) 58%);
  box-shadow:
    0 6px 16px rgba(0, 0, 0, .34),
    inset 0 1px 0 rgba(255, 255, 255, .24),
    inset 0 0 0 1px rgba(255, 255, 255, .14);
  color: #f1ecff;
}

/* ===================== 用户管理（本段） ===================== */
.mp-user-list {
  padding: 4px 12px;
}

.mp-user-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 2px;
  border: 0;
  background: none;
  font: inherit;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}

.mp-user-row + .mp-user-row {
  border-top: 1px solid var(--line-soft);
}

.mp-user-row:active { opacity: .7; }

.mp-user-row .mp-avatar {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  font-size: calc(13px * var(--font-scale));
}

.mp-user-main {
  flex: 1;
  min-width: 0;
  display: block;
}

.mp-user-name {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: calc(13.5px * var(--font-scale));
  font-weight: 500;
}

.mp-user-tag {
  padding: 1px 6px;
  border-radius: 7px;
  font-size: calc(9.5px * var(--font-scale));
  font-weight: 500;
  color: var(--accent-deep);
  background: rgba(142, 123, 242, .12);
}

.mp-user-tag.is-dirty {
  color: #a8712a;
  background: rgba(233, 177, 92, .18);
}

.mp-user-desc {
  display: block;
  margin-top: 3px;
  font-size: calc(11px * var(--font-scale));
  color: var(--text-4);
  line-height: calc(1.5 * var(--line-scale));
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
}

.mp-user-row > .mp-i {
  width: 15px;
  height: 15px;
  color: var(--text-4);
  flex: none;
}

.mp-user-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 6px 0 14px;
}

.mp-user-hero-avatar {
  width: 64px;
  height: 64px;
  border-radius: 20px;
  font-size: calc(22px * var(--font-scale));
}

.mp-user-hero-name {
  font-size: calc(19px * var(--font-scale));
  font-weight: 600;
  letter-spacing: -.02em;
}

.mp-user-hero-sub {
  font-size: calc(11px * var(--font-scale));
  color: var(--text-4);
}

.mp-roles-radio {
  flex: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px rgba(142, 123, 242, .3);
}

.mp-roles-radio.is-on {
  box-shadow: inset 0 0 0 5px var(--accent-deep);
}

.mp-set-row.is-static {
  cursor: default;
}

.mp-set-row.is-on {
  background: rgba(142, 123, 242, .05);
}

.mp-user-actions {
  display: flex;
  gap: 8px;
  margin: 14px 0 4px;
}

.mp-user-actions .mp-btn {
  flex: 1;
  justify-content: center;
}

.mp-foot-note {
  margin: 10px 4px 0;
  font-size: calc(10.5px * var(--font-scale));
  line-height: calc(1.6 * var(--line-scale));
  color: var(--text-4);
}

.mp-root[data-mp-theme="night"] .mp-user-tag {
  color: #cbbffb;
  background: rgba(150, 132, 235, .22);
}

.mp-root[data-mp-theme="night"] .mp-user-tag.is-dirty {
  color: #f0c284;
  background: rgba(233, 177, 92, .2);
}

.mp-root[data-mp-theme="night"] .mp-set-row.is-on {
  background: rgba(150, 132, 235, .10);
}

.mp-root[data-mp-theme="night"] .mp-roles-radio {
  box-shadow: inset 0 0 0 1.5px rgba(190, 176, 250, .35);
}

.mp-root[data-mp-theme="night"] .mp-roles-radio.is-on {
  box-shadow: inset 0 0 0 5px #a897f2;
}

/* ===================== 查角色（本段） ===================== */
.mp-char-list {
  padding: 4px 12px;
  margin-top: 10px;
}

.mp-char-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 2px;
  border: 0;
  background: none;
  font: inherit;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}

.mp-char-row + .mp-char-row {
  border-top: 1px solid var(--line-soft);
}

.mp-char-row:active { opacity: .7; }

.mp-char-row .mp-avatar {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  font-size: calc(13px * var(--font-scale));
}

.mp-char-name {
  display: block;
  font-size: calc(13.5px * var(--font-scale));
  font-weight: 500;
}

.mp-char-sub {
  display: block;
  margin-top: 3px;
  font-size: calc(11px * var(--font-scale));
  color: var(--text-4);
  line-height: calc(1.5 * var(--line-scale));
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mp-char-row > .mp-i {
  width: 15px;
  height: 15px;
  color: var(--text-4);
  flex: none;
}

.mp-char-query {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 10px 0 0;
  padding: 5px 10px;
  border: 0;
  border-radius: 10px;
  font: inherit;
  font-size: calc(11.5px * var(--font-scale));
  color: var(--accent-deep);
  background: rgba(142, 123, 242, .1);
  cursor: pointer;
}

.mp-char-query span {
  font-size: calc(13px * var(--font-scale));
  line-height: calc(1 * var(--line-scale));
  opacity: .7;
}

.mp-char-tags {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 5px;
  margin-top: 2px;
}

.mp-char-tag {
  padding: 2px 8px;
  border-radius: 8px;
  font-size: calc(10.5px * var(--font-scale));
  color: var(--text-3);
  background: rgba(120, 116, 150, .1);
}

.mp-char-block {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: var(--r-card);
  background: var(--card);
  box-shadow: var(--shadow-s);
}

.mp-char-block:first-of-type {
  margin-top: 4px;
}

.mp-char-label {
  font-size: calc(10.5px * var(--font-scale));
  letter-spacing: .04em;
  color: var(--text-3);
}

.mp-char-text {
  margin-top: 6px;
  font-size: calc(12.5px * var(--font-scale));
  line-height: calc(1.75 * var(--line-scale));
  color: var(--text-2);
  white-space: normal;
  word-break: break-word;
}

/* 角色关联的世界书：按书分组，每条一个开关 */
.mp-wi-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 2px 8px;
}

.mp-wi-title {
  flex: 1;
  font-size: calc(12px * var(--font-scale));
  font-weight: 600;
  color: var(--text-2);
}

.mp-wi-scan
.mp-wi-retry {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 9px;
  border: 0;
  border-radius: 9px;
  font: inherit;
  font-size: calc(10.5px * var(--font-scale));
  color: var(--accent-deep);
  background: rgba(142, 123, 242, .1);
  cursor: pointer;
}

.mp-wi-scan .mp-i { width: 13px; height: 13px; }

.mp-wi-books { display: flex; flex-direction: column; gap: 10px; }

.mp-wi-book-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 0 4px 5px;
}

.mp-wi-book-name {
  flex: 1;
  min-width: 0;
  font-size: calc(11.5px * var(--font-scale));
  font-weight: 500;
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mp-wi-book-count {
  flex: none;
  font-size: calc(10px * var(--font-scale));
  color: var(--text-4);
}

.mp-wi-list { padding: 2px 12px; }

.mp-wi-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 0;
  border: 0;
  background: none;
  font: inherit;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: opacity .15s ease;
}

.mp-wi-row + .mp-wi-row { border-top: 1px solid var(--line-soft); }
.mp-wi-row.is-off { opacity: .5; }
.mp-wi-row:active { opacity: .7; }

.mp-wi-main { flex: 1; min-width: 0; }

.mp-wi-name {
  display: block;
  font-size: calc(12.5px * var(--font-scale));
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mp-wi-sub {
  display: -webkit-box;
  margin-top: 3px;
  font-size: calc(10.5px * var(--font-scale));
  line-height: calc(1.55 * var(--line-scale));
  color: var(--text-4);
  white-space: normal;
  word-break: break-word;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.mp-wi-note {
  padding: 10px 14px;
  border-radius: var(--r-card);
  background: var(--card);
  box-shadow: var(--shadow-s);
  font-size: calc(11.5px * var(--font-scale));
  line-height: calc(1.7 * var(--line-scale));
  color: var(--text-3);
}

.mp-wi-note .mp-wi-retry { margin-left: 8px; vertical-align: 1px; }

.mp-wi-total {
  margin: 8px 4px 0;
  font-size: calc(10.5px * var(--font-scale));
  line-height: calc(1.6 * var(--line-scale));
  color: var(--text-4);
}

.mp-root[data-mp-theme="night"] .mp-wi-scan,
.mp-root[data-mp-theme="night"] .mp-wi-retry {
  color: #cbbffb;
  background: rgba(150, 132, 235, .2);
}

.mp-root[data-mp-theme="night"] .mp-char-query {
  color: #cbbffb;
  background: rgba(150, 132, 235, .2);
}

.mp-root[data-mp-theme="night"] .mp-char-tag {
  color: var(--text-3);
  background: rgba(190, 180, 230, .12);
}

/* ===================== 查 TA 的手机（本段） ===================== */
.mp-cp-entry {
  width: 100%;
  justify-content: center;
  margin-bottom: 16px;
}

.mp-cp-badge {
  padding: 3px 9px;
  border-radius: 9px;
  font-size: calc(10.5px * var(--font-scale));
  color: var(--text-3);
  background: rgba(120, 116, 150, .08);
}

.mp-cp-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 2px 14px;
}

.mp-cp-head .mp-avatar {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  font-size: calc(14px * var(--font-scale));
}

.mp-cp-head-main {
  flex: 1;
  min-width: 0;
}

.mp-cp-head-name {
  font-size: calc(16px * var(--font-scale));
  font-weight: 600;
  letter-spacing: -.01em;
}

.mp-cp-head-sub {
  margin-top: 3px;
  font-size: calc(10.5px * var(--font-scale));
  color: var(--text-4);
}

.mp-cp-shell {
  border-radius: var(--r-card);
  background: var(--card);
  box-shadow: var(--shadow-s);
  overflow: hidden;
}

.mp-cp-tabs {
  display: flex;
  gap: 2px;
  padding: 6px 6px 0;
  border-bottom: 1px solid var(--line-soft);
}

.mp-cp-tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 8px 0 10px;
  border: 0;
  border-radius: 10px 10px 0 0;
  background: none;
  font: inherit;
  font-size: calc(11.5px * var(--font-scale));
  color: var(--text-3);
  cursor: pointer;
  position: relative;
}

.mp-cp-tab .mp-i {
  width: 14px;
  height: 14px;
}

.mp-cp-tab.is-on {
  color: var(--accent-deep);
  font-weight: 600;
}

.mp-cp-tab.is-on::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -1px;
  width: 22px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent-deep);
  transform: translateX(-50%);
}

.mp-cp-chats
.mp-cp-roster {
  padding: 2px 12px 6px;
  box-shadow: none;
  background: none;
  border-radius: 0;
}

.mp-cp-chat {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 2px;
  border: 0;
  background: none;
  font: inherit;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}

.mp-cp-chat + .mp-cp-chat
.mp-cp-roster .mp-user-row + .mp-user-row {
  border-top: 1px solid var(--line-soft);
}

.mp-cp-chat:active { opacity: .7; }

.mp-user-row.is-static-row {
  cursor: default;
}

.mp-cp-chat .mp-avatar
.mp-cp-roster .mp-avatar {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  font-size: calc(12px * var(--font-scale));
}

.mp-cp-chat .mp-user-desc
.mp-cp-roster .mp-user-desc {
  -webkit-line-clamp: 1;
}

.mp-cp-count {
  margin-left: 5px;
  padding: 1px 5px;
  border-radius: 6px;
  font-size: calc(9px * var(--font-scale));
  font-style: normal;
  font-weight: 400;
  color: var(--text-4);
  background: rgba(120, 116, 150, .1);
}

.mp-cp-side {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  font-size: calc(9.5px * var(--font-scale));
  color: var(--text-4);
}

.mp-cp-dot {
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  border-radius: 8px;
  font-size: calc(9px * var(--font-scale));
  font-style: normal;
  line-height: 15px;
  text-align: center;
  color: #fff;
  background: var(--accent-deep);
}

.mp-cp-feed {
  padding: 10px 12px 14px;
}

.mp-cp-moment {
  padding: 12px 0 10px;
  border-bottom: 1px solid var(--line-soft);
}

.mp-cp-moment:last-child {
  border-bottom: 0;
}

.mp-cp-moment-text {
  font-size: calc(12.5px * var(--font-scale));
  line-height: calc(1.7 * var(--line-scale));
  color: var(--text-2);
}

.mp-cp-moment-meta {
  margin-top: 6px;
  font-size: calc(10px * var(--font-scale));
  color: var(--text-4);
}

.mp-cp-comment {
  margin-top: 6px;
  padding: 6px 9px;
  border-radius: 9px;
  font-size: calc(11px * var(--font-scale));
  line-height: calc(1.6 * var(--line-scale));
  color: var(--text-3);
  background: rgba(120, 116, 150, .06);
}

.mp-cp-comment b {
  margin-right: 5px;
  font-weight: 600;
  color: var(--accent-deep);
}

/* 角色手机里的日程表：未来一周 / 一个月 / 一年 */
.mp-cp-schedule {
  padding: 4px 12px 16px;
}

.mp-cp-sched-group {
  padding-top: 12px;
}

.mp-cp-sched-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin: 0 2px 4px;
}

.mp-cp-sched-head b {
  font-size: calc(12.5px * var(--font-scale));
  font-weight: 600;
  color: var(--text);
}

.mp-cp-sched-head span {
  font-size: calc(10px * var(--font-scale));
  color: var(--text-4);
}

.mp-cp-sched-item {
  display: flex;
  gap: 10px;
  padding: 9px 2px;
  border-top: 1px solid var(--line-soft);
}

.mp-cp-sched-when {
  flex: 0 0 70px;
  font-size: calc(10.5px * var(--font-scale));
  line-height: calc(1.55 * var(--line-scale));
  color: var(--text-3);
}

.mp-cp-sched-when b {
  display: block;
  font-weight: 600;
  color: var(--text-2);
}

.mp-cp-sched-when span {
  display: block;
  color: var(--text-4);
}

.mp-cp-sched-main {
  flex: 1;
  min-width: 0;
}

.mp-cp-sched-title {
  font-size: calc(12.5px * var(--font-scale));
  font-weight: 600;
  line-height: calc(1.45 * var(--line-scale));
  color: var(--text);
}

.mp-cp-sched-note {
  margin-top: 2px;
  font-size: calc(10.5px * var(--font-scale));
  line-height: calc(1.6 * var(--line-scale));
  color: var(--text-3);
}

.mp-cp-thread-head {
  padding: 2px 2px 12px;
  font-size: calc(12px * var(--font-scale));
  color: var(--text-3);
}

.mp-cp-thread {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 10px;
}

.mp-cp-bubble-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

.mp-cp-bubble-row.is-me {
  flex-direction: row-reverse;
}

.mp-cp-bubble-row .mp-avatar {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  font-size: calc(11px * var(--font-scale));
}

.mp-cp-bubble {
  max-width: 74%;
  padding: 8px 11px;
  border-radius: 13px;
  font-size: calc(12.5px * var(--font-scale));
  line-height: calc(1.6 * var(--line-scale));
  color: var(--text);
  background: var(--card);
  box-shadow: var(--shadow-s);
}

.mp-cp-bubble-row.is-me .mp-cp-bubble {
  color: #fff;
  background: linear-gradient(150deg, #a99cf6, #8e7bf2);
}

.mp-cp-time {
  display: block;
  margin-top: 4px;
  font-size: calc(9px * var(--font-scale));
  color: var(--text-4);
}

.mp-cp-bubble-row.is-me .mp-cp-time {
  color: rgba(255, 255, 255, .7);
  text-align: right;
}

.mp-root[data-mp-theme="night"] .mp-cp-badge {
  background: rgba(190, 180, 230, .12);
}

.mp-root[data-mp-theme="night"] .mp-cp-comment {
  background: rgba(190, 180, 230, .08);
}

.mp-root[data-mp-theme="night"] .mp-cp-bubble {
  background: rgba(255, 255, 255, .07);
  color: var(--text);
}

/* ===== 本段：预设即 API（复制成新的一套） ===== */
.mp-api-clone {
  display: flex;
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 16px;
  background: rgba(255, 255, 255, .72);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--text);
  font-size: calc(13px * var(--font-scale));
}

.mp-api-clone .mp-i { width: 16px; height: 16px; }

.mp-root[data-mp-theme="night"] .mp-api-clone {
  background: rgba(255, 255, 255, .06);
}

.mp-api-row .mp-api-tag {
  margin-left: 6px;
}

/* ===== 本段：换 API（点卡片就能切） ===== */
.mp-root .mp-api-card {
  position: relative;
  width: 100%;
  border: 0;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.mp-root .mp-api-card:active { transform: scale(.98); }

.mp-api-card-swap {
  position: absolute;
  right: 9px;
  top: 9px;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: rgba(255, 255, 255, .7);
  color: var(--text-3);
}

.mp-api-card-swap .mp-i { width: 12px; height: 12px; }

.mp-root[data-mp-theme="night"] .mp-api-card-swap {
  background: rgba(255, 255, 255, .1);
}

/* ===== 本段：壁纸透进页面（不再是纯白玻璃） ===== */
.mp-root:not([data-mp-wall="none"]) .mp-page {
  background: linear-gradient(180deg, rgba(255, 252, 255, .52), rgba(248, 244, 254, .62));
}

/* ============================ 音乐 ============================ */
.mp-music {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.mp-music-hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.mp-music-hero .mp-subtitle { margin-bottom: 0; }

.mp-music-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
  padding: 0 2px;
}
.mp-music-section-head b {
  font-size: calc(13px * var(--font-scale));
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--text);
}
.mp-music-section-head span {
  font-size: calc(11px * var(--font-scale));

}

.mp-music-cover {

}
.mp-music-cover img {
  width: 100%; height: 100%;
